/* ---------- EDITOR DE TREINO ---------- */
function editW(id){
  const w=id?S.workouts.find(x=>x.id===id):{name:'',exercises:[]};
  let exs=w.exercises.map(e=>typeof e==='string'
    ?{name:e,sets:'',reps:'',note:'',link:false}
    :{name:e.name,sets:e.sets||'',reps:e.reps||'',note:e.note||'',link:!!e.link});
  // treino novo já começa com 5 exercícios em branco prontos pra preencher, em vez de 1
  if(!exs.length)exs=Array.from({length:5},()=>({name:'',sets:'',reps:'',note:'',link:false}));
  window.__adhoc=false;
  window.__exs=exs;
  // grupos musculares não são mais escolhidos aqui (a tela começa direto pelo nome do
  // treino), mas um treino já existente que tinha essa marcação continua com ela salva
  window.__muscles=(w.muscles||[]).slice();
  const draw=()=>{
    const ad=window.__adhoc;
    // aqui a rolagem só pode ser restaurada DEPOIS de drawEx() preencher os
    // exercícios — se restaurar logo após o innerHTML (como o setModalHTML faz),
    // a lista ainda está vazia, a altura rolável é menor e o valor fica truncado
    const modalEl=$('modal');
    const prevBox=modalEl.querySelector('.modal-in');
    const prevScroll=prevBox?prevBox.scrollTop:0;
    modalEl.innerHTML=`<div class="modal">
      <div class="modal-in">
        <h2>${id?'Editar treino':'Novo treino'}</h2>
        <div class="field"><label>Nome do treino</label>
          <input id="wn" value="${esc(w.name)}" placeholder="${ad?'Ex: Academia do hotel':'Ex: Peito e Tríceps'}"></div>
        <label>Exercícios</label>
        <div id="exl"></div>
        <button class="btn-ghost btn-sm" style="margin:8px 0 16px" onclick="addEx()">+ Adicionar exercício</button>
        ${id?'':`<button class="adhoc-t ${ad?'on':''}" onclick="tgAdhoc()">
          <input type="checkbox" ${ad?'checked':''} onclick="event.stopPropagation();tgAdhoc()">
          ⚡ Treino esporádico</button>
        ${ad?`<div class="adhoc-hint">Treino avulso: aparece em Meus treinos normalmente,
          mas assim que você completar a sessão pela primeira vez ele é arquivado
          automaticamente. Histórico e evolução continuam registrados normalmente.</div>`:''}`}
        <div class="row">
          <button class="btn-ghost" onclick="closeM()">Cancelar</button>
          <button class="btn-a" onclick="saveW('${id||''}')">Salvar</button>
        </div>
      </div></div>`;
    drawEx();
    const newBox=modalEl.querySelector('.modal-in');
    if(newBox)newBox.scrollTop=prevScroll;
  };
  window.tgAdhoc=()=>{
    const el=$('wn'); if(el)w.name=el.value;   // preserva o que foi digitado
    window.__adhoc=!window.__adhoc;
    draw();
  };
  window.addEx=()=>{window.__exs.push({name:'',sets:'',reps:'',note:''});drawEx();
    setTimeout(()=>{const n=document.querySelectorAll('.ex-blk .exn');
      if(n.length)n[n.length-1].focus();},50)};
  window.rmEx=i=>{window.__exs.splice(i,1);
    if(!window.__exs.length)window.__exs.push({name:'',sets:'',reps:'',note:''});drawEx()};
  window.exSet=(i,k,v)=>{window.__exs[i][k]=v};
  // a cada tecla, mostra sugestões de nomes conhecidos que batem com o que já foi
  // digitado (caixa "ao vivo", se ajustando conforme digita mais caracteres)
  window.exNameInputTpl=(i,v)=>{
    window.__exs[i].name=v;
    renderExSuggestions('exsug-tpl-'+i,v,name=>{
      if(!window.__exs[i])return;
      window.__exs[i].name=name;
      const el=document.getElementById('exn-'+i);
      if(el)el.value=name;
    });
  };
  // ao sair do campo de nome, confere se bate com a lista de exercícios conhecidos;
  // se não bater, sugere correção (ou confirma que é um exercício novo mesmo)

/* ---------- SÉRIES CONJUGADAS + REORDENAÇÃO ----------
   A conjugação é guardada como `link:true` no exercício, significando "sem descanso
   depois do exercício logo acima". Um grupo conjugado é, portanto, uma sequência de
   exercícios vizinhos. Cada exercício continua sendo registrado separadamente, então
   a evolução de carga por exercício não muda nada. */
function exGroups(list){
  // devolve, por índice, {gi,pos,size,first,last} quando o exercício faz parte de um conjugado
  const info=list.map(()=>null);
  let i=0, gi=0;
  while(i<list.length){
    let j=i+1;
    while(j<list.length&&list[j].link)j++;
    if(j-i>1){
      for(let k=i;k<j;k++)
        info[k]={gi,pos:k-i+1,size:j-i,first:k===i,last:k===j-1};
      gi++;
    }
    i=j;
  }
  return info;
}
const GRP_LETTER=n=>String.fromCharCode(65+(n%26));
function grpTag(g){
  return g?`<span class="ex-tag">${GRP_LETTER(g.gi)}${g.pos}</span>`:'';
}
// resumo textual dos conjugados de uma sessão (usado no relatório .md)
function supersetSummary(exs){
  const gi=exGroups(exs), out=[]; let cur=null;
  exs.forEach((e,i)=>{
    const g=gi[i];
    if(!g){cur=null;return;}
    if(g.first){cur={l:GRP_LETTER(g.gi),names:[e.name]};out.push(cur);}
    else if(cur)cur.names.push(e.name);
  });
  return out;
}
// lista compacta com setas de ordem (e, opcionalmente, botões de conjugar entre linhas)
let ordMode=false;
window.tgOrdMode=()=>{ordMode=!ordMode;render()};
function ordListHTML(list,moveFn,linkFn,allowLink){
  const gi=exGroups(list);
  let h=`<div style="font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:14px">
    Use <b style="color:var(--txt)">↑ ↓</b> para mudar a ordem de execução.${allowLink?`
    Toque em <b style="color:var(--txt)">conjugar</b> entre dois exercícios para fazer
    série conjugada (bi-set/tri-set: sem descanso entre eles). Cada exercício continua
    sendo registrado separadamente, então a evolução de carga de cada um não se perde.`:''}</div>`;
  list.forEach((ex,i)=>{
    if(allowLink&&i>0){
      const on=!!ex.link;
      h+=`<div class="lnk-row">
        <button class="lnk-btn ${on?'on':''}" onclick="${linkFn}(${i})">${on?'🔗 conjugado':'+ conjugar'}</button>
        <div class="lnk-line"></div></div>`;
    }
    const g=gi[i];
    h+=`<div class="ord-row2 ${g?'ing':''}">
      <span class="on2">${g?GRP_LETTER(g.gi)+g.pos:(i+1)}</span>
      <span class="onm">${esc(ex.name)}${ex.temp?' <span class="tag-pc" style="background:rgba(139,144,163,.18);color:var(--dim)">SÓ HOJE</span>':''}</span>
      <button class="ord-btn2" ${i===0?'disabled':''} onclick="${moveFn}(${i},-1)">↑</button>
      <button class="ord-btn2" ${i===list.length-1?'disabled':''} onclick="${moveFn}(${i},1)">↓</button>
    </div>`;
  });
  return h;
}
// troca dois exercícios de lugar mantendo a conjugação presa à POSIÇÃO, não ao
// exercício: assim, trocar a ordem dentro de um bi-set preserva o bi-set, que é o
// caso comum de "a máquina está ocupada, vou inverter".
function swapKeepingLinks(L,i,dir){
  const j=i+dir;
  if(j<0||j>=L.length)return false;
  const la=L[i].link, lb=L[j].link;
  const t=L[i]; L[i]=L[j]; L[j]=t;
  L[i].link=la; L[j].link=lb;
  if(L.length)L[0].link=false;
  return true;
}
window.moveLiveEx=(i,d)=>{if(swapKeepingLinks(live.exercises,i,d))render()};
window.tgLink=i=>{
  if(i<=0)return;
  live.exercises[i].link=!live.exercises[i].link;

};

// grava a ordem (e as conjugações) atuais como padrão do treino salvo
async function saveOrderInto(target,liveList){
  const byName={};
  target.exercises.forEach(e=>{byName[e.name]=e});
  const next=[];
  liveList.forEach(ex=>{
    if(ex.temp)return;                    // exercício avulso não entra no treino salvo
    const base=byName[ex.name]||{name:ex.name};
    delete byName[ex.name];
    next.push(Object.assign({},base,{name:ex.name,link:!!ex.link}));
  });
  // segurança: exercícios do treino que não estavam nesta sessão vão para o fim
  Object.keys(byName).forEach(k=>next.push(byName[k]));
  if(next.length)next[0].link=false;
  target.exercises=next;
  await save();
}

    exercises:cur.exercises.map(e=>{
      const p=prevSets(id,e.name);
      const tg=liveTargets[e.name];
      const n=tg&&parseInt(tg.sets)?parseInt(tg.sets):(p?p.sets.length:3);
      return{name:e.name,bw:p?!!p.bw:false,link:!!e.link,
        sets:Array.from({length:n},()=>({reps:'',peso:''}))};
    })};
  if(live.exercises.length)live.exercises[0].link=false;
  ordMode=false;
  t0=Date.now(); // usado só para calcular a duração da sessão ao finalizar (sem cronômetro visível)
  clearInterval(tick);
  view='session';render();
};
function session(){
  $('title').textContent=cur.name;
  const l=lastSession(cur.id);
  $('sub').textContent=l?'Anterior: '+fdate(l.date):'Primeira sessão';
  $('back').style.display='block';$('timer').textContent='';
  let h='';
  const wc=wColor(cur);
  if(wc)h+=`<div style="height:3px;background:${wc};border-radius:2px;margin:0 0 12px"></div>`;
  h+=musclesPillHTML(cur.muscles);

  // --- modo reordenar / conjugar ---
  if(ordMode){
    h+=ordListHTML(live.exercises,'moveLiveEx','tgLink',true);
    h+=`<button class="btn-ghost btn-sm" style="width:100%;margin-top:16px" onclick="saveOrderDefault()">
      💾 Salvar esta ordem e as conjugações no treino</button>
      <div style="font-size:11px;color:var(--dim);line-height:1.5;margin-top:8px">

  const ld=new Date(live.date);

  const backfill=dayKey(live.date)!==dayKey(Date.now());
  h+=`<div class="card" style="display:flex;align-items:center;gap:12px${backfill?';box-shadow:inset 0 0 0 1.5px var(--accent)':''}">
    <div style="flex:1">
      <label style="margin:0 0 3px">Data do treino</label>
      <div style="font-size:11.5px;color:var(--dim)">${backfill?'⚠️ Lançando para outro dia, não hoje':'Esqueceu de registrar no dia? Toque para ajustar a data.'}</div>
    </div>
    <input type="date" style="width:auto;flex:none" value="${ldv}" onchange="setLiveDate(this.value)"></div>`;
  h+=`<button class="btn-ghost btn-sm" style="width:100%;margin:0 0 14px" onclick="tgOrdMode()">
    🔀 Reordenar / conjugar exercícios</button>`;
  const gi=exGroups(live.exercises);
  live.exercises.forEach((ex,i)=>{
    const p=prevSets(live.wid,ex.name);
    const g=gi[i];
    if(g&&g.first){
      h+=`<div class="grp"><div class="grp-hd">🔗 Conjugado ${GRP_LETTER(g.gi)}
        <span class="gh-sub">${g.size} exercícios · sem descanso entre eles</span></div>`;
    }
    h+=`<div class="ex-block">
      <div class="ex-head"><strong>${grpTag(g)}${esc(ex.name)}${ex.temp?'<span class="tag-pc" style="background:rgba(139,144,163,.18);color:var(--dim)">SÓ HOJE</span>':''}${ex.swapped?'<span class="tag-pc" style="background:rgba(91,141,239,.18);color:#5b8def">TROCADO</span>':''}</strong>
        <div style="display:flex;align-items:center;gap:10px">
        <label class="bw-tog ${ex.bw?'on':''}">
          <input type="checkbox" ${ex.bw?'checked':''} onchange="setBW(${i},this.checked)">PC</label>
        <button class="btn-sm btn-ghost" onclick="openSwapEx(${i})" title="Trocar exercício (só neste treino)">🔁</button>
        <button class="btn-sm btn-ghost" onclick="addSet(${i})">+ série</button></div></div>
      <div class="ex-body">`;
    if(p){
      const sameW=p.wid===live.wid;
      const dias=Math.round((Date.now()-p.date)/86400000);
      const quando=dias===0?'hoje':dias===1?'ontem':`há ${dias} dias`;
      h+='<div class="prev">Última vez'+(p.bw?' <span class="tag-pc">PESO CORPORAL</span>':'')+': '+
        p.sets.map((s,n)=>`<span class="pill">${n+1}ª <b>${p.bw?esc(s.reps)+' reps':esc(s.reps)+'×'+esc(s.peso)+'kg'}</b></span>`).join('')+
        `<div style="margin-top:5px;font-size:11px;opacity:.8">${quando}${sameW?'':' · em '+esc(p.wname)}</div></div>`;
    }else{
      h+='<div class="prev">Sem registro anterior deste exercício.</div>';
    }
    const tg=live.targets?live.targets[ex.name]:null;
    if(tg&&(tg.sets||tg.reps||tg.note)){
      h+=`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px">
        <div style="flex:1">
          ${(tg.sets||tg.reps)?`<div class="prev" style="color:var(--accent);margin:0">🎯 Alvo:
            <b>${tg.sets||''}× ${tg.reps||'—'} reps</b></div>`:''}
          ${tg.note?`<div class="prev" style="margin:${(tg.sets||tg.reps)?'4px':'0'} 0 0">📝 ${esc(tg.note)}</div>`:''}
        </div>
        <button style="flex:none;background:transparent;color:#ff5a5a;padding:4px 6px;font-size:17px;line-height:1"
          onclick="rmTarget(${i})" title="Remover alvo">✕</button>
      </div>`;
    }
    h+=`<div class="set-hdr"><div>#</div><div>Reps</div>
      <div>${ex.bw?'Peso corporal':'Carga (kg)'}</div><div></div></div>`;
    ex.sets.forEach((s,j)=>{
      const pr=p&&p.sets[j];
      h+=`<div class="set">
        <div class="set-n">${j+1}</div>
        <input type="number" inputmode="numeric" pattern="[0-9]*" value="${esc(s.reps)}"
          placeholder="${pr?esc(pr.reps):'–'}" onchange="setV(${i},${j},'reps',this.value)">
        <input type="number" inputmode="decimal" step="0.5" value="${esc(s.peso)}"
          placeholder="${ex.bw?'—':(pr?esc(pr.peso):'–')}" ${ex.bw?'disabled':''}
          onchange="setV(${i},${j},'peso',this.value)">
        <button class="del" onclick="rmSet(${i},${j})">✕</button></div>`;
    });
    h+='</div></div>';
    if(g&&g.last)h+='</div>';
  });
  h+=`<button class="btn-ghost btn-sm" style="width:100%;margin:2px 0 16px" onclick="openAddEx()">+ Adicionar exercício</button>`;
  $('app').innerHTML=h;
  $('fab').innerHTML='<button class="fab btn-g" style="bottom:calc(env(safe-area-inset-bottom) + 18px)" onclick="finish()">✓ Finalizar treino</button>';
}
/* ---------- ADICIONAR EXERCÍCIO DURANTE A SESSÃO (musculação) ---------- */
window.openAddEx=()=>{

  window.__newExOnce=false;
  const draw=()=>{
    const once=window.__newExOnce;
    $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()">
      <div class="modal-in">
        <h2>Adicionar exercício</h2>
        <div class="field"><label>Nome do exercício</label>
          <div class="ex-name-wrap" style="position:relative">
            <input id="nex" value="${esc(window.__newEx.name)}" placeholder="Ex: Crucifixo"
              oninput="exNameInputNex(this.value)" onblur="exNameBlurNex()">

          </div>
        </div>

          <div class="mini-f"><label>Séries</label>

              placeholder="3" oninput="newExSet('sets',this.value)"></div>
          <div class="mini-f"><label>Reps</label>

        </div>

          <input value="${esc(window.__newEx.note)}" placeholder="Ex: cadência lenta na descida"
            oninput="newExSet('note',this.value)"></div>
        <button class="adhoc-t ${once?'on':''}" style="margin-top:14px" onclick="tgNewExOnce()">
          <input type="checkbox" ${once?'checked':''} onclick="event.stopPropagation();tgNewExOnce()">
          ⚡ Só nesta sessão</button>
        <div class="adhoc-hint">${once
          ?'Este exercício entra só no treino de hoje — o treino salvo não muda.'
          :'Este exercício passa a fazer parte do treino a partir de agora, entrando nas próximas execuções também.'}</div>
        <div class="row" style="margin-top:16px">

          <button class="btn-a" onclick="confirmAddEx()">Adicionar</button>

    setTimeout(()=>{const el=$('nex');if(el)el.focus()},150);
  };
  window.newExSet=(k,v)=>{window.__newEx[k]=v};

    window.__newEx.name=v;
    renderExSuggestions('exsug-nex',v,name=>{
      window.__newEx.name=name;
      const el=$('nex');
      if(el)el.value=name;
    });
  };
  window.exNameBlurNex=()=>{hideExSuggestions('exsug-nex');};
  window.tgNewExOnce=()=>{
    const el=$('nex'); if(el)window.__newEx.name=el.value;
    window.__newExOnce=!window.__newExOnce;

  draw();
};
window.confirmAddEx=async()=>{
  let name=($('nex').value||'').trim();
  if(!name)return toast('Dê um nome ao exercício');
  const nm=matchExerciseName(name);
  if(nm.status==='suggest'||nm.status==='new'){
    const result=await askExerciseNameCheck(name,nm.status==='suggest'?nm.suggestion:null);
    if(result==null)return; // "Corrigir": deixa o modal de adicionar aberto pro usuário ajustar
    name=result;
  }
  if(live.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase()))
    return toast('Já existe um exercício com esse nome nesta sessão');
  const sets=window.__newEx.sets, reps=window.__newEx.reps, note=(window.__newEx.note||'').trim();
  const once=window.__newExOnce;
  const n=parseInt(sets)||3;
  live.exercises.push({name,bw:false,sets:Array.from({length:n},()=>({reps:'',peso:''})),temp:once});
  if(live.targets&&(sets||reps||note))live.targets[name]={sets:sets||'',reps:reps||'',note};
  if(!once){
    cur.exercises.push({name,sets:sets||'',reps:reps||'',note});
    await save();
  }
  closeM();render();
  toast(once?'Exercício adicionado só nesta sessão':'Exercício adicionado ao treino');
};
window.setLiveDate=v=>{
  const [y,m,d]=v.split('-').map(Number);
  const o=new Date(live.date); o.setFullYear(y,m-1,d); live.date=o.getTime();
  render();
};
window.rmTarget=i=>{
  const ex=live.exercises[i];
  if(live.targets)delete live.targets[ex.name];
  render();
};
window.setV=(i,j,k,v)=>{live.exercises[i].sets[j][k]=v};
window.setBW=(i,v)=>{
  const ex=live.exercises[i];
  ex.bw=v;
  // peso corporal: a carga do dia não importa, só reps — limpa o que já tinha
  if(v)ex.sets.forEach(s=>{s.peso=''});

};
window.addSet=i=>{const st=live.exercises[i].sets;
  const bw=live.exercises[i].bw;
  const last=st[st.length-1]||{reps:'',peso:''};
  st.push({reps:last.reps,peso:bw?'':last.peso});render()};
window.rmSet=(i,j)=>{live.exercises[i].sets.splice(j,1);render()};

/* ---------- TROCAR EXERCÍCIO (só nesta sessão) ---------- */
window.openSwapEx=i=>{
  window.__swapIdx=i;
  window.__swapQ='';
  const used=new Set(live.exercises.map(e=>e.name.toLowerCase()));
  const pool=new Set();
  S.workouts.forEach(w=>{ if(w.kind!=='mobility')(w.exercises||[]).forEach(e=>pool.add(e.name)); });
  S.history.forEach(h=>{ (h.exercises||[]).forEach(e=>pool.add(e.name)); });
  // além dos exercícios já usados em treinos/histórico, também oferece a lista de nomes
  // conhecidos do app (embutidos + aprendidos) — assim a busca de troca sugere exercícios
  // "clássicos" mesmo que você nunca os tenha registrado antes
  allKnownExerciseNames().forEach(n=>pool.add(n));
  window.__swapPool=[...pool].filter(n=>!used.has(n.toLowerCase())).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  drawSwapEx();
};
function drawSwapEx(){
  // desenha o modal uma única vez (com um container vazio pros resultados);
  // a busca (swapExQ) só atualiza esse container depois, sem recriar o <input>
  // — recriar o campo a cada tecla jogava o cursor pro início e invertia a digitação.
  const i=window.__swapIdx;
  const cur=live.exercises[i];
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()">
    <div class="modal-in">
      <h2>Trocar exercício</h2>
      <div style="font-size:12.5px;color:var(--dim);margin:-6px 0 14px">
        Troca "${esc(cur.name)}" só neste treino de hoje — o treino salvo não muda, e as séries já
        preenchidas nos outros exercícios continuam aí.</div>
      <div class="field"><label>Novo exercício</label>
        <input id="swapq" value="${esc(window.__swapQ)}" placeholder="Buscar ou digitar um nome novo..."
          oninput="swapExQ(this.value)"></div>
      <div id="swapRes" style="max-height:230px;overflow:auto;margin:8px 0 0"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn-ghost" onclick="closeM()">Cancelar</button>
        <button class="btn-a" onclick="confirmSwapExCustom()">Usar nome digitado</button>
      </div>
    </div></div>`;
  renderSwapRes();
  setTimeout(()=>{const el=$('swapq');if(el)el.focus()},150);
}
function renderSwapRes(){
  const q=(window.__swapQ||'').toLowerCase();
  const filtered=q?window.__swapPool.filter(n=>n.toLowerCase().includes(q)):window.__swapPool;
  window.__swapFiltered=filtered;
  const el=$('swapRes');
  if(!el)return;
  el.innerHTML=filtered.length?filtered.map((n,idx)=>`<button class="menu-item" data-act="swapex" data-arg="${idx}">
      <span class="ic">🔁</span>${esc(n)}</button>`).join('')
    :`<div class="empty" style="padding:14px 6px">${window.__swapPool.length?'Nenhum exercício encontrado.':'Nenhum outro exercício cadastrado ainda — digite um nome novo abaixo.'}</div>`;
}
window.swapExQ=v=>{window.__swapQ=v;renderSwapRes();};
window.confirmSwapExCustom=async()=>{
  const el=$('swapq');
  let name=(el?el.value:'').trim();
  if(!name)return toast('Digite um nome ou escolha um da lista');
  const nm=matchExerciseName(name);
  if(nm.status==='suggest'||nm.status==='new'){
    const result=await askExerciseNameCheck(name,nm.status==='suggest'?nm.suggestion:null);
    if(result==null)return; // "Corrigir": deixa o modal de troca aberto pro usuário ajustar
    name=result;
  }
  doSwapEx(name);
};
function doSwapEx(name){
  name=(name||'').trim();
  if(!name)return toast('Escolha ou digite um nome');
  const i=window.__swapIdx;
  if(live.exercises.some((e,idx)=>idx!==i&&e.name.toLowerCase()===name.toLowerCase()))
    return toast('Já existe um exercício com esse nome nesta sessão');
  live.exercises[i].name=name;
  live.exercises[i].swapped=true;
  closeM();render();
  toast('Exercício trocado — vale só para hoje');
}
window.finish=async()=>{
  // guarda o índice original para não deixar um conjugado "órfão" quando o
  // exercício de cima da dupla não foi preenchido e some do registro
  const kept=live.exercises.map((e,idx)=>({e,idx,
    sets:e.sets.filter(s=>s.reps!==''||s.peso!=='')})).filter(x=>x.sets.length);
  const keptIdx=new Set(kept.map(x=>x.idx));
  const ex=kept.map((x,n)=>({name:x.e.name,bw:!!x.e.bw,
    link:n>0&&!!x.e.link&&keptIdx.has(x.idx-1),
    sets:x.sets}));
  if(!ex.length){if(!await ask('Sair sem salvar?','Nenhuma série foi preenchida neste treino.','Sair',true))return;
    clearInterval(tick);await cleanupAdhoc();view='home';render();return;}
  if(!await ask('Finalizar treino?','Isso salva o treino no histórico como concluído.','Finalizar',false))return;
  const dur=Math.floor((Date.now()-t0)/60000);
  const sid=uid();
  const wDone=S.workouts.find(x=>x.id===live.wid);
  S.history.push({id:sid,wid:live.wid,name:live.name,date:live.date,dur,exercises:ex,
    muscles:(wDone&&wDone.muscles)||[]});
  // treino esporádico: arquiva automaticamente após a primeira vez que é realizado
  if(wDone&&wDone.adhoc&&!wDone.archived)wDone.archived=true;
  // vincula ao plano
  const pl=live.planId?plans().find(p=>p.id===live.planId)
    :matchPlan('gym',live.date,{wid:live.wid});
  if(pl&&!pl.doneId)pl.doneId=sid;
  await save();clearInterval(tick);view='home';render();toast('Treino salvo ✓');
};

window.setHFlt=v=>{hFlt=v;hRunT='all';hGymW='all';hGymM='all';hMobW='all';render()};
window.setHRunT=v=>{hRunT=v;render()};
window.setHGymW=v=>{hGymW=v;render()};
window.setHGymM=v=>{hGymM=v;render()};
window.setHMobW=v=>{hMobW=v;render()};

function hist(){
  $('title').textContent='Histórico';
  $('back').style.display='block';$('timer').textContent='';
  const gsAll=S.history.map(s=>({k:'gym',date:s.date,d:s}));
  const rrAll=runs().map(r=>({k:'run',date:r.date,d:r}));
  const msAll=S.mobility.map(m=>({k:'mobility',date:m.date,d:m}));

  // filtro nível 1
  let base = hFlt==='gym'?gsAll : hFlt==='run'?rrAll : hFlt==='mobility'?msAll : [...gsAll,...rrAll,...msAll];
  // filtro nível 2
  if(hFlt==='run'&&hRunT!=='all')base=base.filter(x=>x.d.type===hRunT);
  if(hFlt==='gym'&&hGymW!=='all')base=base.filter(x=>x.d.wid===hGymW);
  if(hFlt==='gym'&&hGymM!=='all')base=base.filter(x=>(x.d.muscles||[]).includes(hGymM));
  if(hFlt==='mobility'&&hMobW!=='all')base=base.filter(x=>x.d.wid===hMobW);
  const all=base.sort((a,b)=>b.date-a.date);

  $('sub').textContent=`${gsAll.length} musculação · ${rrAll.length} corrida · ${msAll.length} mobilidade`;

  let h=`<div class="seg" style="margin-bottom:12px">
    <button class="${histView==='list'?'on':''}" onclick="setHistView('list')">🕘 Lista</button>
    <button class="${histView==='cal'?'on':''}" onclick="setHistView('cal')">📅 Calendário</button>
  </div>`;

  h+=`<div class="flt">
    <button class="fb ${hFlt==='all'?'on':''}" onclick="setHFlt('all')">
      Todos <span class="fc">${gsAll.length+rrAll.length+msAll.length}</span></button>
    <button class="fb ${hFlt==='gym'?'on':''}" style="--fbc:var(--accent)" onclick="setHFlt('gym')">
      🏋️ Musculação <span class="fc">${gsAll.length}</span></button>
    <button class="fb ${hFlt==='run'?'on':''}" style="--fbc:#5b8def" onclick="setHFlt('run')">
      🏃 Corrida <span class="fc">${rrAll.length}</span></button>
    <button class="fb ${hFlt==='mobility'?'on':''}" style="--fbc:#5f9e8f" onclick="setHFlt('mobility')">
      🧘 Mobilidade <span class="fc">${msAll.length}</span></button>
  </div>`;

  // subfiltro de mobilidade
  if(hFlt==='mobility'&&msAll.length){
    const ids=[...new Set(msAll.map(x=>x.d.wid))];
    if(ids.length>1){
      h+=`<div class="flt-sub"><div class="fl">Treino</div><div class="flt">
        <button class="fb ${hMobW==='all'?'on':''}" style="--fbc:#5f9e8f" onclick="setHMobW('all')">
          Todos <span class="fc">${msAll.length}</span></button>
        ${ids.map(id=>{
          const w=S.workouts.find(x=>x.id===id);
          const hs=msAll.filter(x=>x.d.wid===id);
          const nm=w?w.name:(hs[0]?hs[0].d.name:'(removido)');
          return `<button class="fb ${hMobW===id?'on':''}" style="--fbc:#5f9e8f" onclick="setHMobW('${id}')">
            ${esc(nm)}${w&&w.archived?' 📦':''} <span class="fc">${hs.length}</span></button>`;
        }).join('')}</div></div>`;
    }
  }

  // subfiltro de corrida
  if(hFlt==='run'&&rrAll.length){
    const used=RUN_TYPES.filter(t=>rrAll.some(x=>x.d.type===t[0]));
    if(used.length>1){
      h+=`<div class="flt-sub"><div class="fl">Tipo de treino</div><div class="flt">
        <button class="fb ${hRunT==='all'?'on':''}" style="--fbc:#5b8def" onclick="setHRunT('all')">
          Todos <span class="fc">${rrAll.length}</span></button>
        ${used.map(t=>{
          const n=rrAll.filter(x=>x.d.type===t[0]).length;
          return `<button class="fb ${hRunT===t[0]?'on':''}" style="--fbc:${t[3]}" onclick="setHRunT('${t[0]}')">
            <i style="background:${t[3]}"></i>${t[1]} <span class="fc">${n}</span></button>`;
        }).join('')}</div></div>`;
    }
  }
  // subfiltro de musculação
  if(hFlt==='gym'&&gsAll.length){
    const ids=[...new Set(gsAll.map(x=>x.d.wid))];
    if(ids.length>1){
      h+=`<div class="flt-sub"><div class="fl">Treino</div><div class="flt">
        <button class="fb ${hGymW==='all'?'on':''}" style="--fbc:var(--accent)" onclick="setHGymW('all')">

  // resumo do recorte

          ${levelBadge(r)}
        </div>${structSummary(r)}</div>`;
      return;
    }
    if(it.k==='mobility'){
      const m=it.d;
      const w=S.workouts.find(x=>x.id===m.wid);
      const c=wColor(w);
      h+=`<div class="card w-card" ${c?`data-c="1" style="--wc:${c}"`:''}><div class="hist-row">

      </div></div>`;
      return;
    }

    const w=S.workouts.find(x=>x.id===s.wid);
    const c=wColor(w);
    const exp=histExp.has(s.id);
    const vol=s.exercises.reduce((a,e)=>a+e.sets.reduce((b,x)=>
      b+(parseFloat(x.reps)||0)*(parseFloat(x.peso)||0),0),0);
    h+=`<div class="card w-card" ${c?`data-c="1" style="--wc:${c}"`:''}>

      </div>`;

      const hg=exGroups(s.exercises);
      s.exercises.forEach((e,ei)=>{
        h+=`<div class="hist-row"><span style="color:var(--txt)">${grpTag(hg[ei])}${esc(e.name)}${e.bw?'<span class="tag-pc">PC</span>':''}</span>
          <span>${e.sets.map(x=>fmtSet(x.reps,x.peso,e.bw)).join(' · ')}</span></div>`;
      });
      h+=`<div class="hist-row"><span>Volume total</span><span><b style="color:var(--accent2)">${Math.round(vol)} kg</b></span></div>`;

      </div>`;

}

        <div style="display:flex;align-items:center;gap:10px;flex:none">

          <input type="checkbox" ${ex.bw?'checked':''} onchange="ehBW(${i},this.checked)">PC</label>
        <button class="btn-sm btn-ghost" onclick="ehAddSet(${i})">+ série</button></div></div>
      <div class="ex-body">
        <div class="set-hdr"><div>#</div><div>Reps</div>
          <div>${ex.bw?'Peso corporal':'Carga (kg)'}</div><div></div></div>
        ${ex.sets.map((st,j)=>`<div class="set">
          <div class="set-n">${j+1}</div>
          <input type="number" inputmode="numeric" pattern="[0-9]*" value="${esc(st.reps)}"
            placeholder="–" oninput="ehVal(${i},${j},'reps',this.value)">
          <input type="number" inputmode="decimal" step="0.5" value="${esc(st.peso)}"
            placeholder="${ex.bw?'—':'–'}" ${ex.bw?'disabled':''} oninput="ehVal(${i},${j},'peso',this.value)">
          <button class="del" onclick="ehRmSet(${i},${j})">✕</button></div>`).join('')}

      <button class="btn-a" onclick="saveEditHist()">Salvar</button></div>

window.ehDate=v=>{

window.ehBW=(i,v)=>{

window.ehVal=(i,j,k,v)=>{window.__ehExs[i].sets[j][k]=v;};
window.ehName=(i,v)=>{window.__ehExs[i].name=v;};
window.ehNameBlur=i=>{
  const typed=window.__ehExs[i]&&window.__ehExs[i].name;

window.ehAddSet=i=>{const st=window.__ehExs[i].sets;
  const bw=window.__ehExs[i].bw;

window.ehRmSet=(i,j)=>{window.__ehExs[i].sets.splice(j,1);drawEditHist();};
window.saveEditHist=async()=>{
  const s=S.history.find(x=>x.id===window.__ehId); if(!s)return;
  const keptE=window.__ehExs.map((e,idx)=>({e,idx,
    sets:e.sets.filter(st=>st.reps!==''||st.peso!=='')})).filter(x=>x.sets.length);
  const keptEi=new Set(keptE.map(x=>x.idx));
  const exs=keptE.map((x,n)=>({name:(x.e.name||'').trim()||'Exercício',bw:!!x.e.bw,
    link:n>0&&!!x.e.link&&keptEi.has(x.idx-1),sets:x.sets}));
  if(!exs.length)return toast('Mantenha ao menos uma série preenchida');

let repMode='workout', repSel='';
window.openRep=()=>{view='rep';repSel='';render()};
window.setMode=m=>{repMode=m;repSel='';render()};
window.setSel=v=>{repSel=v;render()};

const num=v=>parseFloat(String(v).replace(',','.'))||0;
const volOf=sets=>sets.reduce((a,s)=>a+num(s.reps)*num(s.peso),0);
const maxOf=sets=>sets.reduce((a,s)=>Math.max(a,num(s.peso)),0);
const repsOf=sets=>sets.reduce((a,s)=>a+num(s.reps),0);
// 1RM estimado (Epley) usando a melhor série
const e1rm=sets=>sets.reduce((a,s)=>{
  const p=num(s.peso),r=num(s.reps);
  return p&&r?Math.max(a,p*(1+r/30)):a;},0);

function pct(first,last){
  if(!first)return null;
  return ((last-first)/first)*100;
}
function deltaHTML(first,last,unit){
  const d=last-first, p=pct(first,last);
  if(p===null||Math.abs(d)<0.01)return '<span class="delta flat">— sem variação</span>';
  const cls=d>0?'up':'down', arw=d>0?'▲':'▼';
  return `<span class="delta ${cls}">${arw} ${d>0?'+':''}${d.toFixed(1)}${unit}`+
    (p!==null?` (${p>0?'+':''}${p.toFixed(0)}%)`:'')+'</span>';
}
function sparkline(vals,labels){
  if(vals.length<2)return '';
  const w=300,h=76,pad=8;
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>{
    const x=pad+(i/(vals.length-1))*(w-pad*2);
    const y=h-pad-((v-mn)/rng)*(h-pad*2);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${h-pad} L${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const rising=vals[vals.length-1]>=vals[0];
  const col=rising?'var(--accent2)':'#ff5a5a';
  const dots=pts.map((p,i)=>
    `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?3.5:2.3}"
      fill="${col}"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${area}" fill="${col}" opacity=".12"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>
    <div class="axis"><span>${labels[0]}</span><span>${labels[labels.length-1]}</span></div>`;
}

function repWorkout(){
  // agrupa por ID (não por nome) — dois treinos podem ter o mesmo nome
  const ids=[...new Set(S.history.map(h=>h.wid))];
  if(!ids.length)return '<div class="empty">Nenhuma sessão registrada ainda.<br>Faça alguns treinos para ver a evolução.</div>';
  const wOpts=ids.map(id=>{
    const w=S.workouts.find(x=>x.id===id);
    const hs=S.history.filter(h=>h.wid===id);
    const nm=w?w.name:(hs[0]?hs[0].name:'(removido)');
    const dup=ids.filter(o=>{
      const ow=S.workouts.find(x=>x.id===o);
      const ohs=S.history.filter(h=>h.wid===o);
      return (ow?ow.name:(ohs[0]?ohs[0].name:''))===nm;
    }).length>1;
    let lbl=nm;
    if(dup)lbl+=' · desde '+fdate(Math.min(...hs.map(h=>h.date)));
    if(w&&w.archived)lbl+=' [arquivado]';
    if(!w)lbl+=' [excluído]';
    return{id,lbl};
  });
  const opts=wOpts;
  const sel=opts.find(o=>o.id===repSel)?repSel:opts[0].id;
  let h=`<div class="field"><label>Selecione o treino</label>
    <select onchange="setSel(this.value)">
      ${wOpts.map(o=>
        `<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.lbl)}</option>`).join('')}
    </select></div>`;
  const ss=S.history.filter(x=>x.wid===sel).sort((a,b)=>a.date-b.date);
  if(ss.length<2){
    return h+`<div class="empty">Apenas ${ss.length} sessão registrada deste treino.<br>São necessárias pelo menos 2 para comparar.</div>`;
  }
  const vols=ss.map(s=>s.exercises.reduce((a,e)=>a+volOf(e.sets),0));
  const labs=ss.map(s=>fdate(s.date).slice(0,5));
  const f=vols[0],l=vols[vols.length-1];
  h+=`<div class="card">
    <div class="rep-h"><strong>Volume total por sessão</strong>${deltaHTML(f,l,' kg')}</div>
    ${sparkline(vols,labs)}
    <div class="stats">
      <div class="stat"><b>${ss.length}</b><span>sessões</span></div>
      <div class="stat"><b>${Math.round(Math.max(...vols))}</b><span>pico kg</span></div>
      <div class="stat"><b>${Math.round(vols.reduce((a,b)=>a+b,0)/vols.length)}</b><span>média kg</span></div>
    </div>
    <div class="rec">Volume = soma de (repetições × peso) de todas as séries.</div></div>`;

  // por exercício dentro do treino
  const exNames=[...new Set(ss.flatMap(s=>s.exercises.map(e=>e.name)))];
  h+='<div style="margin:16px 0 8px;font-size:13px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.5px">Por exercício</div>';
  exNames.forEach(n=>{
    const isBW=ss.some(s=>{const e=s.exercises.find(x=>x.name===n);return e&&e.bw});
    const pcTag=isBW?'<span class="tag-pc">PC</span>':'';
    const pts=ss.map(s=>{const e=s.exercises.find(x=>x.name===n);
      return e?{d:s.date,mx:maxOf(e.sets),vol:volOf(e.sets)}:null}).filter(Boolean);
    if(pts.length<2){
      h+=`<div class="card"><div class="rep-h"><strong>${esc(n)}${pcTag}</strong>
        <span class="delta flat">1 registro</span></div>
        <div class="mini">Carga máx: <b>${pts.length?pts[0].mx:0} kg</b></div></div>`;
      return;
    }
    const mxs=pts.map(p=>p.mx), ls=pts.map(p=>fdate(p.d).slice(0,5));
    h+=`<div class="card">
      <div class="rep-h"><strong>${esc(n)}${pcTag}</strong>${deltaHTML(mxs[0],mxs[mxs.length-1],' kg')}</div>
      ${sparkline(mxs,ls)}
      <div class="mini">${isBW?'Peso corporal':'Carga máxima'}: <b>${mxs[0]} kg</b> → <b>${mxs[mxs.length-1]} kg</b>
        · recorde <b>${Math.max(...mxs)} kg</b></div></div>`;
  });
  return h;
}

function repExercise(){
  const all=[...new Set(S.history.flatMap(s=>s.exercises.map(e=>e.name)))].sort();
  if(!all.length)return '<div class="empty">Nenhum exercício registrado ainda.</div>';
  const sel=repSel||all[0];
  let h=`<div class="field"><label>Selecione o exercício</label>
    <select onchange="setSel(this.value)">${all.map(n=>
      `<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
  const pts=[];
  S.history.slice().sort((a,b)=>a.date-b.date).forEach(s=>{
    const e=s.exercises.find(x=>x.name===sel);
    if(e)pts.push({d:s.date,w:s.name,mx:maxOf(e.sets),vol:volOf(e.sets),
      reps:repsOf(e.sets),sets:e.sets,rm:e1rm(e.sets),bw:!!e.bw});
  });
  if(pts.length<2){
    return h+`<div class="empty">Apenas ${pts.length} registro deste exercício.<br>São necessários pelo menos 2 para comparar.</div>`;
  }
  const ls=pts.map(p=>fdate(p.d).slice(0,5));
  const mxs=pts.map(p=>p.mx), vls=pts.map(p=>p.vol), rms=pts.map(p=>p.rm);
  const first=pts[0], last=pts[pts.length-1];
  const dias=Math.round((last.d-first.d)/86400000);

  const isBW=pts.some(p=>p.bw);
  const mixed=isBW&&pts.some(p=>!p.bw);

  h+=`<div class="card">
    <div class="rep-h"><strong>${isBW?'Peso corporal':'Carga máxima'}${isBW?'<span class="tag-pc">PC</span>':''}</strong>${deltaHTML(mxs[0],mxs[mxs.length-1],' kg')}</div>
    ${sparkline(mxs,ls)}
    <div class="stats">
      <div class="stat"><b>${Math.max(...mxs)}</b><span>${isBW?'máx kg':'recorde kg'}</span></div>
      <div class="stat"><b>${pts.length}</b><span>sessões</span></div>
      <div class="stat"><b>${dias}</b><span>dias</span></div>
    </div>
    ${isBW?`<div class="rec">Exercício com peso corporal. Aqui uma <b>queda</b> no valor pode
      significar perda de peso, não perda de força — olhe as repetições junto.</div>`:''}
    ${mixed?'<div class="rec">⚠️ Este exercício tem sessões marcadas como peso corporal e outras como carga externa. Os números não são diretamente comparáveis entre si.</div>':''}</div>`;

  h+=`<div class="card">
    <div class="rep-h"><strong>Volume por sessão</strong>${deltaHTML(vls[0],vls[vls.length-1],' kg')}</div>
    ${sparkline(vls,ls)}
    <div class="mini">Total acumulado: <b>${Math.round(vls.reduce((a,b)=>a+b,0))} kg</b>
      · média <b>${Math.round(vls.reduce((a,b)=>a+b,0)/vls.length)} kg</b>/sessão</div></div>`;

  const repsArr=pts.map(p=>p.reps);
  h+=`<div class="card">
    <div class="rep-h"><strong>Repetições por sessão</strong>${deltaHTML(repsArr[0],repsArr[repsArr.length-1],' reps')}</div>
    ${sparkline(repsArr,ls)}
    <div class="rec">${isBW?'Para exercícios de peso corporal, a soma de repetições é o melhor indicador de progresso — é ela que aumenta quando você fica mais forte.':'Soma das repetições de todas as séries deste exercício na sessão.'}</div></div>`;
  if(!isBW){
    h+=`<div class="card">
      <div class="rep-h"><strong>1RM estimado</strong>${deltaHTML(rms[0],rms[rms.length-1],' kg')}</div>
      ${sparkline(rms,ls)}
      <div class="rec">Estimativa pela fórmula de Epley (peso × [1 + reps/30]). É uma projeção
        teórica de força máxima, não um valor para testar na prática.</div></div>`;
  }

  h+=`<div class="card"><div class="rep-h"><strong>Sessão a sessão</strong></div>`;
  pts.slice().reverse().forEach((p,i,arr)=>{
    const prev=arr[i+1];
    const d=prev?p.mx-prev.mx:null;
    const tag=d===null?'':d>0?`<span class="up">▲ +${d.toFixed(1)}</span>`
      :d<0?`<span class="down">▼ ${d.toFixed(1)}</span>`:'<span class="flat">=</span>';
    h+=`<div class="hist-row">
      <span style="color:var(--txt)">${fdate(p.d)} <span class="pill">${esc(p.w)}</span>${p.bw?'<span class="tag-pc">PC</span>':''}</span>
      <span>${p.sets.map(s=>fmtSet(s.reps,s.peso,p.bw)).join(' · ')} ${tag}</span></div>`;
  });
  h+='</div>';
  return h;
}

  // distribuição por foco (subtópico)
  const byT=MOBILITY_TAGS.map(g=>{
    const f=rec.filter(m=>(m.tags||[]).includes(g[0]));
    return{g,n:f.length};
  }).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const tT=byT.reduce((a,x)=>a+x.n,0)||1;
  h+=`<div class="card"><div class="rep-h"><strong>Distribuição por foco</strong>

      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
        <span style="color:var(--txt);font-weight:600">${x.g[2]} ${x.g[1]}</span>

      <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden">

}

/* ---------- EXPORTAR MARKDOWN ---------- */
function buildMD(){
  const g=goals();
  const gs=[...S.history].sort((a,b)=>a.date-b.date);
  const rs=[...runs()].sort((a,b)=>a.date-b.date);
  const ms=[...S.mobility].sort((a,b)=>a.date-b.date);
  const all=[...gs.map(x=>({k:'gym',d:x})),...rs.map(x=>({k:'run',d:x})),...ms.map(x=>({k:'mobility',d:x}))]
    .sort((a,b)=>a.d.date-b.d.date);
  const L=[];
  const fd=t=>{const d=new Date(t);
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} (${DOW[d.getDay()]})`};

  L.push('# Registro de treinos');
  L.push('');
  L.push(`Exportado em ${fd(Date.now())}. Períodos em dd/mm/aaaa. Pesos em kg, distâncias em km, pace em min/km.`);
  L.push('');
  if(all.length){
    const d0=all[0].d.date, d1=all[all.length-1].d.date;
    const dias=Math.max(1,Math.round((d1-d0)/86400000));
    L.push(`**Período coberto:** ${fd(d0)} a ${fd(d1)} (${dias} dias)`);
  }
  L.push(`**Metas declaradas:** ${g.week}/semana · ${g.month}/mês · ${g.year}/ano`);
  L.push(`**Total:** ${gs.length} sessões de musculação · ${rs.length} treinos de corrida · ${ms.length} sessões de mobilidade`);
  if(rs.length){
    const km=rs.reduce((a,r)=>a+r.km,0), sec=rs.reduce((a,r)=>a+r.sec,0);
    L.push(`**Corrida acumulada:** ${km.toFixed(1)} km em ${fmtDur(sec)} (pace médio ${fmtPace(paceOf(km,sec))}/km)`);
  }
  L.push('');

  // --- musculação por exercício ---
  if(gs.length){
    L.push('## Musculação — evolução por exercício');
    L.push('');
    const names=[...new Set(gs.flatMap(s=>s.exercises.map(e=>e.name)))].sort();
    names.forEach(n=>{
      const pts=[];
      gs.forEach(s=>{
        const e=s.exercises.find(x=>x.name===n);
        if(e&&e.sets.length)pts.push({date:s.date,w:s.name,bw:!!e.bw,sets:e.sets});
      });
      if(!pts.length)return;
      const isBW=pts.some(p=>p.bw);
      L.push(`### ${n}${isBW?' _(peso corporal)_':''}`);
      L.push('');
      L.push('| Data | Treino | Séries (reps × kg) | Carga máx | Volume |');
      L.push('|---|---|---|---|---|');
      pts.forEach(p=>{
        const mx=p.sets.reduce((a,s)=>Math.max(a,parseFloat(s.peso)||0),0);
        const vol=p.sets.reduce((a,s)=>a+(parseFloat(s.reps)||0)*(parseFloat(s.peso)||0),0);
        L.push(`| ${fd(p.date)} | ${p.w} | ${p.sets.map(s=>p.bw?`${s.reps} reps`:`${s.reps}×${s.peso}`).join(', ')} | ${mx} | ${Math.round(vol)} |`);
      });
      if(pts.length>1){
        const f=pts[0].sets.reduce((a,s)=>Math.max(a,parseFloat(s.peso)||0),0);
        const l=pts[pts.length-1].sets.reduce((a,s)=>Math.max(a,parseFloat(s.peso)||0),0);
        const dl=l-f, pc=f?((l-f)/f*100):0;
        L.push('');
        L.push(`_Variação da carga máxima: ${f} → ${l} kg (${dl>=0?'+':''}${dl.toFixed(1)} kg, ${pc>=0?'+':''}${pc.toFixed(0)}%) em ${pts.length} sessões._`);
      }
      L.push('');
    });
  }

  // --- corrida ---
  if(rs.length){
    L.push('## Corrida — treinos registrados');
    L.push('');
    L.push('| Data | Tipo | Local | Dist. | Tempo | Pace | Esforço | Estrutura |');
    L.push('|---|---|---|---|---|---|---|---|');
    rs.forEach(r=>{
      const t=rType(r.type);
      let st='—';
      if(HAS_WU[r.type]){
        const parts=[];
        const wk=r.wu?blkKm(r.wu):0, ws=r.wu?blkSec(r.wu):0;
        const ck=r.cd?blkKm(r.cd):0, cs=r.cd?blkSec(r.cd):0;
        if(wk||ws)parts.push(`aq ${wk}km/${fmtDur(ws)}`);
        if(r.type==='inter'&&r.shots){
          const ss=r.shots.filter(s=>blkKm(s)||blkSec(s));
          if(ss.length){
            const same=ss.every(s=>s.km===ss[0].km&&s.m===ss[0].m&&s.s===ss[0].s);
            parts.push(same?`${ss.length}× ${blkKm(ss[0])}km em ${fmtDur(blkSec(ss[0]))} (${fmtPace(paceOf(blkKm(ss[0]),blkSec(ss[0])))}/km)`
              :`${ss.length} tiros: ${ss.map(s=>`${blkKm(s)}km/${fmtDur(blkSec(s))}`).join(' + ')}`);
            const rst=ss.reduce((a,s)=>a+(parseInt(s.rm)||0)*60+(parseInt(s.rs)||0),0);
            if(rst)parts.push(`desc ${fmtDur(Math.round(rst/ss.length))}`);
          }
        }else if(r.type==='fartlek'&&r.fk){
          parts.push(`${r.reps||1}× (forte ${blkKm(r.fk.on)}km/${fmtDur(blkSec(r.fk.on))} + leve ${blkKm(r.fk.off)}km/${fmtDur(blkSec(r.fk.off))})`);
        }else if(r.type==='limiar'&&r.fk&&r.fk.on){
          parts.push(`limiar ${blkKm(r.fk.on)}km em ${fmtDur(blkSec(r.fk.on))} (${fmtPace(paceOf(blkKm(r.fk.on),blkSec(r.fk.on)))}/km)`);
        }
        if(ck||cs)parts.push(`desaq ${ck}km/${fmtDur(cs)}`);
        if(parts.length)st=parts.join(' + ');
      }
      const note=r.note?` — ${r.note.replace(/\|/g,'/')}`:'';
      const lv=runLevel(r), lvLbl=lv?runLvl(lv)[1]:'—';
      L.push(`| ${fd(r.date)} | ${t[1]} | ${surfOf(r)[1]} | ${r.km.toFixed(2)} | ${fmtDur(r.sec)} | ${fmtPace(paceOf(r.km,r.sec))} | ${lvLbl} | ${st}${note} |`);
    });
    L.push('');
    // volume por semana
    L.push('### Volume semanal de corrida');
    L.push('');
    L.push('| Semana (início) | Treinos | Km | Tempo | Pace médio |');
    L.push('|---|---|---|---|---|');
    const wk={};
    rs.forEach(r=>{
      const d=new Date(r.date); const dow=(d.getDay()+6)%7;
      d.setDate(d.getDate()-dow); d.setHours(0,0,0,0);
      const k=d.getTime();
      wk[k]=wk[k]||{n:0,km:0,sec:0};
      wk[k].n++; wk[k].km+=r.km; wk[k].sec+=r.sec;
    });
    Object.keys(wk).sort((a,b)=>a-b).forEach(k=>{
      const v=wk[k];
      L.push(`| ${fd(+k)} | ${v.n} | ${v.km.toFixed(1)} | ${fmtDur(v.sec)} | ${fmtPace(paceOf(v.km,v.sec))} |`);
    });
    L.push('');
  }

  // --- mobilidade ---
  if(ms.length){
    L.push('## Mobilidade — sessões registradas');
    L.push('');
    L.push('| Data | Treino | Região | Foco | Exercícios | Duração |');
    L.push('|---|---|---|---|---|---|');
    ms.forEach(m=>{
      const rg=(m.regions&&m.regions.length)?m.regions.map(k=>{const g=mobRegionG(k);return g?g[1]:k}).join(', '):'—';
      const tg=(m.tags&&m.tags.length)?m.tags.map(k=>{const g=mobTagG(k);return g?g[1]:k}).join(', '):'—';
      L.push(`| ${fd(m.date)} | ${m.name} | ${rg} | ${tg} | ${m.exercises.map(e=>e.name).join(', ')} | ${fmtDur(m.sec)} |`);
    });
    L.push('');
  }

  // --- cronologia unificada ---
  L.push('## Cronologia completa');
  L.push('');
  L.push('| Data | Modalidade | Descrição |');
  L.push('|---|---|---|');
  all.forEach(it=>{
    if(it.k==='run'){
      const r=it.d, t=rType(r.type);
      const lv2=runLevel(r), lv2Lbl=lv2?runLvl(lv2)[1]:'—';
      L.push(`| ${fd(r.date)} | Corrida | ${t[1]} (${surfOf(r)[1].toLowerCase()}): ${r.km.toFixed(2)} km em ${fmtDur(r.sec)}, pace ${fmtPace(paceOf(r.km,r.sec))}/km, esforço ${lv2Lbl} |`);
    }else if(it.k==='mobility'){
      const m=it.d;
      const rg=(m.regions&&m.regions.length)?' ['+m.regions.map(k=>{const g=mobRegionG(k);return g?g[1]:k}).join(', ')+']':'';
      const tg=(m.tags&&m.tags.length)?' ['+m.tags.map(k=>{const g=mobTagG(k);return g?g[1]:k}).join(', ')+']':'';
      L.push(`| ${fd(m.date)} | Mobilidade | ${m.name}${rg}${tg}: ${m.exercises.length} exercícios, ${fmtDur(m.sec)} |`);
    }else{
      const s=it.d;
      const vol=s.exercises.reduce((a,e)=>a+e.sets.reduce((b,x)=>
        b+(parseFloat(x.reps)||0)*(parseFloat(x.peso)||0),0),0);
      const w=S.workouts.find(x=>x.id===s.wid);
      const mtag=(s.muscles&&s.muscles.length)?' ['+s.muscles.map(k=>{const g=muscleG(k);return g?g[1]:k}).join(', ')+']':'';
      const ss=supersetSummary(s.exercises);
      const sstag=ss.length?' · conjugados: '+ss.map(o=>`${o.l} (${o.names.join(' + ')})`).join('; '):'';
      L.push(`| ${fd(s.date)} | Musculação | ${s.name}${mtag}${w&&w.adhoc?' (esporádico)':''}: ${s.exercises.length} exercícios, volume ${Math.round(vol)} kg${s.dur?', '+s.dur+' min':''}${sstag} |`);
    }
  });
  L.push('');

  // frequência semanal combinada
  L.push('## Frequência semanal (musculação + corrida + mobilidade)');
  L.push('');
  L.push('| Semana (início) | Musculação | Corrida | Mobilidade | Total | Meta |');
  L.push('|---|---|---|---|---|---|');
  const fw={};
  const add=(ts,key)=>{
    const d=new Date(ts); const dow=(d.getDay()+6)%7;
    d.setDate(d.getDate()-dow); d.setHours(0,0,0,0);
    const k=d.getTime(); fw[k]=fw[k]||{gym:0,run:0,mob:0}; fw[k][key]++;
  };
  gs.forEach(s=>add(s.date,'gym'));
  rs.forEach(r=>add(r.date,'run'));
  ms.forEach(m=>add(m.date,'mob'));
  Object.keys(fw).sort((a,b)=>a-b).forEach(k=>{
    const v=fw[k], tot=v.gym+v.run+v.mob;
    L.push(`| ${fd(+k)} | ${v.gym} | ${v.run} | ${v.mob} | ${tot} | ${g.week} ${tot>=g.week?'✅':'❌'} |`);
  });
  L.push('');
  L.push('---');
  L.push('');
  L.push('_Dados exportados do app pessoal de registro de treinos. Esforço da corrida é classificado pelo teste da fala (Leve/Moderado/Forte/Muito forte). "PC" indica exercício feito com peso corporal. "Conjugados" são exercícios executados em sequência sem descanso entre eles (bi-set/tri-set) — cada um segue registrado separadamente._');
  return L.join('\n');
}
window.exportMD=()=>{
  if(!S.history.length&&!runs().length&&!S.mobility.length)return toast('Nenhum treino para exportar');

    const fn=`treinos-relatorio-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.md`;

function daysSinceBackup(){
  let v=null;
  try{v=localStorage.getItem('lastBackupAt');}catch(e){}
  if(!v)return Infinity;
  return Math.floor((Date.now()-Number(v))/86400000);
}
window.doImport=inp=>{
  const f=inp.files&&inp.files[0];
  inp.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    let d;
    try{d=JSON.parse(r.result)}catch(e){return toast('Arquivo inválido')}
    if(!d||!Array.isArray(d.workouts)||!Array.isArray(d.history))
      return toast('Não parece um backup de treinos');
    const when=d._exportedAt?fdate(new Date(d._exportedAt).getTime()):'data desconhecida';
    const det=`Entrando: ${d.workouts.length} treinos, ${d.history.length} sessões, ${(d.runs||[]).length} corridas, ${(d.mobility||[]).length} mobilidade\n`+
      `Saindo: ${S.workouts.length} treinos, ${S.history.length} sessões, ${runs().length} corridas, ${S.mobility.length} mobilidade\n\n`+
      `Os dados atuais serão substituídos.`;
    if(!await ask(`Restaurar backup de ${when}?`,det,'Restaurar',true))return;
    S={workouts:d.workouts,history:d.history,goals:d.goals||S.goals,
       runs:Array.isArray(d.runs)?d.runs:[],
       plans:Array.isArray(d.plans)?d.plans:[],
       mobility:Array.isArray(d.mobility)?d.mobility:[]};
    await save();closeM();view='home';render();toast('Dados restaurados');
  };
  r.onerror=()=>toast('Erro ao ler o arquivo');
  r.readAsText(f);
};

/* ---------- IMPORTAR PLANEJAMENTO DO PC (mescla, nao substitui) ---------- */
window.importPlanOpen=()=>{
  const nPend=plans().filter(p=>!p.doneId&&p.date>=Date.now()-86400000).length;
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()">
    <div class="modal-in">
      <h2>Importar planejamento do PC</h2>
      <p style="font-size:12.5px;color:var(--dim);line-height:1.65;margin:0 0 14px">
        Selecione o arquivo <code>.json</code> exportado pelo planejador de corrida do computador.
        Os treinos planejados no arquivo sao <b style="color:var(--txt)">adicionados</b> ao que ja
        existe aqui, e o que ja foi treinado nunca e apagado. A partir do primeiro dia coberto pelo
        arquivo, os planos <b style="color:var(--txt)">ainda pendentes</b> que nao vieram nesta
        importacao sao removidos — ou seja, o arquivo passa a valer como o planejamento oficial dali
        pra frente. Se reimportar um dia repetido, aquele plano e apenas atualizado (a menos que ja
        tenha sido concluido, ai ele fica como esta).<br><br>
        Se o arquivo trouxer treinos de musculacao cadastrados no planejador, eles sao adicionados
        na aba <b style="color:var(--txt)">Treinos</b> — uma vez so por treino, mesmo que ele
        esteja planejado em varios dias, e mesmo que ainda nao esteja em nenhum dia. Um treino
        arquivado no planejador chega arquivado aqui tambem (e vice-versa, na proxima vez que
        voce exportar um backup daqui pro planejador).</p>
      <div class="stats" style="margin:0 0 14px">
        <div class="stat"><b>${plans().length}</b><span>planejados hoje</span></div>
        <div class="stat"><b>${nPend}</b><span>futuros</span></div>
      </div>
      <input type="file" id="planf" accept=".json,application/json" style="display:none"
        onchange="doImportPlan(this)">
      <button class="btn-a" onclick="document.getElementById('planf').click()">⬆ Escolher arquivo</button>
      <div class="menu-sep" style="margin:16px 0"></div>
      <button class="menu-item" style="justify-content:center;color:var(--dim)" onclick="closeM()">Fechar</button>
    </div></div>`;
};
window.doImportPlan=inp=>{
  const f=inp.files&&inp.files[0];
  inp.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    let d;
    try{d=JSON.parse(r.result);}catch(e){return toast('Arquivo invalido');}
    const list=Array.isArray(d)?d:(Array.isArray(d&&d.plans)?d.plans:null);
    if(!list)return toast('Nao parece um arquivo de planejamento de corrida');
    if(!Array.isArray(S.plans))S.plans=[];
    if(!Array.isArray(S.workouts))S.workouts=[];
    // treinos de musculacao cadastrados no planejador do PC. Vem UMA vez so no arquivo,
    // mesmo que o mesmo treino esteja em varios dias do planejamento: por isso ele aparece
    // uma vez so aqui na aba Treinos, e cada dia planejado so aponta pra ele pelo `wid`.
    const wOps=[]; // {mode:'add'|'update', w}
    (Array.isArray(d&&d.workouts)?d.workouts:[]).forEach(w=>{
      if(!w||!w.id)return;
      const name=String(w.name||'').trim();
      const exs=(Array.isArray(w.exercises)?w.exercises:[])
        .map(e=>({name:String((e&&e.name)||'').trim(),sets:(e&&e.sets)||'',
          reps:(e&&e.reps)||'',note:String((e&&e.note)||'').trim(),link:!!(e&&e.link)}))
        .filter(e=>e.name);
      if(!name||!exs.length)return;
      if(exs.length)exs[0].link=false;
      const archived=!!w.archived;
      const cur=S.workouts.find(x=>String(x.id)===String(w.id));
      if(cur)wOps.push({mode:'update',id:cur.id,name,exercises:exs,archived});
      else wOps.push({mode:'add',id:String(w.id),name,exercises:exs,archived});
    });
    const KEEP=['wu','cd','reps','shots','fk','mainKm','mainSec','restSec','targetSec','level','rwMode','rw','rwReps'];
    const KEEP_GYM=['mode','wid','targets','muscles','exercises'];
    const KEEP_MOB=['mode','wid','regions','tags','exercises'];
    // monta a lista de mudancas sem tocar em S.plans ainda (so aplica apos confirmacao)
    const ops=[]; // {mode:'add'|'update'|'skip'|'invalid', clean, idx}
    list.forEach(p=>{
      if(!p||!p.date){ops.push({mode:'invalid'});return;}
      let clean;
      if(p.kind==='gym'){
        const mode=p.mode||(p.wid?'workout':(Array.isArray(p.muscles)&&p.muscles.length?'muscles':'custom'));
        const okWorkout=mode==='workout'&&p.wid;
        const okMuscles=mode==='muscles'&&Array.isArray(p.muscles)&&p.muscles.length;
        const okCustom=mode==='custom'&&Array.isArray(p.exercises)&&p.exercises.length;
        if(!okWorkout&&!okMuscles&&!okCustom){ops.push({mode:'invalid'});return;}
        clean={id:(p.id?String(p.id):uid()),kind:'gym',date:Number(p.date),mode,note:(p.note||'').trim()};
        KEEP_GYM.forEach(k=>{if(p[k]!==undefined)clean[k]=p[k];});
      }else if(p.kind==='mobility'){
        const mode=p.mode||(p.wid?'workout':(((Array.isArray(p.regions)&&p.regions.length)||(Array.isArray(p.tags)&&p.tags.length))?'regions':'custom'));
        const okWorkout=mode==='workout'&&p.wid;
        const okRegions=mode==='regions'&&((Array.isArray(p.regions)&&p.regions.length)||(Array.isArray(p.tags)&&p.tags.length));
        const okCustom=mode==='custom'&&Array.isArray(p.exercises)&&p.exercises.length;
        if(!okWorkout&&!okRegions&&!okCustom){ops.push({mode:'invalid'});return;}
        clean={id:(p.id?String(p.id):uid()),kind:'mobility',date:Number(p.date),mode,note:(p.note||'').trim()};
        KEEP_MOB.forEach(k=>{if(p[k]!==undefined)clean[k]=p[k];});
      }else{
        if(!p.type||!RUN_TYPES.some(t=>t[0]===p.type)){ops.push({mode:'invalid'});return;}
        clean={id:(p.id?String(p.id):uid()),kind:'run',date:Number(p.date),
          type:p.type,km:Number(String(p.km).replace(',','.'))||0,note:(p.note||'').trim()};
        KEEP.forEach(k=>{if(p[k]!==undefined)clean[k]=p[k];});
      }
      const idx=S.plans.findIndex(x=>x.id===clean.id);
      if(idx>=0){
        if(S.plans[idx].doneId){ops.push({mode:'skip'});return;}
        clean.doneId=S.plans[idx].doneId;
        ops.push({mode:'update',clean});
      }else{
        ops.push({mode:'add',clean});
      }
    });
    // o planejamento importado passa a "valer" a partir do dia mais cedo que ele cobre:
    // qualquer plano pendente do app (ainda nao concluido) dentro dessa mesma janela que
    // NAO veio no arquivo e considerado desatualizado (foi removido/trocado no PC) e e
    // apagado daqui, pra nao ficar uma mistura do planejamento antigo com o novo
    const validCleans=ops.filter(o=>o.clean).map(o=>o.clean);
    let stale=[];
    if(validCleans.length){
      const minDate=Math.min(...validCleans.map(c=>c.date));
      const importedIds=new Set(validCleans.map(c=>c.id));
      stale=S.plans.filter(p=>!p.doneId&&p.date>=minDate&&!importedIds.has(p.id));
    }
    const added=ops.filter(o=>o.mode==='add').length;
    const updated=ops.filter(o=>o.mode==='update').length;
    const skipped=ops.filter(o=>o.mode==='skip').length;
    const invalid=ops.filter(o=>o.mode==='invalid').length;
    const wAdd=wOps.filter(o=>o.mode==='add').length;
    const wUpd=wOps.filter(o=>o.mode==='update').length;
    if(!added&&!updated&&!wAdd&&!wUpd){
      return toast(skipped?`Nada novo — ${skipped} ja concluido(s)`:'Nenhum plano valido no arquivo');
    }
    const det=(wAdd||wUpd?`Treinos novos na aba Treinos: ${wAdd}`+
        (wUpd?`\nTreinos atualizados: ${wUpd}`:'')+`\n\n`:'')+
      `Adicionados: ${added}\nAtualizados: ${updated}`+
      (stale.length?`\nRemovidos (fora do novo planejamento): ${stale.length}`:'')+
      `\nIgnorados (ja concluidos): ${skipped}`+
      (invalid?`\nInvalidos ignorados: ${invalid}`:'');
    if(!await ask('Importar planejamento?',det,'Importar',false))return; // cancelado: nada foi tocado
    // treinos primeiro, pra que os planos que apontam pra eles (wid) ja encontrem o treino
    wOps.forEach(o=>{
      if(o.mode==='add'){
        S.workouts.push({id:o.id,name:o.name,exercises:o.exercises,muscles:[],archived:o.archived,fromPC:true});
      }else{
        const w=S.workouts.find(x=>x.id===o.id);
        // sincroniza tambem o estado arquivado (aposentado/reativado no planejador do PC)
        if(w){w.name=o.name;w.exercises=o.exercises;w.archived=o.archived;}
      }
    });
    if(stale.length){
      const staleIds=new Set(stale.map(p=>p.id));
      S.plans=S.plans.filter(p=>!staleIds.has(p.id));
    }
    ops.forEach(o=>{
      if(o.mode==='add')S.plans.push(o.clean);
      else if(o.mode==='update'){
        const idx=S.plans.findIndex(x=>x.id===o.clean.id);
        if(idx>=0)S.plans[idx]=o.clean; else S.plans.push(o.clean);
      }
    });
    await save();closeM();plRef=null;view='plan';render();toast('Planejamento importado');
  };
  r.onerror=()=>toast('Erro ao ler o arquivo');
  r.readAsText(f);
};

/* ---------- ROUTER ---------- */
function render(){
  if(view==='session'&&cur)session();
  else if(view==='msession'&&curM)mobSession();
  else if(view==='hist')hist();
  else if(view==='rep')report();
  else if(view==='runrep')runReport();
  else if(view==='moborep')mobReport();
  else if(view==='run')runHome();
  else if(view==='mob')mobHome();
  else if(view==='arc')archived();
  else if(view==='order')order();
  else if(view==='del')delScreen();
  else if(view==='goals')goalsScreen();
  else if(view==='plan')planScreen();
  else if(view==='notif')notifScreen();
  else if(view==='cfg')config();
  else if(view==='cal')calendar();
  else home();
  $('tabbar').style.display=(view==='session'||view==='msession')?'none':'flex';
  if(view!=='session'&&view!=='msession')drawTabs();
}
$('back').onclick=async()=>{
  if(view==='session'){
    const has=live.exercises.some(e=>e.sets.some(s=>s.reps||s.peso));
    if(has&&!await ask('Sair sem salvar?','O treino em andamento será perdido.','Sair',true))return;
    clearInterval(tick);
    await cleanupAdhoc();
    view='home';
  }else if(view==='msession'){
    const has=liveM&&liveM.exercises.some(e=>e.done);
    if(has&&!await ask('Sair sem salvar?','O treino em andamento será perdido.','Sair',true))return;
    clearInterval(tickM);
    await cleanupAdhoc();
    view='mob';
  }else if(view==='arc'||view==='order'||view==='del'||view==='goals'||view==='notif'||
    view==='rep'||view==='runrep'||view==='moborep'){
    view='cfg';
  }else if(view==='cal'){
    view='hist';
  }else view=mod==='run'?'run':(mod==='mobility'?'mob':'home');
  repSel='';render();
};
load();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
