<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>try{var t=localStorage.getItem('theme');if(t==='light')document.documentElement.classList.add('light');else if(t&&t!=='dark'&&t!=='padrao')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treinos">
<meta name="theme-color" content="#0e0f13">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Treinos</title>
<style>
/* perfis de cores (Ajustes → Aparência) — escolha local do aparelho, fora de S */
:root{
  --bg:#0e0f13; --surface:#171922; --surface2:#1f2230; --surface3:#262a3a; --line:#2a2e3d;
  --txt:#eef0f6; --dim:#8b90a3; --accent:#ff6b35; --acc-rgb:255,107,53; --on-accent:#ffffff; --accent2:#3ddc97;
  --bg-blur:rgba(14,15,19,.92); --surface-blur:rgba(23,25,34,.96);
  --radius:14px; color-scheme:dark;
}
html[data-theme="tatico"]{
  --bg:#0f110d; --surface:#181b15; --surface2:#20241c; --surface3:#2a2f24; --line:#2c3226;
  --txt:#eef0e6; --dim:#8f957f; --accent:#c8a24a; --acc-rgb:200,162,74; --on-accent:#14120a; --accent2:#3ddc97;
  --bg-blur:rgba(15,17,13,.92); --surface-blur:rgba(24,27,21,.96);
  --radius:14px; color-scheme:dark;
}
html[data-theme="vermelho"]{
  --bg:#0c0c0d; --surface:#161618; --surface2:#1f1f22; --surface3:#29292d; --line:#2b2b30;
  --txt:#f2f2f2; --dim:#8e8e96; --accent:#e0342f; --acc-rgb:224,52,47; --on-accent:#ffffff; --accent2:#3ddc97;
  --bg-blur:rgba(12,12,13,.92); --surface-blur:rgba(22,22,24,.96);
  --radius:14px; color-scheme:dark;
}
html[data-theme="ambar"]{
  --bg:#101114; --surface:#1a1c20; --surface2:#23262b; --surface3:#2c3036; --line:#2d3037;
  --txt:#eef0f4; --dim:#8b90a3; --accent:#ffb300; --acc-rgb:255,179,0; --on-accent:#1a1200; --accent2:#3ddc97;
  --bg-blur:rgba(16,17,20,.92); --surface-blur:rgba(26,28,32,.96);
  --radius:14px; color-scheme:dark;
}
html[data-theme="marinho"]{
  --bg:#0a1020; --surface:#121a2e; --surface2:#1a2440; --surface3:#22304f; --line:#243152;
  --txt:#eef2fb; --dim:#8a96b3; --accent:#d4af37; --acc-rgb:212,175,55; --on-accent:#171204; --accent2:#3ddc97;
  --bg-blur:rgba(10,16,32,.92); --surface-blur:rgba(18,26,46,.96);
  --radius:14px; color-scheme:dark;
}
html[data-theme="neon"]{
  --bg:#0b0b0b; --surface:#151515; --surface2:#1e1e1e; --surface3:#282828; --line:#2a2a2a;
  --txt:#f0f0f0; --dim:#8c8c8c; --accent:#00e5ff; --acc-rgb:0,229,255; --on-accent:#001418; --accent2:#3ddc97;
  --bg-blur:rgba(11,11,11,.92); --surface-blur:rgba(21,21,21,.96);
  --radius:14px; color-scheme:dark;
}
html.light{
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#eef0f5; --surface3:#ffffff; --line:#e0e3ec;
  --txt:#1a1c24; --dim:#666c80;
  --accent:#ff6b35; --acc-rgb:255,107,53; --on-accent:#ffffff;
  --bg-blur:rgba(244,245,248,.92); --surface-blur:rgba(255,255,255,.96);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;overscroll-behavior-y:none}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 150px)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:var(--bg-blur);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
header .hrow{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.3px;flex:1}
.sub{font-size:12px;color:var(--dim);font-weight:400}
button{font-family:inherit;font-size:15px;border:none;border-radius:10px;
  padding:11px 15px;cursor:pointer;background:var(--surface2);color:var(--txt);font-weight:600}
button:active{opacity:.7}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-g{background:var(--accent2);color:#08130d}
.btn-sm{padding:7px 11px;font-size:13px}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px}
.card-tap{cursor:pointer;display:flex;align-items:center;gap:12px}
.card-tap h3{margin:0 0 3px;font-size:16px}
.card-tap p{margin:0;font-size:12.5px;color:var(--dim)}
.chev{color:var(--dim);font-size:20px}
input,select,textarea{font-family:inherit;font-size:16px;background:var(--surface2);
  border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:11px;width:100%}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input:disabled{opacity:.35;background:transparent;border-style:dashed}
label{display:block;font-size:12px;color:var(--dim);margin:0 0 5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:12px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.ex-block{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.ex-head{padding:12px 14px;background:var(--surface2);display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.ex-head strong{font-size:15px}
.ex-body{padding:10px 14px 14px}
.prev{font-size:12px;color:var(--dim);margin-bottom:10px;line-height:1.6}
.prev b{color:var(--accent2);font-weight:600}
.set{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:7px;
  align-items:center;margin-bottom:7px}
.set-n{font-size:12px;color:var(--dim);text-align:center;font-weight:700}
.set input{padding:10px 8px;text-align:center;font-size:16px}
.set .del{background:transparent;color:#ff5a5a;padding:6px;font-size:17px}
.set-hdr{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:7px;
  font-size:10.5px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:6px;text-align:center;font-weight:700}

/* --- autocomplete de nome de exercício (caixa de sugestões ao digitar) --- */
.ex-name-wrap{position:relative}
.ex-sug{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;
  background:var(--surface3);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 24px rgba(0,0,0,.4);overflow:hidden;z-index:80;
  max-height:210px;overflow-y:auto}
.ex-sug.on{display:block}
.ex-sug button{display:block;width:100%;text-align:left;background:var(--surface3);
  border:none;border-bottom:1px solid var(--line);color:var(--txt);
  font-size:13px;padding:9px 12px}
.ex-sug button:last-child{border-bottom:none}
.ex-sug button:active{background:var(--surface2)}

/* --- séries conjugadas (bi-set / tri-set) --- */
.grp{border:1.5px solid rgba(61,220,151,.32);border-radius:var(--radius);
  background:rgba(61,220,151,.04);padding:8px;margin-bottom:12px}
.grp .ex-block{margin-bottom:8px}
.grp .ex-block:last-child{margin-bottom:0}
.grp-hd{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:10.5px;
  font-weight:800;color:var(--accent2);text-transform:uppercase;
  letter-spacing:.5px;margin:2px 2px 8px}
.grp-hd .gh-sub{color:var(--dim);font-weight:600;text-transform:none;
  letter-spacing:0;font-size:10.5px}
.ex-tag{display:inline-block;background:rgba(61,220,151,.16);color:var(--accent2);
  font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;
  margin-right:7px;letter-spacing:.3px;vertical-align:middle}

/* --- modo reordenar / conjugar dentro da sessão --- */
.ord-row2{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:9px 8px 9px 11px;font-size:13.5px}
.ord-row2.ing{border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.05)}
.ord-row2 .on2{width:26px;flex:none;text-align:center;font-size:11px;
  font-weight:800;color:var(--dim)}
.ord-row2.ing .on2{color:var(--accent2)}
.ord-row2 .onm{flex:1;min-width:0;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ord-btn2{background:var(--surface2);color:var(--txt);padding:8px 12px;
  font-size:15px;border-radius:9px;flex:none;line-height:1}
.ord-btn2:disabled{opacity:.28}
.lnk-row{display:flex;align-items:center;gap:8px;padding:4px 0 4px 34px}
.lnk-row .lnk-line{flex:1;height:1px;background:var(--line)}
.lnk-btn{background:transparent;border:1px dashed var(--line);color:var(--dim);
  font-size:10.5px;font-weight:700;padding:4px 11px;border-radius:20px;flex:none}
.lnk-btn.on{border-style:solid;border-color:rgba(61,220,151,.5);
  background:rgba(61,220,151,.12);color:var(--accent2)}
.empty{text-align:center;padding:44px 18px;color:var(--dim);font-size:14px;line-height:1.7}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 78px);
  left:50%;transform:translateX(-50%);z-index:30;
  box-shadow:0 6px 20px rgba(0,0,0,.5);padding:12px 22px;font-size:14.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.modal-in{background:var(--surface);width:100%;max-width:640px;
  border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-in h2{margin:0 0 14px;font-size:17px}
.modal-h{display:flex;align-items:center;gap:2px}
.modal-h h2{margin:0;flex:1}
.hdr-back{background:transparent;color:var(--dim);padding:6px 8px 6px 0;
  font-size:20px;line-height:1;flex:none;font-weight:700}
.hdr-back:active{color:var(--txt)}
.ex-item{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ex-item input{flex:1}
.ex-item button{padding:10px 12px}
.hist-row{display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.hist-row:last-child{border:none}
.hist-row span{color:var(--dim);font-size:12.5px}
.pill{display:inline-block;background:var(--surface2);border-radius:6px;
  padding:2px 7px;font-size:11px;color:var(--dim);margin-right:5px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 90px);left:50%;
  transform:translateX(-50%);background:var(--accent2);color:#08130d;
  padding:11px 20px;border-radius:10px;font-size:14px;font-weight:700;
  z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.ask-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:20px 18px 16px;width:100%;max-width:330px;margin:0 18px}
.ask-box h3{margin:0 0 8px;font-size:16.5px;font-weight:700;line-height:1.35}
.ask-box p{margin:0 0 16px;font-size:13px;color:var(--dim);line-height:1.5;
  white-space:pre-line}
.ask-row{display:flex;gap:8px}
.ask-row button{flex:1;padding:12px}
.btn-danger{background:#e0453f;color:#fff;font-weight:700}
.load{text-align:center;padding:50px;color:var(--dim)}
.ihint{max-width:640px;margin:10px auto 0;padding:0 14px}
.ihint-in{background:linear-gradient(135deg,rgba(var(--acc-rgb),.16),rgba(61,220,151,.08));
  border:1px solid rgba(var(--acc-rgb),.35);border-radius:13px;padding:12px 13px;
  display:flex;align-items:flex-start;gap:10px}
.ihint-in .ii{font-size:19px;line-height:1;flex:none;margin-top:1px}
.ihint-in .it{flex:1;font-size:12.5px;color:var(--txt);line-height:1.55}
.ihint-in .it b{color:var(--accent)}
.ihint-in .ix{background:transparent;color:var(--dim);padding:2px 6px;font-size:15px;flex:none;border-radius:6px}
.bkp-warn{background:rgba(224,151,63,.12);border:1px solid rgba(224,151,63,.35);
  border-radius:12px;padding:11px 12px;font-size:12px;color:#e0973f;line-height:1.55;margin-bottom:12px}
.tabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:11px;margin-bottom:12px}
.tabs button{flex:1;background:transparent;color:var(--dim);padding:9px;font-size:14px}
.tabs button.on{background:var(--accent);color:var(--on-accent)}
.rep-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.rep-h strong{font-size:15.5px}
.delta{font-size:13px;font-weight:700;white-space:nowrap}
.up{color:var(--accent2)} .down{color:#ff5a5a} .flat{color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.stat{background:var(--surface2);border-radius:9px;padding:9px 7px;text-align:center}
.stat b{display:block;font-size:15px;margin-bottom:2px}
.stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.spark{width:100%;height:76px;display:block;margin:6px 0 4px}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:8px}
.mini{font-size:12px;color:var(--dim);line-height:1.8}
.mini b{color:var(--txt);font-weight:600}
.rec{font-size:11.5px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.bw-tog{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap}
.bw-tog input{width:19px;height:19px;flex:none;accent-color:var(--accent);margin:0;padding:0}
.bw-tog.on{color:var(--accent)}
.th-sw{position:relative;flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);overflow:hidden}
.th-sw i{position:absolute;left:6px;right:6px;bottom:6px;height:12px;border-radius:4px}
.th-sw b{position:absolute;left:8px;top:7px;width:14px;height:8px;border-radius:3px}
.th-opt.on{background:var(--surface2)}
.tgl{position:relative;display:inline-block;width:46px;height:27px;flex:none}
.tgl input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.tgl-trk{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--line);
  border-radius:14px;transition:background .2s,border-color .2s;pointer-events:none}
.tgl-trk::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;
  background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tgl input:checked+.tgl-trk{background:var(--accent);border-color:var(--accent)}
.tgl input:checked+.tgl-trk::after{transform:translateX(19px)}
.tag-pc{display:inline-block;background:rgba(var(--acc-rgb),.16);color:var(--accent);
  border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.3px;margin-left:6px}
.kebab{background:transparent;color:var(--dim);padding:8px 10px;font-size:17px;
  line-height:1;border-radius:8px;flex:none}
.kebab:active{background:var(--surface2)}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;padding:14px 12px;border-radius:10px;font-weight:500;font-size:15px}
.menu-item:active{background:var(--surface2)}
.menu-item .ic{font-size:17px;width:22px;text-align:center;flex:none}
.menu-item.danger{color:#ff5a5a}
.menu-sep{height:1px;background:var(--line);margin:6px 0}
.arc-item{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.arc-head{padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.arc-head strong{flex:1;font-size:15px}
.arc-head .cnt{font-size:11.5px;color:var(--dim)}
.arc-body{padding:0 14px 13px;border-top:1px solid var(--line)}
.arc-body ul{margin:10px 0 0;padding-left:19px}
.arc-body li{font-size:13.5px;color:var(--dim);margin-bottom:5px;line-height:1.5}
.ord-row{display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px}
.ord-row strong{flex:1;font-size:14.5px;font-weight:600}
.ord-btn{background:var(--surface2);padding:9px 12px;font-size:15px;line-height:1;border-radius:8px}
.ord-btn:disabled{opacity:.28}
.sec-lbl{margin:20px 0 9px;font-size:12px;color:var(--dim);font-weight:700;
  text-transform:uppercase;letter-spacing:.6px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
.act{display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:600;
  padding:9px 13px;border-radius:20px;white-space:nowrap}
.act span{font-size:13px;line-height:1}
.act-a{background:rgba(var(--acc-rgb),.13);border-color:rgba(var(--acc-rgb),.35);color:var(--accent)}
.act:active{opacity:.65}
.modal-in .row{gap:8px}
.modal-in .row button{flex:none;padding:11px 18px}
.modal-in .row button:last-child{flex:1}

/* --- TAB BAR --- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--surface-blur);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;
  padding:6px 0 calc(env(safe-area-inset-bottom) + 4px)}
.tb{flex:1;background:transparent;padding:6px 0;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--dim);font-size:8.5px;font-weight:600;border-radius:0;
  min-width:0;overflow:hidden;white-space:nowrap}
.tb .ti{font-size:17px;line-height:1}
.tb.on{color:var(--accent)}
.tb:active{opacity:.6}

/* --- ANÉIS --- */
.rings{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 10px 14px;margin-bottom:12px}
.rings-row{display:flex;justify-content:space-around;align-items:flex-start}
.ring{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;
  cursor:pointer;position:relative}
.ring svg{display:block}
.ring-lbl{font-size:11px;color:var(--dim);font-weight:700;
  text-transform:uppercase;letter-spacing:.5px}
.ring-ctr{font-size:17px;font-weight:800;fill:var(--txt)}
.ring-sub{font-size:9px;fill:var(--dim);font-weight:600}
.goal-note{text-align:center;font-size:11.5px;color:var(--dim);
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line);line-height:1.5}
.streak{display:inline-flex;align-items:center;gap:5px;background:rgba(var(--acc-rgb),.13);
  color:var(--accent);border-radius:14px;padding:4px 11px;font-size:11.5px;font-weight:700}

/* --- MENU CARDS (estilo lista do app) --- */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  margin-bottom:9px;display:flex;align-items:center;gap:13px;padding:15px 14px;
  cursor:pointer;width:100%;text-align:left;font-size:15.5px;font-weight:600;color:var(--txt)}
.mcard:active{background:var(--surface2)}
.mcard .mi{font-size:20px;width:26px;text-align:center;flex:none}
.mcard .mt{flex:1}
.mcard .mv{font-size:13px;color:var(--dim);font-weight:600}
.mcard .mc{color:var(--dim);font-size:19px}

/* --- CONFIG --- */
.cfg-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:7px}
.cfg-row .ct{font-size:14px;font-weight:600;margin-bottom:1px;line-height:1.3}
.cfg-row .cd2{font-size:11px;color:var(--dim);line-height:1.35}
.goal-row{display:flex;align-items:center;gap:10px}

/* ---------- ARMAZENAMENTO (localStorage + IndexedDB como reforço) ---------- */
const LS_KEY='gym-data';
let idbDB=null;
function idbOpen(){
  return new Promise((res)=>{
    if(!('indexedDB' in window)){res(null);return;}
    try{
      const rq=indexedDB.open('treinos-db',1);
      rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('kv');}catch(e){}};
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}
function idbGet(key){
  return new Promise(async(res)=>{
    if(!idbDB)idbDB=await idbOpen();
    if(!idbDB){res(null);return;}
    try{
      const tx=idbDB.transaction('kv','readonly'), rq=tx.objectStore('kv').get(key);
      rq.onsuccess=()=>res(rq.result||null);
      rq.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}
function idbSet(key,val){
  return new Promise(async(res)=>{
    if(!idbDB)idbDB=await idbOpen();
    if(!idbDB){res(false);return;}
    try{
      const tx=idbDB.transaction('kv','readwrite'); tx.objectStore('kv').put(val,key);
      tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
    }catch(e){res(false);}
  });
}
// abre SEMPRE com o que está salvo no aparelho (rápido e funciona sem internet) e só depois
// sincroniza com a nuvem, mesclando o que mudou dos dois lados (cloudSync, em comum.js)
async function load(){
  let raw=null, corrupted=false;
  try{raw=localStorage.getItem(LS_KEY);}catch(e){}
  let parsed=null;
  if(raw){
    try{parsed=JSON.parse(raw);}
    catch(e){corrupted=true;raw=null;} // gravação corrompida/truncada — não usa isto, tenta o reforço abaixo
  }
  if(!parsed){ // localStorage vazio, indisponível ou corrompido: tenta recuperar do IndexedDB (reforço)
    let idbRaw=null;
    try{idbRaw=await idbGet(LS_KEY);}catch(e){}
    if(idbRaw){
      try{parsed=JSON.parse(idbRaw);}catch(e){}
    }
  }
  if(parsed){
    S=parsed;
    if(corrupted){
      try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
      setTimeout(()=>toast('Dados recuperados do backup automático (armazenamento principal estava corrompido)'),400);
    }
  }
  normalizeS();
  render();
  cloudSync(); // sem internet: fica só no aparelho e sincroniza quando a conexão voltar
}
function normalizeS(){
  if(!Array.isArray(S.workouts))S.workouts=[];
  if(!Array.isArray(S.history))S.history=[];
  if(!Array.isArray(S.runs))S.runs=[];
  if(!Array.isArray(S.plans))S.plans=[];
  if(!Array.isArray(S.mobility))S.mobility=[];
  if(!Array.isArray(S.other))S.other=[]; // registros de "treino diferente" (texto livre, sem molde padrão)
  if(!Array.isArray(S.exDict))S.exDict=[]; // nomes de exercício "aprendidos" (correção ortográfica)
  if(!S.goalsResetAt)S.goalsResetAt=0; // treinos feitos antes disso não contam mais nas metas
  // migra tipos removidos: easy -> regen, tempo -> limiar, race -> longao
  const MIG={easy:'regen',tempo:'limiar',race:'long'};
  S.runs.forEach(r=>{
    if(MIG[r.type])r.type=MIG[r.type];
    if(!r.surf)r.surf='rua';
    if('elev' in r)delete r.elev;
  });
}
function persistLocal(){
  const raw=JSON.stringify(S);
  let ok=false;
  try{localStorage.setItem(LS_KEY,raw);ok=true;}
  catch(e){toast('Erro ao salvar (armazenamento cheio?)');}
  idbSet(LS_KEY,raw).catch(()=>{}); // reforço silencioso, não bloqueia a UI
  return ok;
}
// a nuvem trouxe mudanças feitas no outro aparelho: redesenha (menos no meio de uma sessão,
// pra não atrapalhar quem está digitando séries — a tela atualiza ao sair dela)
function afterCloudMerge(){
  normalizeS();
  if(view!=='session'&&view!=='msession')render();
}
async function save(){
  S._updatedAt=Date.now();
  const ok=persistLocal();
  cloudSync(); // sobe pra nuvem mesclando com o que houver lá, sem bloquear a UI
  return ok;
}

function prevSets(wid,exName){
  // busca o registro mais recente deste exercício em QUALQUER treino
  let best=null;
  S.history.forEach(s=>{
    const e=s.exercises.find(x=>x.name===exName);
    if(e&&e.sets.length&&(!best||s.date>best.date))
      best={date:s.date,wid:s.wid,wname:s.name,sets:e.sets,bw:!!e.bw};
  });
  return best;
}

/* ---------- METAS E PROGRESSO ---------- */

function periodCount(kind){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  let from;
  if(kind==='week'){
    const d=new Date(n); const dow=(d.getDay()+6)%7; // segunda = 0
    d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); from=d.getTime();
  }else if(kind==='month'){
    from=new Date(y,m,1).getTime();
  }else{
    from=new Date(y,0,1).getTime();
  }
  // treinos feitos antes de um reset de contagem (Ajustes → Metas) não contam mais —
  // sem isso, "zerar a contagem" não teria efeito nenhum no período em andamento
  from=Math.max(from,S.goalsResetAt||0);
  return S.history.filter(h=>h.date>=from).length
    + runs().filter(r=>r.date>=from).length
    + S.mobility.filter(m=>m.date>=from).length;
}
function streak(){
  // semanas consecutivas (contando de trás) em que a meta semanal foi batida
  const g=goals().week; if(!g)return 0;
  const n=new Date(); const dow=(n.getDay()+6)%7;
  let ref=new Date(n); ref.setDate(ref.getDate()-dow); ref.setHours(0,0,0,0);
  let s=0;
  for(let i=0;i<104;i++){
    const a=Math.max(ref.getTime(),S.goalsResetAt||0), b=ref.getTime()+7*86400000;
    const c=a>=b?0:S.history.filter(h=>h.date>=a&&h.date<b).length
      + runs().filter(r=>r.date>=a&&r.date<b).length
      + S.mobility.filter(m=>m.date>=a&&m.date<b).length;
    if(i===0){ if(c>=g)s++; }        // semana atual só conta se já bateu
    else{ if(c>=g)s++; else break; }
    ref.setDate(ref.getDate()-7);
  }
  return s;
}
function ringSVG(done,goal,color){
  const R=30, C=2*Math.PI*R, size=76;
  const p=goal>0?Math.min(done/goal,1):0;
  const off=C*(1-p);
  const over=goal>0&&done>goal;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="38" cy="38" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="7"/>
    ${goal>0?`<circle cx="38" cy="38" r="${R}" fill="none" stroke="${color}" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}"
      stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 38 38)"
      style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"/>`:''}
    ${over?`<circle cx="38" cy="38" r="${R-9}" fill="none" stroke="${color}"
      stroke-width="1.5" opacity=".4"/>`:''}
    <text x="38" y="37" text-anchor="middle" class="ring-ctr">${done}</text>
    <text x="38" y="49" text-anchor="middle" class="ring-sub">de ${goal||'—'}</text>
  </svg>`;
}
function ringsHTML(){
  const g=goals();
  const w=periodCount('week'), m=periodCount('month'), y=periodCount('year');
  const st=streak();
  const mRest=Math.max(0,g.month-m);
  const dLeft=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-new Date().getDate();
  let note;
  if(!g.month)note='Defina uma meta mensal em Ajustes → Metas de treino.';
  else if(m>=g.month)note=`🎉 Meta do mês batida! ${m} de ${g.month} treinos.`;
  else note=`Faltam <b style="color:var(--txt)">${mRest}</b> treino(s) para a meta do mês · ${dLeft} dia(s) restante(s)`;
  return `<div class="rings">
    <div class="rings-row">
      <div class="ring" onclick="openGoals()">
        ${ringSVG(w,g.week,'var(--accent2)')}<div class="ring-lbl">Semana</div></div>
      <div class="ring" onclick="openGoals()">
        ${ringSVG(m,g.month,'var(--accent)')}<div class="ring-lbl">Mês</div></div>
      <div class="ring" onclick="openGoals()">
        ${ringSVG(y,g.year,'#5b8def')}<div class="ring-lbl">Ano</div></div>
    </div>
    <div class="goal-note">${note}
      ${st>1?`<br><span class="streak" style="margin-top:7px">🔥 ${st} semanas seguidas na meta</span>`:''}
    </div></div>`;
}

/* ---------- DESFAZER ---------- */
// pilha de alterações (não é só 1 nível, ao contrário do planejador): cada pushUndo
// empilha uma foto do estado antes da mudança, e "Desfazer última alteração" tira a
// última foto e restaura — pode ser usado várias vezes seguidas pra voltar várias
// alterações, uma de cada vez (como um Ctrl+Z de editor de texto, com histórico).
// Fica só na memória (não é salvo no localStorage): fechar/recarregar o app zera a pilha.
let undoStack=[];
const UNDO_MAX=25;
function pushUndo(label){
  undoStack.push({label,
    workouts:JSON.parse(JSON.stringify(S.workouts||[])),
    history:JSON.parse(JSON.stringify(S.history||[])),
    runs:JSON.parse(JSON.stringify(S.runs||[])),
    plans:JSON.parse(JSON.stringify(S.plans||[])),
    mobility:JSON.parse(JSON.stringify(S.mobility||[])),
    other:JSON.parse(JSON.stringify(S.other||[])),
    goals:JSON.parse(JSON.stringify(S.goals||{}))});
  if(undoStack.length>UNDO_MAX)undoStack.shift();
}
window.undoLast=async()=>{
  if(!undoStack.length)return;
  const snap=undoStack.pop();
  S.workouts=snap.workouts;S.history=snap.history;S.runs=snap.runs;
  S.plans=snap.plans;S.mobility=snap.mobility;S.other=snap.other||[];S.goals=snap.goals;
  await save();closeM();render();toast('Desfeito: '+snap.label);
};

function suggestWorkoutName(sel){
  if(!sel||!sel.length)return '';
  const set=new Set(sel);
  const combo=MUSCLE_COMBOS.find(([ks])=>ks.length===set.size&&ks.every(k=>set.has(k)));
  if(combo)return combo[1];
  const ordered=MUSCLE_GROUPS.filter(g=>set.has(g[0])).map(g=>g[1]);
  if(ordered.length===1)return ordered[0];
  return ordered.slice(0,-1).join(', ')+' e '+ordered[ordered.length-1];
}

// converte tempo total (km,sec) em pace (min,seg por km) para exibição no modo "Pace"

// converte pace (min,seg por km) + distância em segundos totais — inverso de paceMS

// converte velocidade (km/h) + distância em segundos totais — inverso de speedOf

// velocidade média (km/h) a partir de tempo total (km,sec) — usado no modo "Velocidade"

const surfTag=r=>{const s=surfOf(r);
  return `<span class="tag-sf">${s[2]} ${s[1]}</span>`};

function structSummary(r){
  if(!r||!HAS_WU[r.type])return '';
  const p=[];
  const pc=(km,sec)=>km>0&&sec>0?` (${fmtPace(paceOf(km,sec))}/km)`:'';
  const wk=r.wu?blkKm(r.wu):0, ws=r.wu?blkSec(r.wu):0;
  const ck=r.cd?blkKm(r.cd):0, cs=r.cd?blkSec(r.cd):0;
  if(wk||ws)p.push(`<b>Aq.</b> ${wk?wk.toFixed(2)+' km':''}${wk&&ws?' · ':''}${ws?fmtDur(ws):''}${pc(wk,ws)}`);
  if(r.type==='inter'&&r.shots&&r.shots.length){
    const ss=r.shots.filter(s=>blkKm(s)||blkSec(s));
    if(ss.length){
      const same=ss.every(s=>s.km===ss[0].km&&s.m===ss[0].m&&s.s===ss[0].s);
      if(same)p.push(`<b>${ss.length}×</b> ${blkKm(ss[0]).toFixed(2)} km em ${fmtDur(blkSec(ss[0]))}${pc(blkKm(ss[0]),blkSec(ss[0]))}`);
      else p.push(`<b>${ss.length} tiros</b> ${ss.map(s=>fmtDur(blkSec(s))).join(' · ')}`);
      const rs=ss.reduce((a,s)=>a+(parseInt(s.rm)||0)*60+(parseInt(s.rs)||0),0);
      if(rs)p.push(`<b>Descanso</b> ${fmtDur(Math.round(rs/ss.length))} entre tiros`);
    }
  }else if(r.type==='fartlek'&&r.fk){
    const on=r.fk.on, off=r.fk.off, n=r.reps||1;
    p.push(`<b>${n}×</b> forte ${blkKm(on).toFixed(2)} km/${fmtDur(blkSec(on))}${pc(blkKm(on),blkSec(on))}`);
    p.push(`<b>&nbsp;&nbsp;&nbsp;</b> leve ${blkKm(off).toFixed(2)} km/${fmtDur(blkSec(off))}${pc(blkKm(off),blkSec(off))}`);
  }else if(r.type==='limiar'&&r.fk&&r.fk.on){
    const on=r.fk.on;
    if(blkKm(on)||blkSec(on))
      p.push(`<b>Limiar</b> ${blkKm(on).toFixed(2)} km em ${fmtDur(blkSec(on))}${pc(blkKm(on),blkSec(on))}`);
  }else if(r.type==='rodagem'&&r.rwMode==='on'&&r.rw){
    const run=r.rw.run, walk=r.rw.walk, n=r.rwReps||1;
    p.push(`<b>${n}×</b> 🏃 correndo ${blkKm(run).toFixed(2)} km/${fmtDur(blkSec(run))}${pc(blkKm(run),blkSec(run))}`);
    p.push(`<b>&nbsp;&nbsp;&nbsp;</b> 🚶 caminhando ${blkKm(walk).toFixed(2)} km/${fmtDur(blkSec(walk))}${pc(blkKm(walk),blkSec(walk))}`);
  }else if(r.type==='rodagem'&&Array.isArray(r.blocks)&&r.blocks.length>1){
    // rodagem em blocos: um por linha (com um bloco só não há o que detalhar)
    r.blocks.forEach((b,i)=>{const k=blkKm(b), s=rbSec(b);
      p.push(`<b>Bloco ${i+1}</b> ${k.toFixed(2)} km · ${fmtDur(s)}${pc(k,s)}`);});
  }
  if(ck||cs)p.push(`<b>Desaq.</b> ${ck?ck.toFixed(2)+' km':''}${ck&&cs?' · ':''}${cs?fmtDur(cs):''}${pc(ck,cs)}`);
  return p.length?`<div class="struct">${p.join('<br>')}</div>`:'';
}

window.runForm=id=>{
  const r=id?runs().find(x=>x.id===id):null;
  RF=r?JSON.parse(JSON.stringify(r)):{
    id:null,date:Date.now(),type:'rodagem',km:'',h:'',m:'',s:'',level:'moderado',surf:'esteira',note:'',feedback:'',
    wu:blank(),cd:blank(),reps:6,shots:[],fk:{on:blank(),off:blank()},
    rwMode:'off',rw:{run:blank(),walk:blank()},rwReps:6};
  if(RF.feedback===undefined)RF.feedback=''; // compat com registros antigos, sem o campo
  if(!RF.level)RF.level=runLevel(RF)||'moderado'; // compat com registros antigos em RPE numérico
  RF.tmode='pace';
  if(r){
    // "km"/"sec" no registro salvo são o TOTAL (aquecimento + parte principal + desaquecimento);
    // para rodagem/regenerativo/longão, o formulário edita só a parte principal (RF.km, RF.h/m/s),
    // então usamos mainKm/mainSec quando existirem — sem isso, reabrir pra editar e salvar de novo
    // fazia o aquecimento/desaquecimento serem somados de novo ao total a cada edição
    const mainKm=r.mainKm!==undefined?r.mainKm:r.km;
    RF.km=(mainKm===undefined||mainKm===null)?'':mainKm;
    const t=r.mainSec!==undefined?r.mainSec:(r.sec||0);
    RF.h=Math.floor(t/3600)||'';RF.m=Math.floor((t%3600)/60);RF.s=t%60||'';
    RF.wu=r.wu||blank(); RF.cd=r.cd||blank();
    RF.reps=r.reps||6; RF.shots=r.shots||[];
    RF.fk=r.fk||{on:blank(),off:blank()};
    RF.surf=r.surf||'rua';
    // rodagem em run-walk (intercalando corrida e caminhada) — compat: registros antigos
    // (ou de outros tipos) não têm nada disso, então caem no modo contínuo de sempre
    RF.rwMode=r.rwMode||'off';
    RF.rw=r.rw||{run:blank(),walk:blank()};
    RF.rwReps=r.rwReps||6;
  }
  rbEnsure(RF); if(RF.blocks)rbSync(RF);
  syncShots();
  drawRunForm();
};
function syncShots(){
  if(RF.type!=='inter')return;
  const n=RF.reps||1;
  while(RF.shots.length<n)RF.shots.push({km:'',m:'',s:'',rm:'',rs:''});
  RF.shots.length=n;
}
window.rfSet=(k,v)=>{RF[k]=v;if(k==='type'&&v==='rodagem'&&!(RF.blocks&&RF.blocks.length>1))RF.blocks=null;if(k==='type')syncShots();drawRunForm()};

// --- rodagem intercalando corrida e caminhada (run-walk) ---

window.rfReps=n=>{
  RF.reps=Math.max(1,Math.min(40,n));
  syncShots();drawRunForm();
};

// --- modo "Pace": converte pace informado (min:s /km) em tempo (m,s), sem alterar o dado armazenado ---

// --- modo "Velocidade" (km/h): converte para tempo usando a distância do próprio bloco ---

// --- modo "metros": distância dos tiros preenchida em metros, armazenada em km ---

// calcula totais a partir da estrutura (quando houver) — usado tanto no registro (RF) quanto no planejamento (PF)

// campo de pace (min:s /km) reutilizável para blocos fk (fartlek/limiar), tanto em RF quanto PF

// campo de velocidade (km/h) reutilizável para blocos fk (fartlek/limiar), tanto em RF quanto PF

/* ---------- RODAGEM EM BLOCOS (parte principal dividida em trechos) ---------- */
// Na rodagem "correr sem parar", a parte principal pode ter vários blocos — pra registrar/
// planejar mudanças de ritmo no meio do treino. Cada bloco tem distância e tempo próprios
// (preenchidos por pace, km/h ou tempo, conforme o "Preenchimento do tempo"). Por padrão vem
// um só; dá pra adicionar e remover. Fica salvo em "blocks" no registro/plano.
// km/h/m/s do formulário (RF/PF) ficam sempre com a SOMA dos blocos — assim trocar o tipo
// (ex.: rodagem → longão) leva o total junto. Registros/planos antigos (sem "blocks") viram
// um bloco único com a parte principal que já tinham, sem perder nada.
// Função duplicada igual no index.html e no planejador-corrida.html (mesmo formato de dado).

// blocos que vão pro registro salvo: descarta blocos extras deixados em branco
// (mantém pelo menos um) e grava só os campos do bloco

// w: 'rf' (registro de corrida feita) ou 'pf' (plano de corrida)

// depois de digitar num bloco: atualiza a soma (km/h/m/s), o resumo de cada bloco e a caixa de
// totais — sem redesenhar o formulário (senão o campo perde o foco a cada tecla)

function drawRunForm(){
  const d=new Date(RF.date);
  const dv=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const rc=rType(RF.type)[3];
  const t=RF.type, structured=!!HAS_WU[t];
  let h=`<div class="modal" onclick="if(event.target===this)closeRF()">
    <div class="modal-in">
      <h2>${RF.id?'Editar':'Registrar'} corrida</h2>
      <div class="field"><label>Tipo de treino</label>
        <div class="type-grid" style="--rc2:${rc}">${RUN_TYPES.map(x=>
          `<button class="type-b ${x[0]===RF.type?'on':''}" onclick="rfSet('type','${x[0]}')">
            <span class="te">${x[2]}</span>${x[1]}</button>`).join('')}</div></div>
      <div class="field"><label>Data</label>
        <input type="date" value="${dv}" onchange="rfDate(this.value)"></div>
      <div class="field"><label>Preenchimento do tempo</label>
        <div class="seg seg3">
          <button class="${RF.tmode==='pace'?'on':''}" onclick="rfSet('tmode','pace')">Pace</button>
          <button class="${RF.tmode==='speed'?'on':''}" onclick="rfSet('tmode','speed')">km/h</button>
          <button class="${RF.tmode==='time'?'on':''}" onclick="rfSet('tmode','time')">Tempo</button>
        </div></div>`;

  if(structured){
    h+=blkHTML(RF,'rfBlk','wu','🔸','Aquecimento');
    // parte principal
    if(t==='inter'){
      h+=`<div class="rep-ctl">
        <span class="rl">Quantidade de tiros</span>
        <button ${RF.reps<=1?'disabled':''} onclick="rfReps(${RF.reps-1})">−</button>
        <span class="rv">${RF.reps}</span>
        <button ${RF.reps>=40?'disabled':''} onclick="rfReps(${RF.reps+1})">+</button></div>`;
      RF.shots.forEach((s,i)=>{
        const spv=paceMS(blkKm(s),blkSec(s));
        h+=`<div class="shot">
          <div class="shot-h"><span>TIRO ${i+1}</span>
            ${i===0&&RF.shots.length>1?`<button class="cp" onclick="rfCopy(0)">copiar p/ todos</button>`:''}</div>
          <div class="shot-g">
            <div class="mini-f"><label>Dist. (m)</label>
              <input type="number" inputmode="numeric" step="1" value="${s.km?Math.round(blkKm(s)*1000):''}"
                placeholder="800" oninput="rfShotM(${i},this.value)"></div>
            ${RF.tmode==='pace'?`<div class="mini-f"><label>Pace m:s /km</label>
              <div class="dur2">
                <input type="number" inputmode="numeric" value="${spv.m}" placeholder="3" oninput="rfShotPace(${i},'m',this.value)">
                <div class="sep">:</div>
                <input type="number" inputmode="numeric" value="${spv.s}" placeholder="00" oninput="rfShotPace(${i},'s',this.value)">
              </div></div>`:
            RF.tmode==='speed'?`<div class="mini-f"><label>Velocidade (km/h)</label>
              <input type="number" inputmode="decimal" step="0.1" value="${speedOf(blkKm(s),blkSec(s))?speedOf(blkKm(s),blkSec(s)).toFixed(1):''}"
                placeholder="12.0" oninput="rfShotSpeed(${i},this.value)"></div>`:
            `<div class="mini-f"><label>Tempo m:s</label>
              <div class="dur2">
                <input type="number" inputmode="numeric" value="${esc(s.m)}" placeholder="3" oninput="rfShot(${i},'m',this.value)">

  setModalHTML(h);

window.closeRF=()=>{RF=null;closeM()};
window.saveRun=async()=>{
  const st=structTotals(RF);
  let km,sec;
  if(st){km=st.km;sec=st.sec;}
  else{km=parseFloat(String(RF.km).replace(',','.'))||0;sec=rfSecs();}
  if(km<=0)return toast('Informe a distância');
  if(sec<=0)return toast('Informe o tempo');
  const rec={id:RF.id||uid(),date:RF.date,type:RF.type,km,sec,level:RF.level||'moderado',
    surf:RF.surf||'rua',note:(RF.note||'').trim(),feedback:(RF.feedback||'').trim()};
  if(HAS_WU[RF.type]){
    rec.wu=RF.wu; rec.cd=RF.cd;
    if(RF.type==='inter'){rec.reps=RF.reps;rec.shots=RF.shots;}
    else if(RF.type==='fartlek'){rec.fk=RF.fk;rec.reps=RF.reps;}
    else if(RF.type==='limiar'){rec.fk=RF.fk;}
    else if(RF.type==='rodagem'&&RF.rwMode==='on'){rec.rwMode='on';rec.rw=RF.rw;rec.rwReps=RF.rwReps;}
    else if(RF.type==='rodagem'){rec.blocks=rbClean(RF);}
    rec.mainKm=st.mainKm; rec.mainSec=st.mainSec; rec.restSec=st.restSec;
  }
  pushUndo(RF.id?'editar corrida':'registrar corrida');
  S.runs=runs().filter(x=>x.id!==rec.id);
  S.runs.push(rec);
  if(!RF.id){
    const pl=matchPlan('run',rec.date,{type:rec.type});
    if(pl&&!pl.doneId)pl.doneId=rec.id;
  }
  await save();RF=null;closeM();render();toast('Corrida salva');
};
window.delRun=async id=>{
  if(!await ask('Excluir registro?','Este treino de corrida será removido do histórico.','Excluir',true))return;
  pushUndo('excluir corrida');
  S.runs=runs().filter(x=>x.id!==id);
  unlinkPlanDone(id);
  await save();RF=null;closeM();render();toast('Registro excluído');
};

      <div style="margin:-8px 0 12px">${surfTag(r)}</div>

let runPer='week';
window.setRunPer=p=>{runPer=p;render()};
function bucket(per){
  // retorna [{lbl, km, n, sec}] mais antigo -> mais recente
  const out=[], now=new Date();
  const N=per==='day'?14:per==='week'?12:per==='month'?12:5;
  for(let i=N-1;i>=0;i--){
    let a,b,lbl;
    if(per==='day'){
      const d=new Date(now); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
      a=d.getTime(); b=a+86400000;
      lbl=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    }else if(per==='week'){
      const d=new Date(now); const dow=(d.getDay()+6)%7;
      d.setDate(d.getDate()-dow-i*7); d.setHours(0,0,0,0);
      a=d.getTime(); b=a+7*86400000;
      lbl=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    }else if(per==='month'){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      a=d.getTime(); b=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();
      lbl=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][d.getMonth()];
    }else{
      const y=now.getFullYear()-i;
      a=new Date(y,0,1).getTime(); b=new Date(y+1,0,1).getTime();
      lbl=String(y).slice(2);
    }
    const rs=runs().filter(r=>r.date>=a&&r.date<b);
    out.push({lbl,km:rs.reduce((s,r)=>s+r.km,0),n:rs.length,
      sec:rs.reduce((s,r)=>s+r.sec,0)});
  }
  return out;
}
// início do intervalo coberto pelo período (mesma janela usada em bucket()) —
// usado para filtrar a distribuição por tipo e outros blocos que acompanham o seletor
function periodFrom(per){
  const now=new Date();
  const N=per==='day'?14:per==='week'?12:per==='month'?12:5;
  const i=N-1;
  if(per==='day'){
    const d=new Date(now); d.setDate(d.getDate()-i); d.setHours(0,0,0,0); return d.getTime();
  }else if(per==='week'){
    const d=new Date(now); const dow=(d.getDay()+6)%7;
    d.setDate(d.getDate()-dow-i*7); d.setHours(0,0,0,0); return d.getTime();
  }else if(per==='month'){
    return new Date(now.getFullYear(),now.getMonth()-i,1).getTime();
  }else{
    return new Date(now.getFullYear()-i,0,1).getTime();
  }
}
function runReport(){

  $('sub').textContent='Volume e ritmo';
  $('back').style.display='block';$('timer').textContent='';

    ${[['day','Dia'],['week','Semana'],['month','Mês'],['year','Ano']].map(([k,l])=>
      `<button class="${runPer===k?'on':''}" onclick="setRunPer('${k}')">${l}</button>`).join('')}
  </div>`;
  const bs=bucket(runPer);
  const mx=Math.max(...bs.map(b=>b.km),1);
  const tot=bs.reduce((a,b)=>a+b.km,0), totN=bs.reduce((a,b)=>a+b.n,0);
  const totS=bs.reduce((a,b)=>a+b.sec,0);

      <span class="delta flat">${perLbl}</span></div>
    <div class="bars">${bs.map(b=>{
      const pc=(b.km/mx)*100;
      return `<div class="bar-w">
        ${b.km?`<div class="bar-v">${b.km>=100?Math.round(b.km):b.km.toFixed(1)}</div>`:''}
        <div class="bar ${b.km?'':'z'}" style="height:${b.km?Math.max(pc,3):2}%"></div>
        <div class="bar-l">${b.lbl}</div></div>`}).join('')}</div>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><b>${tot.toFixed(1)}</b><span>km total</span></div>
      <div class="stat"><b>${totN}</b><span>treinos</span></div>
      <div class="stat"><b>${fmtPace(paceOf(tot,totS))}</b><span>pace médio</span></div>
    </div></div>`;

  // distribuição por tipo — acompanha o mesmo período selecionado acima (dia/semana/mês/ano)
  const distFrom=periodFrom(runPer);
  const rsDist=rs.filter(r=>r.date>=distFrom);
  const byType=RUN_TYPES.map(t=>{
    const f=rsDist.filter(r=>r.type===t[0]);
    return{t,n:f.length,km:f.reduce((a,r)=>a+r.km,0)};
  }).filter(x=>x.n).sort((a,b)=>b.km-a.km);
  const tkm=byType.reduce((a,x)=>a+x.km,0)||1;
  h+=`<div class="card"><div class="rep-h"><strong>Distribuição por tipo</strong>
    <span class="delta flat">${perLbl}</span></div>`;
  if(!byType.length)h+=`<div class="empty" style="padding:20px 10px">Nenhuma corrida nesse período.</div>`;
  byType.forEach(x=>{
    const p=(x.km/tkm)*100;
    h+=`<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
        <span style="color:var(--txt);font-weight:600">${x.t[2]} ${x.t[1]}</span>
        <span style="color:var(--dim)">${x.km.toFixed(1)} km · ${x.n}× · ${p.toFixed(0)}%</span></div>
      <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${p}%;background:${x.t[3]};border-radius:4px"></div></div></div>`;
  });
  h+='</div>';

  // distribuição por nível de esforço — mesmo período, mesma janela de rsDist
  const byLevel=RUN_LEVELS.map(l=>{
    const f=rsDist.filter(r=>runLevel(r)===l[0]);
    return{l,n:f.length,km:f.reduce((a,r)=>a+r.km,0)};
  }).filter(x=>x.n);
  const lkm=byLevel.reduce((a,x)=>a+x.km,0)||1;
  h+=`<div class="card"><div class="rep-h">
      <div class="lbl-row" style="margin:0"><strong style="flex:none">Distribuição por nível de esforço</strong>
        <button type="button" class="qbtn" onclick="levelInfo()">?</button></div>
      <span class="delta flat">${perLbl}</span></div>`;
  if(!byLevel.length)h+=`<div class="empty" style="padding:20px 10px">Nenhuma corrida classificada nesse período.</div>`;
  byLevel.forEach(x=>{
    const p=(x.km/lkm)*100;
    h+=`<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
        <span style="color:var(--txt);font-weight:600">${x.l[2]} ${x.l[1]}</span>
        <span style="color:var(--dim)">${x.km.toFixed(1)} km · ${x.n}× · ${p.toFixed(0)}%</span></div>
      <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${p}%;background:${x.l[3]};border-radius:4px"></div></div></div>`;
  });
  h+='</div>';

  // evolução de pace
  const sorted=[...rs].sort((a,b)=>a.date-b.date);
  const paced=sorted.filter(r=>paceOf(r.km,r.sec)>0);
  if(paced.length>=2){
    const ps=paced.map(r=>paceOf(r.km,r.sec));
    const ls=paced.map(r=>fdate(r.date).slice(0,5));
    const f=ps[0], l=ps[ps.length-1], d=l-f;
    const best=Math.min(...ps);
    // pace menor = melhor, então invertemos o sinal visual
    const cls=d<0?'up':d>0?'down':'flat';
    const arw=d<0?'▲':d>0?'▼':'—';
    h+=`<div class="card">
      <div class="rep-h"><strong>Pace médio por treino</strong>
        <span class="delta ${cls}">${arw} ${d===0?'sem variação':fmtPace(Math.abs(d))+'/km'}</span></div>
      ${sparkline(ps.map(p=>-p),ls)}
      <div class="mini">Do primeiro <b>${fmtPace(f)}</b> ao último <b>${fmtPace(l)}</b>
        · melhor <b>${fmtPace(best)}</b></div>
      <div class="rec">Linha subindo = pace melhorando (menos tempo por km). O pace varia
        muito conforme o tipo de treino — compare treinos parecidos entre si.</div></div>`;
  }

  // recordes
  const longest=rs.reduce((a,r)=>r.km>(a?a.km:0)?r:a,null);
  const fastest=paced.reduce((a,r)=>paceOf(r.km,r.sec)<(a?paceOf(a.km,a.sec):1e9)?r:a,null);
  const totalKm=rs.reduce((a,r)=>a+r.km,0);
  h+=`<div class="card"><div class="rep-h"><strong>Marcas</strong></div>
    <div class="hist-row"><span style="color:var(--txt)">Distância acumulada</span>
      <span><b style="color:var(--accent2)">${totalKm.toFixed(1)} km</b></span></div>
    ${longest?`<div class="hist-row"><span style="color:var(--txt)">Maior distância</span>
      <span>${longest.km.toFixed(2)} km · ${fdate(longest.date)}</span></div>`:''}
    ${fastest?`<div class="hist-row"><span style="color:var(--txt)">Melhor pace</span>
      <span>${fmtPace(paceOf(fastest.km,fastest.sec))}/km · ${fdate(fastest.date)}</span></div>`:''}
    <div class="hist-row"><span style="color:var(--txt)">Tempo total em movimento</span>
      <span>${fmtDur(rs.reduce((a,r)=>a+r.sec,0))}</span></div>
    </div>`;
  $('app').innerHTML=h;
  $('fab').innerHTML='<button class="fab" style="background:#5b8def;color:#fff" onclick="runForm()">+ Registrar corrida</button>';
}

let calRef=null, calSel=null;

function dayEvents(){
  // mapa: 'YYYY-MM-DD' -> [{k,date,color,label,d}]
  const m={};
  S.history.forEach(s=>{
    const w=S.workouts.find(x=>x.id===s.wid);
    const k=dayKey(s.date);
    (m[k]=m[k]||[]).push({k:'gym',date:s.date,color:wColor(w)||'var(--accent)',
      label:s.name,d:s});
  });
  runs().forEach(r=>{
    const t=rType(r.type), k=dayKey(r.date);
    (m[k]=m[k]||[]).push({k:'run',date:r.date,color:t[3],
      label:t[1],d:r,ic:t[2]});
  });
  S.mobility.forEach(ms=>{
    const w=S.workouts.find(x=>x.id===ms.wid);
    const k=dayKey(ms.date);
    (m[k]=m[k]||[]).push({k:'mobility',date:ms.date,color:wColor(w)||'#5f9e8f',
      label:ms.name,d:ms});
  });
  Object.values(m).forEach(a=>a.sort((x,y)=>x.date-y.date));
  return m;
}

function calendar(){
  const ref=calRef||new Date();
  const y=ref.getFullYear(), mo=ref.getMonth();

  $('sub').textContent='Calendário do mês';

  });
  const first=new Date(y,mo,1);
  const startDow=(first.getDay()+6)%7;

  const prevN=new Date(y,mo,0).getDate();
  const todayK=dayKey(Date.now());

  const isFuture=y>now.getFullYear()||(y===now.getFullYear()&&mo>now.getMonth());
  const showKm=calFlt==='run';

  let h=`<div class="seg" style="margin-bottom:12px">
    <button class="${histView==='list'?'on':''}" onclick="setHistView('list')">🕘 Lista</button>

  </div>`;

  h+=`<div class="flt">

  </div>`;

  h+='<div class="cal">';

  for(let d=1;d<=nDays;d++){

    const es=ev[k]||[];
    es.forEach(e=>{
      if(e.k==='gym')mGym++;
      else if(e.k==='mobility')mMob++;

let __confirmResolve=null;

  return new Promise(resolve=>{

      esc(rotuloOk||'Confirmar')+'</button>'+
      '</div></div></div>';
  });
}

  document.getElementById('confirm').innerHTML='';

/* ---------- CONFIRMAÇÃO DE NOME DE EXERCÍCIO (correção ortográfica) ----------
   Sempre que um nome digitado não bate com a lista conhecida (embutida + já usados
   no app), pergunta antes de aceitar: se achou algo parecido, sugere a correção;
   senão, confirma que é mesmo um exercício novo. Devolve o nome final escolhido
   (Promise<string>), ou null se o usuário preferiu voltar e corrigir por conta própria. */

// função de conveniência: roda a checagem e, se o usuário confirmar algum nome
// (com ou sem correção), aplica via applyFn(nome). Se o usuário optar por "Corrigir",
// applyFn não é chamado — o campo continua como o usuário deixou.

/* ---------- AUTOCOMPLETE DE NOME DE EXERCÍCIO (caixa de sugestões ao digitar) ----------
   Diferente da checagem acima (que só age quando o campo perde o foco), isto aparece
   AO VIVO, a cada tecla: uma pequena lista abaixo do campo com os nomes conhecidos que
   batem com o que já foi digitado, se ajustando a cada novo caractere. Complementa a
   checagem de ortografia — ajuda a nunca digitar errado, em vez de só corrigir depois. */

// desenha (ou esconde) a caixa de sugestões de um campo específico; applyFn(nome) roda
// quando o usuário toca numa sugestão

// onmousedown+preventDefault (em vez de onclick) garante que o toque na sugestão é
// processado ANTES do campo perder o foco — senão o blur escondia a caixa antes do clique
// "acontecer" de verdade, um problema clássico de autocomplete em HTML puro

/* ---------- DIAGNÓSTICO ---------- */
window.__log=[];
function dbg(m){
  window.__log.push(new Date().toLocaleTimeString('pt-BR')+' · '+m);

  if(el)el.textContent=window.__log.slice(-25).reverse().join('\n');
}

/* ---------- DELEGAÇÃO DE EVENTOS ---------- */
function handleAct(ev){
  let el=null;
  try{ el=ev.target&&ev.target.closest?ev.target.closest('[data-act]'):null; }
  catch(e){ dbg('closest falhou: '+e.message); }
  if(!el){
    // fallback: sobe a árvore manualmente
    let n=ev.target;
    while(n&&n!==document.body){
      if(n.getAttribute&&n.getAttribute('data-act')){el=n;break;}
      n=n.parentNode;
    }
  }
  if(!el)return;
  const act=el.getAttribute('data-act');
  const arg=el.getAttribute('data-arg');
  dbg('clique: '+act+' arg='+arg);
  ev.preventDefault();
  ev.stopPropagation();
  try{
    if(act==='delplan')delPlanNow(arg);
    else if(act==='editplan')planEdit(arg);
    else if(act==='histday')histDayDetail(arg);
    else if(act==='swapex')doSwapEx(window.__swapFiltered[parseInt(arg)]);
    else dbg('acao desconhecida: '+act);
  }catch(e){ dbg('EXCECAO em '+act+': '+e.message); }
}
document.addEventListener('click',handleAct,true);
document.addEventListener('touchend',function(ev){
  const t=ev.target;
  const el=t&&t.closest?t.closest('[data-act]'):null;
  if(el){ ev.preventDefault(); handleAct(ev); }
},{passive:false,capture:true});

// exclusão direta, sem depender de PF nem de modal aberto
async function delPlanNow(id){
  dbg('delPlanNow('+id+')');
  if(!S.plans){dbg('S.plans indefinido!');return;}
  const p=S.plans.find(x=>x.id===id);
  if(!p){dbg('plano NAO encontrado');toast('Plano não encontrado');return;}
  let nome;
  try{
    if(p.kind==='run'){const t=rType(p.type);
      nome=t[1]+(p.km?' de '+p.km+' km':'')+' em '+fdate(p.date);}
    else if(p.kind==='mobility'){nome=mobPlanLabel(p)+' em '+fdate(p.date);}
    else{nome=gymPlanLabel(p)+' em '+fdate(p.date);}
  }catch(e){nome='treino';}
  const ok=await ask('Excluir do planejamento?',nome,'Excluir',true);
  dbg('confirmacao='+ok);
  if(!ok)return;
  pushUndo('excluir plano do dia');
  S.plans=S.plans.filter(x=>x.id!==id);
  PF=null;
  // se era um esporádico nunca executado, remove o treino também
  if(p.kind==='gym'&&p.wid){
    const w=S.workouts.find(x=>x.id===p.wid);
    if(w&&w.adhoc&&!S.history.some(h=>h.wid===w.id)&&!S.plans.some(x=>x.wid===w.id))
      S.workouts=S.workouts.filter(x=>x.id!==w.id);
  }
  try{ await save(); }catch(e){ dbg('save falhou: '+e.message); }
  try{ closeM(); }catch(e){}
  try{ render(); }catch(e){ dbg('RENDER FALHOU: '+e.message); }
  toast('Excluído do plano');
}

const plans=()=>S.plans||[];
const planKey=ts=>dayKey(ts);

// plano de corrida: {id,kind:'run',date,type,km,sec?,note,doneId}
// plano de musculação: {id,kind:'gym',date,wid,targets:{exName:{reps,peso}},note,doneId}

function plansOn(k,kind){
  return plans().filter(p=>planKey(p.date)===k&&(!kind||p.kind===kind))
    .sort((a,b)=>a.date-b.date);
}
function weekStart(ts){
  const d=new Date(ts); const dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d.getTime();
}
function weekPlans(ws){
  return plans().filter(p=>p.date>=ws&&p.date<ws+7*86400000);
}
function weekDone(ws){
  const a=ws, b=ws+7*86400000;
  return{runs:runs().filter(r=>r.date>=a&&r.date<b),
         gym:S.history.filter(h=>h.date>=a&&h.date<b)};
}
// solta o vínculo de qualquer plano que apontava pro registro excluído (senão o plano
// ficava "preso" como feito, sem nenhum registro real por trás, ao excluir a sessão
// direto pelo histórico em vez de desmarcar pelo próprio plano)

// marca plano como cumprido ao salvar um registro
function matchPlan(kind,date,extra){
  const k=planKey(date);
  const cands=plansOn(k,kind).filter(p=>!p.doneId);
  if(!cands.length)return null;
  if(kind==='run'&&extra&&extra.type){
    const same=cands.find(p=>p.type===extra.type);
    if(same)return same;
  }
  if((kind==='gym'||kind==='mobility')&&extra&&extra.wid){
    const same=cands.find(p=>p.wid===extra.wid);
    if(same)return same;
  }
  return cands[0];
}

/* --- PLANO (mês) — todos os tipos de treino juntos --- */
function planCal(y,mo){
  purgeStalePlans();
  const first=new Date(y,mo,1);
  const todayK=dayKey(Date.now());
  let h=`<div class="cal-nav">
    <button onclick="plMove(-1)">‹</button>
    <div class="cm">${MESES[mo]} ${y}</div>
    <button onclick="plMove(1)">›</button></div>`;

  // agrupa por semana
  const ws0=weekStart(first.getTime());
  const weeks=[];
  for(let t=ws0;t<new Date(y,mo+1,1).getTime();t+=7*86400000)weeks.push(t);

  // aviso de progressão de volume (corrida)
  const vols=weeks.map(ws=>weekPlans(ws).filter(p=>p.kind==='run')
    .reduce((a,p)=>a+(p.km||0),0));
  let warn='';
  for(let i=1;i<weeks.length;i++){
    if(vols[i-1]>0&&vols[i]>vols[i-1]*1.15){
      const pc=Math.round((vols[i]/vols[i-1]-1)*100);
      warn=`⚠️ A semana de ${fdate(weeks[i]).slice(0,5)} tem ${pc}% mais volume de corrida que a anterior
        (${vols[i-1].toFixed(0)} → ${vols[i].toFixed(0)} km). Aumentos acima de ~10% por semana
        elevam o risco de lesão.`;
      break;
    }
  }
  if(warn)h+=`<div class="warn">${warn}</div>`;

  const monthPlans=plans().filter(p=>{const d=new Date(p.date);
    return d.getFullYear()===y&&d.getMonth()===mo;});
  const monthGymDone=S.history.filter(r=>{const d=new Date(r.date);
    return d.getFullYear()===y&&d.getMonth()===mo;}).length;
  const monthRunDone=runs().filter(r=>{const d=new Date(r.date);
    return d.getFullYear()===y&&d.getMonth()===mo;}).length;
  const monthMobDone=S.mobility.filter(r=>{const d=new Date(r.date);
    return d.getFullYear()===y&&d.getMonth()===mo;}).length;
  const doneTot=monthGymDone+monthRunDone+monthMobDone;
  const doneN=monthPlans.filter(p=>p.doneId).length;
  h+=`<div class="rings" style="padding:13px">
    <div class="run-metrics" style="justify-content:space-around">
      <div class="rm" style="align-items:center"><b>${monthPlans.length}</b><span>planejados</span></div>
      <div class="rm" style="align-items:center"><b>${doneTot}</b><span>realizados</span></div>
      <div class="rm" style="align-items:center"><b>${monthPlans.length?Math.round(doneN/monthPlans.length*100):0}%</b><span>aderência</span></div>
    </div></div>`;

  if(!activeW('gym').length&&!activeW('mobility').length){
    h+=`<div class="empty" style="padding:20px 14px">Crie um treino em <b>Ajustes → Treinos de musculação/mobilidade</b> para poder planejar
      musculação ou mobilidade (corrida pode ser planejada direto por aqui).</div>`;
  }

  const linkedDone=new Set(plans().filter(p=>p.doneId).map(p=>p.doneId));
  weeks.forEach((ws,wi)=>{
    const wp=weekPlans(ws).filter(p=>p.kind==='run');
    const wd=weekDone(ws).runs;
    const pk=wp.reduce((a,p)=>a+(p.km||0),0);
    const dk=wd.reduce((a,r)=>a+r.km,0);
    const isCurWeek=todayK>=dayKey(ws)&&todayK<=dayKey(ws+6*86400000);
    h+=`<div class="pl-week"${isCurWeek?' id="pl-week-cur"':''}>
      <div class="pl-wh"><span class="pw">Semana ${wi+1}</span>
        ${pk||dk?`<span class="pv">${dk.toFixed(1)} / ${pk.toFixed(0)} km</span>`:''}
        <button class="btn-ghost btn-sm" onclick="tplPick(${ws})">modelo</button></div>
      <div class="pl-body">`;
    for(let i=0;i<7;i++){
      const dt=new Date(ws+i*86400000);
      const k=dayKey(dt.getTime());
      const inMonth=dt.getMonth()===mo;
      h+=`<div class="pl-day ${k===todayK?'today':''}" style="${inMonth?'':'opacity:.35'}">
        <div class="pd">${DOW[dt.getDay()]}<i>${dt.getDate()}</i></div>
        <div class="pl-slot">`;
      if(k<todayK){
        // dia passado: a aba Plano vira histórico puro aqui — mostra o que foi
        // realmente feito (via S.history/S.mobility/runs), não o que estava planejado
        historyItemsOn(k).forEach(it=>{h+=historyItemHTML(it);});
        otherItemsOn(k).forEach(o=>{h+=otherItemHTML(o);});
      }else{
        plansOn(k).forEach(p=>{h+=planItemHTML(p);});
        // treinos já registrados como feitos neste dia que NÃO cumprem nenhum plano
        // (os que cumprem já aparecem acima, como plano "feito") — sem isso, um treino
        // fora do planejado só aparecia na aba Plano a partir do dia seguinte
        historyItemsOn(k).filter(it=>!linkedDone.has(it.d.id)).forEach(it=>{h+=historyItemHTML(it);});
        // "treino diferente" não é planejado — é sempre um registro do que já foi feito,
        // então aparece mesmo no dia de hoje (que normalmente só mostra planejamento)
        otherItemsOn(k).forEach(o=>{h+=otherItemHTML(o);});
        h+=`<button class="pl-add" onclick="planPickKind(${dt.getTime()})">+ planejar</button>`;
      }
      h+=`</div></div>`;
    }
    h+='</div></div>';
  });

  // distribuição por nível de esforço — planejado (topo) vs realizado (baixo), mesmo mês (corrida)
  const monthPlansRun=plans().filter(p=>{const d=new Date(p.date);
    return p.kind==='run'&&d.getFullYear()===y&&d.getMonth()===mo;});
  const monthRuns=runs().filter(r=>{const d=new Date(r.date);
    return d.getFullYear()===y&&d.getMonth()===mo;});
  if(monthPlansRun.length||monthRuns.length){
    const totP=monthPlansRun.reduce((a,p)=>a+(p.km||0),0)||1;
    const totD=monthRuns.reduce((a,r)=>a+r.km,0)||1;
    let lh='';
    RUN_LEVELS.forEach(l=>{
      const pk=monthPlansRun.filter(p=>(p.level||'moderado')===l[0]).reduce((a,p)=>a+(p.km||0),0);
      const dk=monthRuns.filter(r=>runLevel(r)===l[0]).reduce((a,r)=>a+r.km,0);
      if(!pk&&!dk)return;
      const pp=(pk/totP)*100, dp=(dk/totD)*100;
      lh+=`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
          <span style="color:var(--txt);font-weight:600">${l[2]} ${l[1]}</span>
          <span style="color:var(--dim)">planejado ${pk.toFixed(1)}km (${pp.toFixed(0)}%) · real ${dk.toFixed(1)}km (${dp.toFixed(0)}%)</span></div>
        <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:3px">
          <div style="height:100%;width:${pp}%;background:${l[3]};border-radius:4px"></div></div>
        <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;opacity:.5">
          <div style="height:100%;width:${dp}%;background:${l[3]};border-radius:4px"></div></div>
      </div>`;
    });
    h+=`<div class="card"><div class="rep-h">
        <div class="lbl-row" style="margin:0"><strong style="flex:none">Distribuição por nível — corrida (mês)</strong>
          <button type="button" class="qbtn" onclick="levelInfo()">?</button></div></div>
      ${lh||'<div class="empty" style="padding:16px 10px">Sem corridas classificadas ainda.</div>'}
      <div class="legend" style="margin-top:2px">
        <span class="lg"><i style="background:var(--txt)"></i>barra de cima: planejado</span>
        <span class="lg" style="opacity:.65"><i style="background:var(--dim)"></i>barra de baixo: realizado</span>
      </div></div>`;
  }
  return h;
}

window.planUndoAskById=id=>{

window.planUndoAsk=async p=>{
  let nome;
  try{
    if(p.kind==='run'){const t=rType(p.type); nome=t[1]+(p.km?' de '+p.km+' km':'');}
    else if(p.kind==='mobility'){nome=mobPlanLabel(p);}
    else{nome=gymPlanLabel(p);}
  }catch(e){nome='Este treino';}
  // corrida: o "feito" é sempre 1:1 com uma corrida registrada — desfazer também apaga
  // essa corrida do histórico (senão sobraria uma corrida "solta", sem plano nenhum
  // apontando pra ela, inflando estatísticas/calendário sem o usuário perceber).
  // musculação e mobilidade: o registro guarda séries/cargas ou exercícios feitos à mão,
  // que têm valor por si só — desfazer a marcação só solta o plano de volta pra pendente,
  // sem tocar no que já foi salvo no histórico.
  const isRunKind=p.kind==='run';
  const texto=isRunKind
    ?`"${nome}" em ${fdate(p.date)} está marcado como feito. Desfazer volta o plano para pendente `+
      `e apaga a corrida registrada no histórico.`
    :`"${nome}" em ${fdate(p.date)} está marcado como feito. Desfazer volta o plano para pendente — `+
      `o registro já salvo no histórico não é apagado.`;
  const ok=await ask('Desfazer treino feito?',texto,'Desfazer',true);
  if(!ok)return;
  pushUndo('desfazer marcação de treino feito');
  if(isRunKind&&p.doneId){
    const idx=S.runs.findIndex(x=>x.id===p.doneId);
    if(idx>=0)S.runs.splice(idx,1);
  }
  p.doneId=null;
  await save();closeM();render();toast(isRunKind?'Marcação desfeita — corrida removida do histórico':'Marcação desfeita — plano voltou a pendente');
};

window.savePlan=async()=>{
  if(PF.kind==='run'){
    const st=structTotals(PF);
    const km=st?st.km:(parseFloat(String(PF.km).replace(',','.'))||0);
    if(km<=0)return toast(st?'Preencha ao menos um trecho do treino':'Informe a distância planejada');
    const rec={id:PF.id||uid(),kind:'run',date:PF.date,type:PF.type,km,
      note:(PF.note||'').trim()};
    if(PF.level)rec.level=PF.level;
    if(HAS_WU[PF.type]){
      rec.wu=PF.wu; rec.cd=PF.cd;
      if(PF.type==='inter'){rec.reps=PF.reps;rec.shots=PF.shots;}
      else if(PF.type==='fartlek'){rec.fk=PF.fk;rec.reps=PF.reps;}
      else if(PF.type==='limiar'){rec.fk=PF.fk;}
      else if(PF.type==='rodagem'&&PF.rwMode==='on'){rec.rwMode='on';rec.rw=PF.rw;rec.rwReps=PF.rwReps;}
      else if(PF.type==='rodagem'){rec.blocks=rbClean(PF);}
      rec.mainKm=st.mainKm; rec.mainSec=st.mainSec; rec.restSec=st.restSec;
    }else{
      // (inalcançável: HAS_WU cobre todos os tipos de corrida)
      const targetSec=pfSecs();
      if(targetSec>0)rec.targetSec=targetSec;
    }
    pushUndo(PF.id?'editar plano de corrida':'planejar corrida');
    S.plans=plans().filter(x=>x.id!==rec.id);
    S.plans.push(rec);
  }else if(PF.kind==='gym'){
    const rec={id:PF.id||uid(),kind:'gym',date:PF.date,mode:PF.mode,note:(PF.note||'').trim()};
    if(PF.mode==='workout'){
      if(!PF.wid)return toast('Escolha um treino');
      rec.wid=PF.wid; rec.targets=PF.targets||{};
    }else if(PF.mode==='muscles'){
      if(!PF.muscles||!PF.muscles.length)return toast('Escolha pelo menos um grupo muscular');
      rec.muscles=PF.muscles;
    }else{ // custom
      const exs=(PF.exercises||[]).filter(e=>(e.name||'').trim());
      if(!exs.length)return toast('Adicione pelo menos um exercício');
      rec.exercises=exs.map(e=>({name:e.name.trim(),sets:e.sets||'',reps:e.reps||'',note:e.note||''}));
    }
    pushUndo(PF.id?'editar plano de musculação':'planejar musculação');
    S.plans=plans().filter(x=>x.id!==rec.id);
    S.plans.push(rec);
  }else if(PF.kind==='mobility'){
    if(!PF.wid)return toast('Escolha um treino de mobilidade');
    const rec={id:PF.id||uid(),kind:'mobility',date:PF.date,wid:PF.wid,note:(PF.note||'').trim()};
    pushUndo(PF.id?'editar plano de mobilidade':'planejar mobilidade');
    S.plans=plans().filter(x=>x.id!==rec.id);
    S.plans.push(rec);
  }
  await save();PF=null;closeM();render();toast('Planejado');
};

function gymPlanLabel(p){

    if(!p.muscles||!p.muscles.length)return 'Musculação';
    const set=new Set(p.muscles);
    const combo=MUSCLE_COMBOS.find(([ks])=>ks.length===set.size&&ks.every(k=>set.has(k)));
    if(combo)return combo[1];
    const names=p.muscles.map(m=>{const g=muscleG(m);return g?g[2]+' '+g[1]:m;});

  if(p.mode==='custom'){
    const n=(p.exercises||[]).length;
    return n?`${n} exercício${n>1?'s':''}`:'Personalizado';

          oninput="pfExSet(${i},'note',this.value)"></div>

    h+=`<button class="btn-ghost btn-sm" style="width:100%;margin-bottom:12px" onclick="pfExAdd()">+ exercício</button>`;

  // registrados só no plano. Só faz sentido no modo PERSONALIZADO: é o único modo em que a
  // lista de exercícios vive só ali dentro do plano (nos outros dois — "Treino salvo" aponta
  // pra um treino que já dá pra abrir e rodar normalmente pela aba Treinos, e "Grupos" nem tem
  // exercícios definidos ainda). Vale pra qualquer data (passado pendente, hoje ou futuro) — a
  // sessão nasce com a data de HOJE (pfStartCustom→openW já faz isso) mas continua vinculada a
  // este plano original, que fica marcado como feito ao salvar.
  if(PF.id&&PF.mode==='custom'&&(PF.exercises||[]).some(e=>(e.name||'').trim())){

  if(p.kind==='run'){const t=rType(p.type);return t[2]+' '+t[1]+(p.km?' de '+p.km+' km':'');}

window.dupSave=async()=>{

  rec.id=uid();

        ${WEEK_TPL.map(t=>`<button class="tpl-b" onclick="applyTpl(${ws},'${t[0]}')">

      <button class="menu-item" style="justify-content:center;color:var(--dim)" onclick="closeM()">Cancelar</button>

window.applyTpl=async(ws,key)=>{
  const t=WEEK_TPL.find(x=>x[0]===key); if(!t)return;
  pushUndo('preencher semana com modelo');
  // remove planos de corrida não executados desta semana
  S.plans=plans().filter(p=>
    !(p.kind==='run'&&p.date>=ws&&p.date<ws+7*86400000&&!p.doneId));
  t[3].forEach(item=>{
    const dt=new Date(ws+item.d*86400000); dt.setHours(7,0,0,0);
    S.plans.push({id:uid(),kind:'run',date:dt.getTime(),
      type:item.type,km:item.km,note:''});
  });
  await save();closeM();render();toast('Semana preenchida');
};

  const d=new Date();
  const days=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);

/* ---------- ABA TREINOS: contador + frase do dia + treinos de hoje ----------
   Sem seletor de módulo e sem a lista de treinos salvos (que foi pra Ajustes → Treinos de
   musculação / Treinos de mobilidade). Mostra só o que está planejado pra hoje (tocar =
   iniciar/registrar) e o que já foi feito hoje; "+ Novo treino" pergunta o que registrar. */
function todayCardHTML(o){
  // o: {ic,title,sub,color,done,act}
  return `<div class="card td-item ${o.done?'done':''}" style="--tc:${o.color}" onclick="${o.act}">
    <span class="td-ic">${o.ic}</span>
    <div class="td-tx"><b>${esc(o.title)}</b>${o.sub?`<span>${esc(o.sub)}</span>`:''}</div>
    <span class="td-st">${o.done?'✓ feito':'▶ iniciar'}</span></div>`;
}
function todayItemsHTML(){
  const k=dayKey(Date.now());
  const ps=plansOn(k);
  const linked=new Set(plans().filter(p=>p.doneId).map(p=>p.doneId));
  let h='';
  ps.forEach(p=>{
    const done=!!p.doneId;
    const act=done?`planDoneDetailById('${p.id}')`:`startPlanToday('${p.id}')`;
    if(p.kind==='run'){
      const t=rType(p.type);
      h+=todayCardHTML({ic:t[2],title:t[1]+(p.km?' · '+(+p.km).toFixed(1)+' km':''),
        sub:p.note||'Corrida planejada',color:t[3],done,act});
    }else if(p.kind==='mobility'){
      h+=todayCardHTML({ic:'🧘',title:mobPlanLabel(p),sub:p.note||'Mobilidade planejada',color:'#5f9e8f',done,act});
    }else{
      h+=todayCardHTML({ic:'🏋️',title:gymPlanLabel(p),sub:p.note||'Musculação planejada',color:'var(--accent)',done,act});
    }
  });
  // feitos hoje sem plano por trás (os vinculados já aparecem acima como "✓ feito")
  historyItemsOn(k).filter(it=>!linked.has(it.d.id)).forEach(it=>{
    const d=it.d, act=`histDayDetail('${it.kind}:${d.id}')`;
    if(it.kind==='run'){
      const t=rType(d.type);
      h+=todayCardHTML({ic:t[2],title:t[1]+' · '+(d.km||0).toFixed(2)+' km',

/* ---------- EDITOR DE TREINO ---------- */
function editW(id,opts){
  const w=id?S.workouts.find(x=>x.id===id):{name:'',exercises:[]};
  const avulso=!id&&!!(opts&&opts.avulso);
  window.__avulso=avulso;
  let exs=w.exercises.map(e=>typeof e==='string'
    ?{name:e,sets:'',reps:'',note:'',link:false}
    :{name:e.name,sets:e.sets||'',reps:e.reps||'',note:e.note||'',link:!!e.link});
  // treino novo já começa com 5 exercícios em branco prontos pra preencher, em vez de 1
  if(!exs.length)exs=Array.from({length:5},()=>({name:'',sets:'',reps:'',note:'',link:false}));
  window.__adhoc=false;
  window.__exs=exs;
  // grupos musculares não são mais escolhidos aqui (a tela começa direto pelo nome do
  // treino), mas um treino já existente que tinha essa marcação continua com ela salva
  window.__muscles=(w.muscles||[]).slice();
  const draw=()=>{
    const ad=window.__adhoc;
    // aqui a rolagem só pode ser restaurada DEPOIS de drawEx() preencher os
    // exercícios — se restaurar logo após o innerHTML (como o setModalHTML faz),
    // a lista ainda está vazia, a altura rolável é menor e o valor fica truncado
    const modalEl=$('modal');
    const prevBox=modalEl.querySelector('.modal-in');
    const prevScroll=prevBox?prevBox.scrollTop:0;
    modalEl.innerHTML=`<div class="modal">
      <div class="modal-in">
        <h2>${id?'Editar treino':avulso?'⚡ Treino avulso':'Novo treino'}</h2>
        ${avulso?'<div class="adhoc-hint" style="margin:-6px 0 12px">Monte os exercícios e inicie. Ele não fica na sua lista de treinos salvos — o registro vai pro histórico normalmente.</div>':''}
        <div class="field"><label>Nome do treino</label>
          <input id="wn" value="${esc(w.name)}" placeholder="${ad?'Ex: Academia do hotel':'Ex: Peito e Tríceps'}"></div>
        <label>Exercícios</label>
        <div id="exl"></div>
        <button class="btn-ghost btn-sm" style="margin:8px 0 16px" onclick="addEx()">+ Adicionar exercício</button>
        ${id||avulso?'':`<button class="adhoc-t ${ad?'on':''}" onclick="tgAdhoc()">
          <input type="checkbox" ${ad?'checked':''} onclick="event.stopPropagation();tgAdhoc()">
          ⚡ Treino esporádico</button>
        ${ad?`<div class="adhoc-hint">Treino esporádico: aparece na lista normalmente,
          mas assim que você completar a sessão pela primeira vez ele é arquivado
          automaticamente. Histórico e evolução continuam registrados normalmente.</div>`:''}`}
        <div class="row">
          <button class="btn-ghost" onclick="closeM()">Cancelar</button>
          <button class="btn-a" onclick="saveW('${id||''}')">${avulso?'▶ Iniciar treino':'Salvar'}</button>
        </div>
      </div></div>`;
    drawEx();
    const newBox=modalEl.querySelector('.modal-in');
    if(newBox)newBox.scrollTop=prevScroll;
  };
  window.tgAdhoc=()=>{
    const el=$('wn'); if(el)w.name=el.value;   // preserva o que foi digitado
    window.__adhoc=!window.__adhoc;
    draw();
  };
  window.addEx=()=>{window.__exs.push({name:'',sets:'',reps:'',note:''});drawEx();
    setTimeout(()=>{const n=document.querySelectorAll('.ex-blk .exn');
      if(n.length)n[n.length-1].focus();},50)};
  window.rmEx=i=>{window.__exs.splice(i,1);
    if(!window.__exs.length)window.__exs.push({name:'',sets:'',reps:'',note:''});drawEx()};
  window.exSet=(i,k,v)=>{window.__exs[i][k]=v};
  // a cada tecla, mostra sugestões de nomes conhecidos que batem com o que já foi
  // digitado (caixa "ao vivo", se ajustando conforme digita mais caracteres)
  window.exNameInputTpl=(i,v)=>{
    window.__exs[i].name=v;
    renderExSuggestions('exsug-tpl-'+i,v,name=>{
      if(!window.__exs[i])return;
      window.__exs[i].name=name;
      const el=document.getElementById('exn-'+i);
      if(el)el.value=name;
    });
  };
  // ao sair do campo de nome, confere se bate com a lista de exercícios conhecidos;
  // se não bater, sugere correção (ou confirma que é um exercício novo mesmo)
  window.exNameBlurTpl=i=>{
    hideExSuggestions('exsug-tpl-'+i);
    const typed=window.__exs[i]&&window.__exs[i].name;
    checkExerciseNameThen(typed,name=>{
      if(!window.__exs[i])return;
      window.__exs[i].name=name;
      drawEx();
    });
  };
  function drawEx(){
    $('exl').innerHTML=window.__exs.map((e,i)=>`
      <div class="blk ex-blk">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
          <div class="ex-name-wrap" style="flex:1;position:relative">
            <input id="exn-${i}" class="exn" style="width:100%;font-weight:600" value="${esc(e.name)}"
              placeholder="Ex: Supino reto" oninput="exNameInputTpl(${i},this.value)" onblur="exNameBlurTpl(${i})">
            <div class="ex-sug" id="exsug-tpl-${i}"></div>
          </div>
          <button class="btn-ghost" style="padding:9px 11px;flex:none" onclick="rmEx(${i})">✕</button>
        </div>
        <div class="mini-row">
          <div class="mini-f"><label>Séries</label>
            <input type="number" inputmode="numeric" value="${esc(e.sets)}"
              placeholder="3" oninput="exSet(${i},'sets',this.value)"></div>
          <div class="mini-f"><label>Reps</label>
            <input type="number" inputmode="numeric" value="${esc(e.reps)}"
              placeholder="10" oninput="exSet(${i},'reps',this.value)"></div>
        </div>
        <div class="field" style="margin:9px 0 0"><label>Observação</label>
          <input value="${esc(e.note)}" placeholder="Ex: cadência lenta na descida"
            oninput="exSet(${i},'note',this.value)"></div>
      </div>`).join('');
  }
  draw();
  // foca o campo de nome só na abertura inicial do formulário (treino novo),
  // nunca nos redesenhos seguintes — senão o foco rolaria a tela de volta
  // toda vez que o usuário marca um grupo muscular ou o esporádico
  setTimeout(()=>{if(!id&&!window.__adhoc){const el=$('wn');if(el)el.focus();}},250);
}
window.saveW=async id=>{
  const name=$('wn').value.trim();
  const exs=window.__exs
    .map(e=>({name:e.name.trim(),sets:e.sets,reps:e.reps,note:(e.note||'').trim(),link:!!e.link}))
    .filter(e=>e.name);
  if(exs.length)exs[0].link=false;
  const avulso=!id&&!!window.__avulso;
  const adhoc=!id&&(!!window.__adhoc||avulso);
  if(!name)return toast('Dê um nome ao treino');

  if(id){const w=S.workouts.find(x=>x.id===id);w.name=name;w.exercises=exs;w.muscles=window.__muscles.slice();}
  else{
    const nw={id:uid(),name,exercises:exs,muscles:window.__muscles.slice()};

    // avulso: já abre a sessão (se for abandonada sem nada preenchido, cleanupAdhoc remove;

    if(avulso){await save();closeM();openW(nw.id);return;}

};

async function cleanupAdhoc(){
