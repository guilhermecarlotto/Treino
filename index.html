<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treinos">
<meta name="theme-color" content="#0e0f13">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Treinos</title>
<style>
:root{
  --bg:#0e0f13; --surface:#171922; --surface2:#1f2230; --line:#2a2e3d;
  --txt:#eef0f6; --dim:#8b90a3; --accent:#ff6b35; --accent2:#3ddc97;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;overscroll-behavior-y:none}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 150px)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:rgba(14,15,19,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
header .hrow{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.3px;flex:1}
.sub{font-size:12px;color:var(--dim);font-weight:400}
button{font-family:inherit;font-size:15px;border:none;border-radius:10px;
  padding:11px 15px;cursor:pointer;background:var(--surface2);color:var(--txt);font-weight:600}
button:active{opacity:.7}
.btn-a{background:var(--accent);color:#fff}
.btn-g{background:var(--accent2);color:#08130d}
.btn-sm{padding:7px 11px;font-size:13px}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px}
.card-tap{cursor:pointer;display:flex;align-items:center;gap:12px}
.card-tap h3{margin:0 0 3px;font-size:16px}
.card-tap p{margin:0;font-size:12.5px;color:var(--dim)}
.chev{color:var(--dim);font-size:20px}
input,select,textarea{font-family:inherit;font-size:16px;background:var(--surface2);
  border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:11px;width:100%}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:12px;color:var(--dim);margin:0 0 5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:12px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.ex-block{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.ex-head{padding:12px 14px;background:var(--surface2);display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.ex-head strong{font-size:15px}
.ex-body{padding:10px 14px 14px}
.prev{font-size:12px;color:var(--dim);margin-bottom:10px;line-height:1.6}
.prev b{color:var(--accent2);font-weight:600}
.set{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:7px;
  align-items:center;margin-bottom:7px}
.set-n{font-size:12px;color:var(--dim);text-align:center;font-weight:700}
.set input{padding:10px 8px;text-align:center;font-size:16px}
.set .del{background:transparent;color:#ff5a5a;padding:6px;font-size:17px}
.set-hdr{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:7px;
  font-size:10.5px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:6px;text-align:center;font-weight:700}
.empty{text-align:center;padding:44px 18px;color:var(--dim);font-size:14px;line-height:1.7}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 78px);
  left:50%;transform:translateX(-50%);z-index:30;
  box-shadow:0 6px 20px rgba(0,0,0,.5);padding:12px 22px;font-size:14.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.modal-in{background:var(--surface);width:100%;max-width:640px;
  border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-in h2{margin:0 0 14px;font-size:17px}
.ex-item{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ex-item input{flex:1}
.ex-item button{padding:10px 12px}
.hist-row{display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.hist-row:last-child{border:none}
.hist-row span{color:var(--dim);font-size:12.5px}
.pill{display:inline-block;background:var(--surface2);border-radius:6px;
  padding:2px 7px;font-size:11px;color:var(--dim);margin-right:5px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 90px);left:50%;
  transform:translateX(-50%);background:var(--accent2);color:#08130d;
  padding:11px 20px;border-radius:10px;font-size:14px;font-weight:700;
  z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.ask-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:20px 18px 16px;width:100%;max-width:330px;margin:0 18px}
.ask-box h3{margin:0 0 8px;font-size:16.5px;font-weight:700;line-height:1.35}
.ask-box p{margin:0 0 16px;font-size:13px;color:var(--dim);line-height:1.5;
  white-space:pre-line}
.ask-row{display:flex;gap:8px}
.ask-row button{flex:1;padding:12px}
.btn-danger{background:#e0453f;color:#fff;font-weight:700}
.load{text-align:center;padding:50px;color:var(--dim)}
.ihint{max-width:640px;margin:10px auto 0;padding:0 14px}
.ihint-in{background:linear-gradient(135deg,rgba(255,107,53,.16),rgba(61,220,151,.08));
  border:1px solid rgba(255,107,53,.35);border-radius:13px;padding:12px 13px;
  display:flex;align-items:flex-start;gap:10px}
.ihint-in .ii{font-size:19px;line-height:1;flex:none;margin-top:1px}
.ihint-in .it{flex:1;font-size:12.5px;color:var(--txt);line-height:1.55}
.ihint-in .it b{color:var(--accent)}
.ihint-in .ix{background:transparent;color:var(--dim);padding:2px 6px;font-size:15px;flex:none;border-radius:6px}
.bkp-warn{background:rgba(224,151,63,.12);border:1px solid rgba(224,151,63,.35);
  border-radius:12px;padding:11px 12px;font-size:12px;color:#e0973f;line-height:1.55;margin-bottom:12px}
.notif-card{display:flex;align-items:flex-start;gap:10px;padding:13px 13px;margin-bottom:10px}
.notif-card .ii{font-size:19px;line-height:1;flex:none;margin-top:1px}
.notif-card .it{flex:1;font-size:12.5px;color:var(--txt);line-height:1.55}
.notif-card .it b{color:var(--accent)}
.notif-card .act{margin-top:10px;display:flex;justify-content:flex-end}
.tb-badge{position:absolute;top:-4px;right:-8px;background:#e0453f;color:#fff;
  font-size:10px;font-weight:700;line-height:1;border-radius:8px;padding:2.5px 5px;
  min-width:15px;text-align:center}
.tabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:11px;margin-bottom:12px}
.tabs button{flex:1;background:transparent;color:var(--dim);padding:9px;font-size:14px}
.tabs button.on{background:var(--accent);color:#fff}
.rep-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.rep-h strong{font-size:15.5px}
.delta{font-size:13px;font-weight:700;white-space:nowrap}
.up{color:var(--accent2)} .down{color:#ff5a5a} .flat{color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.stat{background:var(--surface2);border-radius:9px;padding:9px 7px;text-align:center}
.stat b{display:block;font-size:15px;margin-bottom:2px}
.stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.spark{width:100%;height:76px;display:block;margin:6px 0 4px}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:8px}
.mini{font-size:12px;color:var(--dim);line-height:1.8}
.mini b{color:var(--txt);font-weight:600}
.rec{font-size:11.5px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.bw-tog{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap}
.bw-tog input{width:19px;height:19px;flex:none;accent-color:var(--accent);margin:0;padding:0}
.bw-tog.on{color:var(--accent)}
.tag-pc{display:inline-block;background:rgba(255,107,53,.16);color:var(--accent);
  border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.3px;margin-left:6px}
.kebab{background:transparent;color:var(--dim);padding:8px 10px;font-size:17px;
  line-height:1;border-radius:8px;flex:none}
.kebab:active{background:var(--surface2)}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;padding:14px 12px;border-radius:10px;font-weight:500;font-size:15px}
.menu-item:active{background:var(--surface2)}
.menu-item .ic{font-size:17px;width:22px;text-align:center;flex:none}
.menu-item.danger{color:#ff5a5a}
.menu-sep{height:1px;background:var(--line);margin:6px 0}
.arc-item{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.arc-head{padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.arc-head strong{flex:1;font-size:15px}
.arc-head .cnt{font-size:11.5px;color:var(--dim)}
.arc-body{padding:0 14px 13px;border-top:1px solid var(--line)}
.arc-body ul{margin:10px 0 0;padding-left:19px}
.arc-body li{font-size:13.5px;color:var(--dim);margin-bottom:5px;line-height:1.5}
.ord-row{display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px}
.ord-row strong{flex:1;font-size:14.5px;font-weight:600}
.ord-btn{background:var(--surface2);padding:9px 12px;font-size:15px;line-height:1;border-radius:8px}
.ord-btn:disabled{opacity:.28}
.sec-lbl{margin:20px 0 9px;font-size:12px;color:var(--dim);font-weight:700;
  text-transform:uppercase;letter-spacing:.6px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
.act{display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:600;
  padding:9px 13px;border-radius:20px;white-space:nowrap}
.act span{font-size:13px;line-height:1}
.act-a{background:rgba(255,107,53,.13);border-color:rgba(255,107,53,.35);color:var(--accent)}
.act:active{opacity:.65}
.modal-in .row{gap:8px}
.modal-in .row button{flex:none;padding:11px 18px}
.modal-in .row button:last-child{flex:1}

/* --- TAB BAR --- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(23,25,34,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;
  padding:6px 0 calc(env(safe-area-inset-bottom) + 4px)}
.tb{flex:1;background:transparent;padding:6px 0;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--dim);font-size:8.5px;font-weight:600;border-radius:0;
  min-width:0;overflow:hidden;white-space:nowrap}
.tb .ti{font-size:17px;line-height:1}
.tb.on{color:var(--accent)}
.tb:active{opacity:.6}

/* --- ANÉIS --- */
.rings{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 10px 14px;margin-bottom:12px}
.rings-row{display:flex;justify-content:space-around;align-items:flex-start}
.ring{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;
  cursor:pointer;position:relative}
.ring svg{display:block}
.ring-lbl{font-size:11px;color:var(--dim);font-weight:700;
  text-transform:uppercase;letter-spacing:.5px}
.ring-ctr{font-size:17px;font-weight:800;fill:var(--txt)}
.ring-sub{font-size:9px;fill:var(--dim);font-weight:600}
.goal-note{text-align:center;font-size:11.5px;color:var(--dim);
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line);line-height:1.5}
.streak{display:inline-flex;align-items:center;gap:5px;background:rgba(255,107,53,.13);
  color:var(--accent);border-radius:14px;padding:4px 11px;font-size:11.5px;font-weight:700}

/* --- MENU CARDS (estilo lista do app) --- */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  margin-bottom:9px;display:flex;align-items:center;gap:13px;padding:15px 14px;
  cursor:pointer;width:100%;text-align:left;font-size:15.5px;font-weight:600;color:var(--txt)}
.mcard:active{background:var(--surface2)}
.mcard .mi{font-size:20px;width:26px;text-align:center;flex:none}
.mcard .mt{flex:1}
.mcard .mv{font-size:13px;color:var(--dim);font-weight:600}
.mcard .mc{color:var(--dim);font-size:19px}

/* --- CONFIG --- */
.cfg-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:7px}
.cfg-row .ct{font-size:14px;font-weight:600;margin-bottom:1px;line-height:1.3}
.cfg-row .cd2{font-size:11px;color:var(--dim);line-height:1.35}
.goal-row{display:flex;align-items:center;gap:10px}
.goal-txt{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:5px;flex:none}
.stepper button{background:var(--surface2);width:32px;height:32px;flex:none;
  font-size:17px;line-height:1;padding:0;border-radius:8px;
  display:flex;align-items:center;justify-content:center}
.stepper button:disabled{opacity:.3}
.stepper .val{text-align:center;font-size:17px;font-weight:800;
  font-variant-numeric:tabular-nums;min-width:28px}

/* --- COR DO TREINO --- */
.w-card{position:relative;overflow:hidden}
.w-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--wc,transparent);pointer-events:none;z-index:0}
.w-card>*{position:relative;z-index:1}
.card.w-card[data-c]{padding-left:17px}
.ord-row.w-card[data-c]{padding-left:15px}
.arc-item.w-card[data-c] .arc-head,
.arc-item.w-card[data-c] .arc-body{padding-left:17px}
.sw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:4px}
.sw{position:relative;aspect-ratio:1;border-radius:12px;background:var(--surface2);
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  padding:0;cursor:pointer}
.sw i{width:20px;height:20px;border-radius:50%;display:block;background:var(--sc)}
.sw.none i{background:transparent;border:1.5px dashed var(--dim)}
.sw.on{border-color:var(--txt)}
.sw.on::after{content:'✓';position:absolute;font-size:12px;font-weight:800;
  color:var(--txt);bottom:2px;right:5px}
.sw-name{font-size:9.5px;color:var(--dim);text-align:center;margin-top:4px;
  font-weight:600;line-height:1.2}
.sw-wrap{display:flex;flex-direction:column}

/* --- SELETOR DE MÓDULO --- */
.mods{display:flex;gap:9px;margin-bottom:14px}
.mod{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 10px;display:flex;flex-direction:row;align-items:center;
  justify-content:center;gap:8px;color:var(--dim);font-size:14px;font-weight:700}
.mod .mi2{font-size:19px;line-height:1}
.mod.on{background:rgba(255,107,53,.13);border-color:rgba(255,107,53,.4);color:var(--accent)}
.mod.on.run{background:rgba(91,141,239,.14);border-color:rgba(91,141,239,.45);color:#5b8def}
.mod.on.mob{background:rgba(95,158,143,.16);border-color:rgba(95,158,143,.5);color:#5f9e8f}
.mod:active{opacity:.7}

/* --- CORRIDA --- */
.run-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:9px;position:relative;overflow:hidden}
.run-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--rc,var(--dim));pointer-events:none;z-index:0}
.run-card>*{position:relative;z-index:1}
.run-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.run-top .rt{flex:1;font-size:15px;font-weight:700}
.run-top .rd{font-size:11.5px;color:var(--dim);font-weight:600}
.run-metrics{display:flex;gap:14px;flex-wrap:wrap}
.rm{display:flex;flex-direction:column}
.rm b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.rm span{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.type-b{background:var(--surface2);border:1.5px solid var(--line);border-radius:11px;
  padding:11px 3px;font-size:11px;font-weight:700;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2;
  word-break:break-word;text-align:center}
.type-b .te{font-size:17px;line-height:1}
.type-b.on{border-color:var(--rc2);color:var(--rc2);background:rgba(91,141,239,.1)}
.rpe-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe-b{background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;
  padding:11px 0;font-size:15px;font-weight:800;color:var(--dim)}
.rpe-b.on{border-color:var(--rpc);color:var(--rpc);background:var(--rpbg)}
.rpe-lbl{text-align:center;font-size:12px;color:var(--dim);margin-top:9px;font-weight:600;min-height:16px}
.lvl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.lvl-b{background:var(--surface2);border:1.5px solid var(--line);border-radius:11px;
  padding:11px 4px;font-size:11px;font-weight:700;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2;text-align:center}
.lvl-b .le{font-size:18px;line-height:1}
.lvl-b.on{border-color:var(--lc);color:var(--lc);background:var(--lbg)}
.lbl-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.lbl-row label{margin:0;flex:1}
.qbtn{background:var(--surface2);color:var(--dim);width:20px;height:20px;padding:0;
  border-radius:50%;font-size:12px;font-weight:800;line-height:1;flex:none;
  display:flex;align-items:center;justify-content:center}
.qbtn:active{background:var(--accent);color:#fff}
.dur-row{display:grid;grid-template-columns:1fr 12px 1fr 12px 1fr;gap:4px;align-items:center}
.dur-row .sep{text-align:center;color:var(--dim);font-weight:800;font-size:17px}
.dur-row input{text-align:center}
.pace-box{background:var(--surface2);border-radius:11px;padding:12px;text-align:center;
  margin-top:10px;border:1px solid var(--line)}
.pace-box b{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;display:block}
.pace-box span{font-size:10.5px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.5px;font-weight:700}
.pace-box .alt{font-size:11.5px;color:var(--dim);margin-top:6px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin:10px 0 4px}
.bar-w{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:4px;height:100%;min-width:0}
.bar{width:100%;background:#5b8def;border-radius:4px 4px 0 0;min-height:2px;
  transition:height .5s cubic-bezier(.4,0,.2,1)}
.bar.z{background:var(--surface2)}
.bar-l{font-size:8.5px;color:var(--dim);font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar-v{font-size:8.5px;color:var(--txt);font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}

<body>
<header><div class="hrow">
  <button id="back" class="btn-sm btn-ghost" style="display:none">‹</button>
  <div style="flex:1"><h1 id="title">Treinos</h1><div class="sub" id="sub"></div></div>
  <div class="timer" id="timer"></div>
</div></header>

<div class="wrap" id="app"><div class="load">Carregando…</div></div>
<div id="fab"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="modal"></div>
<div id="confirm"></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let S={workouts:[],history:[],runs:[],plans:[]}, view='home', cur=null, live=null, t0=null, tick=null;
// substitui o conteúdo do modal preservando a posição de rolagem do formulário —
// sem isso, cada botão (tipo, RPE, superfície, grupo muscular...) que força um
// redesenho do modal jogava a rolagem de volta pro topo
function setModalHTML(html){
  const el=$('modal');
  const prevBox=el.querySelector('.modal-in');
  const prevScroll=prevBox?prevBox.scrollTop:0;
  el.innerHTML=html;
  const newBox=el.querySelector('.modal-in');
  if(newBox)newBox.scrollTop=prevScroll;
}

const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),1600)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate=d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const fdateW=d=>fdate(d)+' · '+DOW[new Date(d).getDay()];

/* ---------- ARMAZENAMENTO (localStorage + IndexedDB como reforço) ---------- */
const LS_KEY='gym-data';
let idbDB=null;
function idbOpen(){
  return new Promise((res)=>{
    if(!('indexedDB' in window)){res(null);return;}
    try{
      const rq=indexedDB.open('treinos-db',1);
      rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('kv');}catch(e){}};
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}
function idbGet(key){
  return new Promise(async(res)=>{
    if(!idbDB)idbDB=await idbOpen();
    if(!idbDB){res(null);return;}
    try{
      const tx=idbDB.transaction('kv','readonly'), rq=tx.objectStore('kv').get(key);
      rq.onsuccess=()=>res(rq.result||null);
      rq.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}
function idbSet(key,val){
  return new Promise(async(res)=>{
    if(!idbDB)idbDB=await idbOpen();
    if(!idbDB){res(false);return;}
    try{
      const tx=idbDB.transaction('kv','readwrite'); tx.objectStore('kv').put(val,key);
      tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
    }catch(e){res(false);}
  });
}
async function load(){
  let raw=null;
  try{raw=localStorage.getItem(LS_KEY);}catch(e){}
  if(!raw){ // localStorage vazio/indisponível: tenta recuperar do IndexedDB (reforço)
    try{raw=await idbGet(LS_KEY);}catch(e){}
  }
  if(raw){
    try{S=JSON.parse(raw);}catch(e){}
  }
  if(!Array.isArray(S.runs))S.runs=[];
  if(!Array.isArray(S.plans))S.plans=[];
  if(!Array.isArray(S.mobility))S.mobility=[];
  // migra tipos removidos: easy -> regen, tempo -> limiar, race -> longao
  const MIG={easy:'regen',tempo:'limiar',race:'long'};
  S.runs.forEach(r=>{
    if(MIG[r.type])r.type=MIG[r.type];
    if(!r.surf)r.surf='rua';
    if('elev' in r)delete r.elev;
  });
  render();
}
async function save(){
  const raw=JSON.stringify(S);
  let ok=false;
  try{localStorage.setItem(LS_KEY,raw);ok=true;}
  catch(e){toast('Erro ao salvar (armazenamento cheio?)');}
  idbSet(LS_KEY,raw).catch(()=>{}); // reforço silencioso, não bloqueia a UI
  return ok;
}

/* ---------- NOTIFICAÇÕES ---------- */
function notifications(){
  const list=[];
  const standalone=window.navigator.standalone===true ||
    window.matchMedia('(display-mode: standalone)').matches;
  let hideInstall=false;
  try{hideInstall=localStorage.getItem('hideInstallHint')==='1';}catch(e){}
  if(!standalone&&!hideInstall){
    list.push({key:'install',icon:'📲',
      html:`<b>Instale como app:</b> toque em Compartilhar (o quadrado com a seta ↑)
        e depois em <b>Adicionar à Tela de Início</b>. Assim ele abre em tela cheia
        e seus dados ficam salvos no aparelho.`,
      actionLabel:'Entendi',action:'dismissInstallHint()'});
  }
  const nReg=S.history.length+runs().length+S.mobility.length;
  const dsb=daysSinceBackup();
  if(nReg>0&&dsb>14){
    list.push({key:'backup',icon:'⚠️',
      html:`Já fazem <b>${dsb===Infinity?'muitos':dsb} dia(s)</b> sem backup.
        O app roda direto do arquivo local no seu iPhone, então vale a pena
        <b onclick="exportData()" style="text-decoration:underline;cursor:pointer">gerar um backup</b>
        de vez em quando para não correr risco de perder o histórico.`,
      actionLabel:'Concluído',action:'markBackupDone()'});
  }
  return list;
}
window.dismissInstallHint=async()=>{
  try{localStorage.setItem('hideInstallHint','1');}catch(e){}
  render();
};
window.markBackupDone=async()=>{
  try{localStorage.setItem('lastBackupAt',String(Date.now()));}catch(e){}
  toast('Backup marcado como concluído');
  render();
};
window.openNotif=()=>{view='notif';render()};
function notifScreen(){
  $('title').textContent='Notificações';
  $('sub').textContent='';
  $('back').style.display='block';$('timer').textContent='';
  const list=notifications();
  let h='';
  if(!list.length){
    h+=`<div class="empty">🔔<br>Nenhuma notificação no momento.</div>`;
  }else{
    list.forEach(n=>{
      h+=`<div class="card notif-card" style="flex-direction:column">
        <div style="display:flex;align-items:flex-start;gap:10px;width:100%">
          <span class="ii">${n.icon}</span><span class="it">${n.html}</span>
        </div>
        <div class="act" style="width:100%">
          <button class="btn-sm btn-a" onclick="${n.action}">${n.actionLabel}</button>
        </div>
      </div>`;
    });
  }
  $('app').innerHTML=h;$('fab').innerHTML='';
}

function lastSession(wid,kind){
  const arr=kind==='mobility'?S.mobility:S.history;
  return arr.filter(h=>h.wid===wid).sort((a,b)=>b.date-a.date)[0]||null;
}
function prevSets(wid,exName){
  // busca o registro mais recente deste exercício em QUALQUER treino
  let best=null;
  S.history.forEach(s=>{
    const e=s.exercises.find(x=>x.name===exName);
    if(e&&e.sets.length&&(!best||s.date>best.date))
      best={date:s.date,wid:s.wid,wname:s.name,sets:e.sets,bw:!!e.bw};
  });
  return best;
}

/* ---------- HOME ---------- */
/* ---------- METAS E PROGRESSO ---------- */
function goals(){
  return Object.assign({week:3,month:12,year:150},S.goals||{});
}
function periodCount(kind){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  let from;
  if(kind==='week'){
    const d=new Date(n); const dow=(d.getDay()+6)%7; // segunda = 0
    d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); from=d.getTime();
  }else if(kind==='month'){
    from=new Date(y,m,1).getTime();
  }else{
    from=new Date(y,0,1).getTime();
  }
  return S.history.filter(h=>h.date>=from).length
    + runs().filter(r=>r.date>=from).length
    + S.mobility.filter(m=>m.date>=from).length;
}
function streak(){
  // semanas consecutivas (contando de trás) em que a meta semanal foi batida
  const g=goals().week; if(!g)return 0;
  const n=new Date(); const dow=(n.getDay()+6)%7;
  let ref=new Date(n); ref.setDate(ref.getDate()-dow); ref.setHours(0,0,0,0);
  let s=0;
  for(let i=0;i<104;i++){
    const a=ref.getTime(), b=a+7*86400000;
    const c=S.history.filter(h=>h.date>=a&&h.date<b).length
      + runs().filter(r=>r.date>=a&&r.date<b).length
      + S.mobility.filter(m=>m.date>=a&&m.date<b).length;
    if(i===0){ if(c>=g)s++; }        // semana atual só conta se já bateu
    else{ if(c>=g)s++; else break; }
    ref.setDate(ref.getDate()-7);
  }
  return s;
}
function ringSVG(done,goal,color){
  const R=30, C=2*Math.PI*R, size=76;
  const p=goal>0?Math.min(done/goal,1):0;
  const off=C*(1-p);
  const over=goal>0&&done>goal;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">

function paceOf(km,sec){ // segundos por km
  return km>0&&sec>0?sec/km:0;
}
// converte tempo total (km,sec) em pace (min,seg por km) para exibição no modo "Pace"
function paceMS(km,sec){
  if(!km||!sec)return{m:'',s:''};
  const sp=Math.round(sec/km);
  return{m:Math.floor(sp/60),s:sp%60};
}
// converte pace (min,seg por km) + distância em segundos totais — inverso de paceMS
function timeFromPaceKm(pm,ps,km){
  const spk=(parseInt(pm)||0)*60+(parseInt(ps)||0);
  return Math.round(spk*(parseFloat(String(km).replace(',','.'))||0));
}
function fmtPace(sp){
  if(!sp||!isFinite(sp))return '—';
  const m=Math.floor(sp/60), s=Math.round(sp%60);
  return s===60?`${m+1}'00"`:`${m}'${String(s).padStart(2,'0')}"`;
}
function fmtDur(sec){
  if(!sec)return '—';
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.round(sec%60);
  return h?`${h}h${String(m).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}
const kmhOf=sp=>sp>0?3600/sp:0;
const runs=()=>S.runs||[];

const surfOf=r=>SURF.find(s=>s[0]===(r&&r.surf))||SURF[0];
const surfTag=r=>{const s=surfOf(r);
  return `<span class="tag-sf">${s[2]} ${s[1]}</span>`};

function structSummary(r){
  if(!r||!HAS_WU[r.type])return '';
  const p=[];
  const pc=(km,sec)=>km>0&&sec>0?` (${fmtPace(paceOf(km,sec))}/km)`:'';
  const wk=r.wu?blkKm(r.wu):0, ws=r.wu?blkSec(r.wu):0;
  const ck=r.cd?blkKm(r.cd):0, cs=r.cd?blkSec(r.cd):0;
  if(wk||ws)p.push(`<b>Aq.</b> ${wk?wk.toFixed(2)+' km':''}${wk&&ws?' · ':''}${ws?fmtDur(ws):''}${pc(wk,ws)}`);
  if(r.type==='inter'&&r.shots&&r.shots.length){
    const ss=r.shots.filter(s=>blkKm(s)||blkSec(s));
    if(ss.length){
      const same=ss.every(s=>s.km===ss[0].km&&s.m===ss[0].m&&s.s===ss[0].s);
      if(same)p.push(`<b>${ss.length}×</b> ${blkKm(ss[0]).toFixed(2)} km em ${fmtDur(blkSec(ss[0]))}${pc(blkKm(ss[0]),blkSec(ss[0]))}`);
      else p.push(`<b>${ss.length} tiros</b> ${ss.map(s=>fmtDur(blkSec(s))).join(' · ')}`);
      const rs=ss.reduce((a,s)=>a+(parseInt(s.rm)||0)*60+(parseInt(s.rs)||0),0);
      if(rs)p.push(`<b>Descanso</b> ${fmtDur(Math.round(rs/ss.length))} entre tiros`);
    }
  }else if(r.type==='fartlek'&&r.fk){
    const on=r.fk.on, off=r.fk.off, n=r.reps||1;
    p.push(`<b>${n}×</b> forte ${blkKm(on).toFixed(2)} km/${fmtDur(blkSec(on))}${pc(blkKm(on),blkSec(on))}`);
    p.push(`<b>&nbsp;&nbsp;&nbsp;</b> leve ${blkKm(off).toFixed(2)} km/${fmtDur(blkSec(off))}${pc(blkKm(off),blkSec(off))}`);
  }else if(r.type==='limiar'&&r.fk&&r.fk.on){
    const on=r.fk.on;
    if(blkKm(on)||blkSec(on))
      p.push(`<b>Limiar</b> ${blkKm(on).toFixed(2)} km em ${fmtDur(blkSec(on))}${pc(blkKm(on),blkSec(on))}`);
  }
  if(ck||cs)p.push(`<b>Desaq.</b> ${ck?ck.toFixed(2)+' km':''}${ck&&cs?' · ':''}${cs?fmtDur(cs):''}${pc(ck,cs)}`);
  return p.length?`<div class="struct">${p.join('<br>')}</div>`:'';
}

/* --- formulário --- */
let RF=null;
const blank=()=>({km:'',m:'',s:''});
const blkSec=b=>(parseInt(b.m)||0)*60+(parseInt(b.s)||0);
const blkKm=b=>parseFloat(String(b.km).replace(',','.'))||0;

window.runForm=id=>{
  const r=id?runs().find(x=>x.id===id):null;
  RF=r?JSON.parse(JSON.stringify(r)):{
    id:null,date:Date.now(),type:'rodagem',km:'',h:'',m:'',s:'',level:'moderado',surf:'rua',note:'',
    wu:blank(),cd:blank(),reps:6,shots:[],fk:{on:blank(),off:blank()}};
  if(!RF.level)RF.level=runLevel(RF)||'moderado'; // compat com registros antigos em RPE numérico
  RF.paceMode=false;
  if(r){
    const t=r.sec||0;
    RF.h=Math.floor(t/3600)||'';RF.m=Math.floor((t%3600)/60);RF.s=t%60||'';
    RF.wu=r.wu||blank(); RF.cd=r.cd||blank();
    RF.reps=r.reps||6; RF.shots=r.shots||[];
    RF.fk=r.fk||{on:blank(),off:blank()};
    RF.surf=r.surf||'rua';
  }
  syncShots();
  drawRunForm();
};
function syncShots(){
  if(RF.type!=='inter')return;
  const n=RF.reps||1;
  while(RF.shots.length<n)RF.shots.push({km:'',m:'',s:'',rm:'',rs:''});
  RF.shots.length=n;
}
window.rfSet=(k,v)=>{RF[k]=v;if(k==='type')syncShots();drawRunForm()};
window.rfNum=(k,v)=>{RF[k]=v;updPace()};
window.rfBlk=(b,k,v)=>{RF[b][k]=v;updPace()};
window.rfFk=(w,k,v)=>{RF.fk[w][k]=v;updPace()};
window.rfShot=(i,k,v)=>{RF.shots[i][k]=v;updPace()};
window.rfReps=n=>{
  RF.reps=Math.max(1,Math.min(40,n));
  syncShots();drawRunForm();
};
window.rfCopy=i=>{ // copia o tiro anterior para os seguintes
  const src=RF.shots[i];
  for(let j=i+1;j<RF.shots.length;j++)RF.shots[j]=Object.assign({},src);
  drawRunForm();
};
// --- modo "Pace": converte pace informado (min:s /km) em tempo (m,s), sem alterar o dado armazenado ---
window.rfBlkPace=(key,field,val)=>{
  const b=RF[key];
  const cur=paceMS(blkKm(b),blkSec(b));
  const pm=field==='m'?val:cur.m, ps=field==='s'?val:cur.s;
  const sec=timeFromPaceKm(pm,ps,blkKm(b));
  b.m=Math.floor(sec/60); b.s=sec%60;
  updPace();
};
window.rfFkPace=(w,field,val)=>{
  const b=RF.fk[w];
  const cur=paceMS(blkKm(b),blkSec(b));
  const pm=field==='m'?val:cur.m, ps=field==='s'?val:cur.s;
  const sec=timeFromPaceKm(pm,ps,blkKm(b));
  b.m=Math.floor(sec/60); b.s=sec%60;
  updPace();
};
window.rfShotPace=(i,field,val)=>{
  const b=RF.shots[i];
  const cur=paceMS(blkKm(b),blkSec(b));
  const pm=field==='m'?val:cur.m, ps=field==='s'?val:cur.s;
  const sec=timeFromPaceKm(pm,ps,blkKm(b));
  b.m=Math.floor(sec/60); b.s=sec%60;
  updPace();
};
window.rfNumPace=(field,val)=>{
  const km=parseFloat(String(RF.km).replace(',','.'))||0;
  const cur=paceMS(km,rfSecs());
  const pm=field==='m'?val:cur.m, ps=field==='s'?val:cur.s;
  const sec=timeFromPaceKm(pm,ps,km);
  RF.h=Math.floor(sec/3600); RF.m=Math.floor((sec%3600)/60); RF.s=sec%60;
  updPace();
};
// --- modo "metros": distância dos tiros preenchida em metros, armazenada em km ---
window.rfShotM=(i,v)=>{
  RF.shots[i].km=v===''?'':String((parseFloat(v)||0)/1000);
  updPace();
};

function rfSecs(){
  return (parseInt(RF.h)||0)*3600+(parseInt(RF.m)||0)*60+(parseInt(RF.s)||0);
}
// calcula totais a partir da estrutura (quando houver) — usado tanto no registro (RF) quanto no planejamento (PF)
function structTotals(obj){
  const t=obj.type;
  if(!HAS_WU[t])return null;
  let km=blkKm(obj.wu)+blkKm(obj.cd), sec=blkSec(obj.wu)+blkSec(obj.cd);
  let mainKm=0, mainSec=0, restSec=0;
  if(t==='inter'){
    obj.shots.forEach(s=>{
      mainKm+=blkKm(s);
      mainSec+=blkSec(s);
      restSec+=(parseInt(s.rm)||0)*60+(parseInt(s.rs)||0);
    });
  }else if(t==='fartlek'){
    const n=obj.reps||1;
    mainKm=(blkKm(obj.fk.on)+blkKm(obj.fk.off))*n;
    mainSec=(blkSec(obj.fk.on)+blkSec(obj.fk.off))*n;
  }else if(t==='limiar'){
    mainKm=blkKm(obj.fk.on);
    mainSec=blkSec(obj.fk.on);
  }
  return {km:km+mainKm,sec:sec+mainSec+restSec,
    wuKm:blkKm(obj.wu),wuSec:blkSec(obj.wu),
    cdKm:blkKm(obj.cd),cdSec:blkSec(obj.cd),
    mainKm,mainSec,restSec};
}
function updPace(){
  const st=structTotals(RF);
  const box=$('pcbox');
  if(st){
    const el=$('calcbox');
    if(el){
      el.innerHTML=`
        ${st.wuKm||st.wuSec?`<div class="ct2"><span>Aquecimento</span><b>${st.wuKm.toFixed(2)} km · ${fmtDur(st.wuSec)}</b></div>`:''}
        <div class="ct2"><span>Parte principal</span><b>${st.mainKm.toFixed(2)} km · ${fmtDur(st.mainSec)}</b></div>
        ${st.restSec?`<div class="ct2"><span>Descanso total</span><b>${fmtDur(st.restSec)}</b></div>`:''}
        ${st.cdKm||st.cdSec?`<div class="ct2"><span>Desaquecimento</span><b>${st.cdKm.toFixed(2)} km · ${fmtDur(st.cdSec)}</b></div>`:''}
        <div class="ct2 tt"><span>Total do treino</span><b>${st.km.toFixed(2)} km · ${fmtDur(st.sec)}</b></div>
        <div class="ct2"><span>Pace médio geral</span><b>${fmtPace(paceOf(st.km,st.sec))}/km</b></div>`;
    }
    return;
  }
  if(!box)return;
  const km=parseFloat(String(RF.km).replace(',','.'))||0, sec=rfSecs();
  const sp=paceOf(km,sec);
  box.innerHTML=sp?`<b>${fmtPace(sp)}</b><span>pace médio / km</span>
    <div class="alt">${kmhOf(sp).toFixed(1)} km/h · ${fmtDur(sec)} para ${km.toFixed(2)} km</div>`
    :`<b style="color:var(--dim)">—</b><span>preencha distância e tempo</span>`;
}

function bucket(per){
  // retorna [{lbl, km, n, sec}] mais antigo -> mais recente
  const out=[], now=new Date();
  const N=per==='day'?14:per==='week'?12:per==='month'?12:5;
  for(let i=N-1;i>=0;i--){
    let a,b,lbl;
    if(per==='day'){
      const d=new Date(now); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
      a=d.getTime(); b=a+86400000;
      lbl=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    }else if(per==='week'){
      const d=new Date(now); const dow=(d.getDay()+6)%7;
      d.setDate(d.getDate()-dow-i*7); d.setHours(0,0,0,0);
      a=d.getTime(); b=a+7*86400000;
      lbl=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    }else if(per==='month'){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      a=d.getTime(); b=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();
      lbl=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][d.getMonth()];
    }else{
      const y=now.getFullYear()-i;
      a=new Date(y,0,1).getTime(); b=new Date(y+1,0,1).getTime();
      lbl=String(y).slice(2);
    }
    const rs=runs().filter(r=>r.date>=a&&r.date<b);
    out.push({lbl,km:rs.reduce((s,r)=>s+r.km,0),n:rs.length,
      sec:rs.reduce((s,r)=>s+r.sec,0)});
  }
  return out;
}
// início do intervalo coberto pelo período (mesma janela usada em bucket()) —
// usado para filtrar a distribuição por tipo e outros blocos que acompanham o seletor
function periodFrom(per){
  const now=new Date();
  const N=per==='day'?14:per==='week'?12:per==='month'?12:5;
  const i=N-1;
  if(per==='day'){
    const d=new Date(now); d.setDate(d.getDate()-i); d.setHours(0,0,0,0); return d.getTime();
  }else if(per==='week'){
    const d=new Date(now); const dow=(d.getDay()+6)%7;
    d.setDate(d.getDate()-dow-i*7); d.setHours(0,0,0,0); return d.getTime();
  }else if(per==='month'){
    return new Date(now.getFullYear(),now.getMonth()-i,1).getTime();
  }else{
    return new Date(now.getFullYear()-i,0,1).getTime();
  }
}
function runReport(){

  const totS=bs.reduce((a,b)=>a+b.sec,0);

      const pc=(b.km/mx)*100;
      return `<div class="bar-w">
        ${b.km?`<div class="bar-v">${b.km>=100?Math.round(b.km):b.km.toFixed(1)}</div>`:''}
        <div class="bar ${b.km?'':'z'}" style="height:${b.km?Math.max(pc,3):2}%"></div>
        <div class="bar-l">${b.lbl}</div></div>`}).join('')}</div>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><b>${tot.toFixed(1)}</b><span>km total</span></div>
      <div class="stat"><b>${totN}</b><span>treinos</span></div>

  // distribuição por tipo — acompanha o mesmo período selecionado acima (dia/semana/mês/ano)

  const byType=RUN_TYPES.map(t=>{
    const f=rsDist.filter(r=>r.type===t[0]);
    return{t,n:f.length,km:f.reduce((a,r)=>a+r.km,0)};
  }).filter(x=>x.n).sort((a,b)=>b.km-a.km);
  const tkm=byType.reduce((a,x)=>a+x.km,0)||1;
  h+=`<div class="card"><div class="rep-h"><strong>Distribuição por tipo</strong>
    <span class="delta flat">${perLbl}</span></div>`;
  if(!byType.length)h+=`<div class="empty" style="padding:20px 10px">Nenhuma corrida nesse período.</div>`;
  byType.forEach(x=>{
    const p=(x.km/tkm)*100;
    h+=`<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
        <span style="color:var(--txt);font-weight:600">${x.t[2]} ${x.t[1]}</span>
        <span style="color:var(--dim)">${x.km.toFixed(1)} km · ${x.n}× · ${p.toFixed(0)}%</span></div>
      <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${p}%;background:${x.t[3]};border-radius:4px"></div></div></div>`;
  });
  h+='</div>';

  // distribuição por nível de esforço — mesmo período, mesma janela de rsDist
  const byLevel=RUN_LEVELS.map(l=>{
    const f=rsDist.filter(r=>runLevel(r)===l[0]);
    return{l,n:f.length,km:f.reduce((a,r)=>a+r.km,0)};
  }).filter(x=>x.n);
  const lkm=byLevel.reduce((a,x)=>a+x.km,0)||1;
  h+=`<div class="card"><div class="rep-h">
      <div class="lbl-row" style="margin:0"><strong style="flex:none">Distribuição por nível de esforço</strong>
        <button type="button" class="qbtn" onclick="levelInfo()">?</button></div>
      <span class="delta flat">${perLbl}</span></div>`;
  if(!byLevel.length)h+=`<div class="empty" style="padding:20px 10px">Nenhuma corrida classificada nesse período.</div>`;
  byLevel.forEach(x=>{
    const p=(x.km/lkm)*100;
    h+=`<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
        <span style="color:var(--txt);font-weight:600">${x.l[2]} ${x.l[1]}</span>
        <span style="color:var(--dim)">${x.km.toFixed(1)} km · ${x.n}× · ${p.toFixed(0)}%</span></div>
      <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${p}%;background:${x.l[3]};border-radius:4px"></div></div></div>`;
  });
  h+='</div>';

  // evolução de pace
  const sorted=[...rs].sort((a,b)=>a.date-b.date);
  const paced=sorted.filter(r=>paceOf(r.km,r.sec)>0);
  if(paced.length>=2){
    const ps=paced.map(r=>paceOf(r.km,r.sec));
    const ls=paced.map(r=>fdate(r.date).slice(0,5));
    const f=ps[0], l=ps[ps.length-1], d=l-f;
    const best=Math.min(...ps);
    // pace menor = melhor, então invertemos o sinal visual
    const cls=d<0?'up':d>0?'down':'flat';
    const arw=d<0?'▲':d>0?'▼':'—';
    h+=`<div class="card">
      <div class="rep-h"><strong>Pace médio por treino</strong>

      ${sparkline(ps.map(p=>-p),ls)}
      <div class="mini">Do primeiro <b>${fmtPace(f)}</b> ao último <b>${fmtPace(l)}</b>
        · melhor <b>${fmtPace(best)}</b></div>
      <div class="rec">Linha subindo = pace melhorando (menos tempo por km). O pace varia
        muito conforme o tipo de treino — compare treinos parecidos entre si.</div></div>`;
  }

  // recordes
  const longest=rs.reduce((a,r)=>r.km>(a?a.km:0)?r:a,null);
  const fastest=paced.reduce((a,r)=>paceOf(r.km,r.sec)<(a?paceOf(a.km,a.sec):1e9)?r:a,null);
  const totalKm=rs.reduce((a,r)=>a+r.km,0);
  h+=`<div class="card"><div class="rep-h"><strong>Marcas</strong></div>
    <div class="hist-row"><span style="color:var(--txt)">Distância acumulada</span>
      <span><b style="color:var(--accent2)">${totalKm.toFixed(1)} km</b></span></div>

    ${fastest?`<div class="hist-row"><span style="color:var(--txt)">Melhor pace</span>
      <span>${fmtPace(paceOf(fastest.km,fastest.sec))}/km · ${fdate(fastest.date)}</span></div>`:''}
    <div class="hist-row"><span style="color:var(--txt)">Tempo total em movimento</span>
      <span>${fmtDur(rs.reduce((a,r)=>a+r.sec,0))}</span></div>
    </div>`;
  $('app').innerHTML=h;
  $('fab').innerHTML='<button class="fab" style="background:#5b8def;color:#fff" onclick="runForm()">+ Registrar corrida</button>';
}

let calRef=null, calSel=null;
const dayKey=ts=>{const d=new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho',
  'agosto','setembro','outubro','novembro','dezembro'];

function dayEvents(){
  // mapa: 'YYYY-MM-DD' -> [{k,date,color,label,d}]
  const m={};
  S.history.forEach(s=>{
    const w=S.workouts.find(x=>x.id===s.wid);
    const k=dayKey(s.date);
    (m[k]=m[k]||[]).push({k:'gym',date:s.date,color:wColor(w)||'var(--accent)',
      label:s.name,d:s});
  });
  runs().forEach(r=>{
    const t=rType(r.type), k=dayKey(r.date);
    (m[k]=m[k]||[]).push({k:'run',date:r.date,color:t[3],
      label:t[1],d:r,ic:t[2]});
  });
  S.mobility.forEach(ms=>{
    const w=S.workouts.find(x=>x.id===ms.wid);
    const k=dayKey(ms.date);
    (m[k]=m[k]||[]).push({k:'mobility',date:ms.date,color:wColor(w)||'#5f9e8f',
      label:ms.name,d:ms});
  });
  Object.values(m).forEach(a=>a.sort((x,y)=>x.date-y.date));
  return m;
}

function calendar(){
  const ref=calRef||new Date();
  const y=ref.getFullYear(), mo=ref.getMonth();

  $('sub').textContent='Treinos do mês';
  $('back').style.display='none';$('timer').textContent='';

    if(f.length)ev[k]=f;
  });
  const first=new Date(y,mo,1);
  const startDow=(first.getDay()+6)%7;
  const nDays=new Date(y,mo+1,0).getDate();
  const prevN=new Date(y,mo,0).getDate();
  const todayK=dayKey(Date.now());

    h+=`<div class="cday out">${prevN-i}</div>`;

  let mGym=0,mRun=0,mMob=0,mKm=0;

  for(let d=1;d<=nDays;d++){
    const k=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const es=ev[k]||[];
    es.forEach(e=>{
      if(e.k==='gym')mGym++;
      else if(e.k==='mobility')mMob++;
      else{mRun++;mKm+=e.d.km||0;wk.km+=e.d.km||0;wk.n++;}
    });
    const cls=['cday'];
    if(es.length)cls.push('has');
    if(k===todayK)cls.push('today');
    if(k===calSel)cls.push('sel');
    const shown=es.slice(0,3);
    h+=`<button class="${cls.join(' ')}" onclick="calPick('${k}')">

        es.length>3?`<span class="more">+${es.length-3}</span>`:''}</span>
    </button>`;
    col++;
    if(col===7){weeks.push(wk);wk={km:0,n:0};col=0;}
  }
  const total=startDow+nDays;
  const tail=(7-(total%7))%7;
  for(let i=1;i<=tail;i++)h+=`<div class="cday out">${i}</div>`;
  if(col!==0)weeks.push(wk);

        legs.push([wColor(w)||'#5f9e8f',nm]);
      });
    }else legs.push(['#5f9e8f','Mobilidade']);
  }
  if(calFlt==='all'||calFlt==='run'){
    RUN_TYPES.filter(t=>runs().some(r=>r.type===t[0]))
      .forEach(t=>legs.push([t[3],t[1]]));

      <div class="stat" style="background:transparent"><b>${mMob}</b><span>mobilidade</span></div>
      ${mKm?`<div class="stat" style="background:transparent"><b>${mKm.toFixed(1)}</b><span>km</span></div>`:''}`;
  }else if(calFlt==='gym'){

/* ---------- DELEGAÇÃO DE EVENTOS ---------- */
function handleAct(ev){
  let el=null;
  try{ el=ev.target&&ev.target.closest?ev.target.closest('[data-act]'):null; }
  catch(e){ dbg('closest falhou: '+e.message); }
  if(!el){
    // fallback: sobe a árvore manualmente
    let n=ev.target;
    while(n&&n!==document.body){
      if(n.getAttribute&&n.getAttribute('data-act')){el=n;break;}
      n=n.parentNode;
    }
  }
  if(!el)return;
  const act=el.getAttribute('data-act');
  const arg=el.getAttribute('data-arg');
  dbg('clique: '+act+' arg='+arg);
  ev.preventDefault();
  ev.stopPropagation();
  try{
    if(act==='delplan')delPlanNow(arg);
    else if(act==='editplan')planEdit(arg);
    else dbg('acao desconhecida: '+act);
  }catch(e){ dbg('EXCECAO em '+act+': '+e.message); }
}
document.addEventListener('click',handleAct,true);
document.addEventListener('touchend',function(ev){
  const t=ev.target;
  const el=t&&t.closest?t.closest('[data-act]'):null;
  if(el){ ev.preventDefault(); handleAct(ev); }
},{passive:false,capture:true});

// exclusão direta, sem depender de PF nem de modal aberto
async function delPlanNow(id){
  dbg('delPlanNow('+id+')');
  if(!S.plans){dbg('S.plans indefinido!');return;}
  const p=S.plans.find(x=>x.id===id);
  if(!p){dbg('plano NAO encontrado');toast('Plano não encontrado');return;}
  let nome;
  try{
    if(p.kind==='run'){const t=rType(p.type);
      nome=t[1]+(p.km?' de '+p.km+' km':'')+' em '+fdate(p.date);}
    else{const w=S.workouts.find(x=>x.id===p.wid);
      nome=(w?w.name:'treino')+' em '+fdate(p.date);}
  }catch(e){nome='treino';}
  const ok=await ask('Excluir do planejamento?',nome,'Excluir',true);
  dbg('confirmacao='+ok);
  if(!ok)return;
  S.plans=S.plans.filter(x=>x.id!==id);
  PF=null;
  // se era um esporádico nunca executado, remove o treino também
  if(p.kind==='gym'&&p.wid){
    const w=S.workouts.find(x=>x.id===p.wid);
    if(w&&w.adhoc&&!S.history.some(h=>h.wid===w.id)&&!S.plans.some(x=>x.wid===w.id))
      S.workouts=S.workouts.filter(x=>x.id!==w.id);
  }
  try{ await save(); }catch(e){ dbg('save falhou: '+e.message); }
  try{ closeM(); }catch(e){}
  try{ render(); }catch(e){ dbg('RENDER FALHOU: '+e.message); }
  toast('Excluído do plano');
}

const plans=()=>S.plans||[];
const planKey=ts=>dayKey(ts);

// plano de corrida: {id,kind:'run',date,type,km,sec?,note,doneId}
// plano de musculação: {id,kind:'gym',date,wid,targets:{exName:{reps,peso}},note,doneId}

function plansOn(k,kind){
  return plans().filter(p=>planKey(p.date)===k&&(!kind||p.kind===kind))
    .sort((a,b)=>a.date-b.date);
}
function weekStart(ts){
  const d=new Date(ts); const dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d.getTime();
}
function weekPlans(ws){
  return plans().filter(p=>p.date>=ws&&p.date<ws+7*86400000);
}
function weekDone(ws){
  const a=ws, b=ws+7*86400000;
  return{runs:runs().filter(r=>r.date>=a&&r.date<b),
         gym:S.history.filter(h=>h.date>=a&&h.date<b)};
}
// marca plano como cumprido ao salvar um registro
function matchPlan(kind,date,extra){
  const k=planKey(date);
  const cands=plansOn(k,kind).filter(p=>!p.doneId);
  if(!cands.length)return null;
  if(kind==='run'&&extra&&extra.type){
    const same=cands.find(p=>p.type===extra.type);
    if(same)return same;
  }
  if(kind==='gym'&&extra&&extra.wid){
    const same=cands.find(p=>p.wid===extra.wid);
    if(same)return same;
  }
  return cands[0];
}

/* --- PLANO DE CORRIDA (mês) --- */
function planRun(y,mo){
  const first=new Date(y,mo,1);
  const nDays=new Date(y,mo+1,0).getDate();
  const now=new Date(); const todayK=dayKey(Date.now());
  let h=`<div class="cal-nav">
    <button onclick="plMove(-1)">‹</button>
    <div class="cm">${MESES[mo]} ${y}</div>
    <button onclick="plMove(1)">›</button></div>`;

  // agrupa por semana
  const ws0=weekStart(first.getTime());
  const weeks=[];
  for(let t=ws0;t<new Date(y,mo+1,1).getTime();t+=7*86400000)weeks.push(t);

  // aviso de progressão de volume
  const vols=weeks.map(ws=>weekPlans(ws).filter(p=>p.kind==='run')
    .reduce((a,p)=>a+(p.km||0),0));
  let warn='';
  for(let i=1;i<weeks.length;i++){
    if(vols[i-1]>0&&vols[i]>vols[i-1]*1.15){
      const pc=Math.round((vols[i]/vols[i-1]-1)*100);
      warn=`⚠️ A semana de ${fdate(weeks[i]).slice(0,5)} tem ${pc}% mais volume que a anterior
        (${vols[i-1].toFixed(0)} → ${vols[i].toFixed(0)} km). Aumentos acima de ~10% por semana
        elevam o risco de lesão.`;
      break;
    }
  }
  if(warn)h+=`<div class="warn">${warn}</div>`;

  const mTot=vols.reduce((a,b)=>a+b,0);
  const mDone=runs().filter(r=>{const d=new Date(r.date);
    return d.getFullYear()===y&&d.getMonth()===mo}).reduce((a,r)=>a+r.km,0);
  h+=`<div class="rings" style="padding:13px">
    <div class="run-metrics" style="justify-content:space-around">
      <div class="rm" style="align-items:center"><b>${mTot.toFixed(0)}</b><span>km planejado</span></div>
      <div class="rm" style="align-items:center"><b>${mDone.toFixed(1)}</b><span>km realizado</span></div>
      <div class="rm" style="align-items:center"><b>${mTot?Math.round(mDone/mTot*100):0}%</b><span>aderência</span></div>
    </div></div>`;

  weeks.forEach((ws,wi)=>{
    const wp=weekPlans(ws).filter(p=>p.kind==='run');
    const wd=weekDone(ws).runs;
    const pk=wp.reduce((a,p)=>a+(p.km||0),0);
    const dk=wd.reduce((a,r)=>a+r.km,0);
    h+=`<div class="pl-week">
      <div class="pl-wh"><span class="pw">Semana ${wi+1}</span>
        <span class="pv">${dk.toFixed(1)} / ${pk.toFixed(0)} km</span>
        <button class="btn-ghost btn-sm" onclick="tplPick(${ws})">modelo</button></div>
      <div class="pl-body">`;
    for(let i=0;i<7;i++){
      const dt=new Date(ws+i*86400000);
      const k=dayKey(dt.getTime());
      const inMonth=dt.getMonth()===mo;
      const ps=plansOn(k,'run');
      h+=`<div class="pl-day ${k===todayK?'today':''}" style="${inMonth?'':'opacity:.35'}">
        <div class="pd">${DOW[dt.getDay()]}<i>${dt.getDate()}</i></div>
        <div class="pl-slot">`;
      ps.forEach(p=>{
        const t=rType(p.type);
        const act=plDel&&!p.doneId?`onclick="delPlanNow('${p.id}')"`:'';
        h+=`<div class="pl-item ${p.doneId?'done':''} ${plDel&&!p.doneId?'delmode':''}"
          style="--pc2:${t[3]}" ${act}>
          <div class="pi" ${plDel?'':`data-act="editplan" data-arg="${p.id}"`}><b>${t[2]} ${t[1]}</b>
            ${p.note?`<span>${esc(p.note)}</span>`:''}</div>
          <span class="pk">${p.km?p.km+' km':''}${p.targetSec?`<br>${fmtPace(paceOf(p.km,p.targetSec))}/km`:''}</span>
          ${p.doneId?'':`<button class="pl-x" data-act="delplan" data-arg="${p.id}"
            onclick="delPlanNow('${p.id}');return false;">✕</button>`}</div>`;
      });
      h+=`<button class="pl-add" onclick="planNew(${dt.getTime()},'run')">+ planejar</button>
        </div></div>`;
    }
    h+='</div></div>';
  });

  // distribuição por nível de esforço — planejado (topo) vs realizado (baixo), mesmo mês
  const monthPlans=plans().filter(p=>{const d=new Date(p.date);
    return p.kind==='run'&&d.getFullYear()===y&&d.getMonth()===mo;});
  const monthRuns=runs().filter(r=>{const d=new Date(r.date);
    return d.getFullYear()===y&&d.getMonth()===mo;});
  if(monthPlans.length||monthRuns.length){
    const totP=monthPlans.reduce((a,p)=>a+(p.km||0),0)||1;
    const totD=monthRuns.reduce((a,r)=>a+r.km,0)||1;
    let lh='';
    RUN_LEVELS.forEach(l=>{
      const pk=monthPlans.filter(p=>(p.level||'moderado')===l[0]).reduce((a,p)=>a+(p.km||0),0);
      const dk=monthRuns.filter(r=>runLevel(r)===l[0]).reduce((a,r)=>a+r.km,0);
      if(!pk&&!dk)return;
      const pp=(pk/totP)*100, dp=(dk/totD)*100;
      lh+=`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
          <span style="color:var(--txt);font-weight:600">${l[2]} ${l[1]}</span>
          <span style="color:var(--dim)">planejado ${pk.toFixed(1)}km (${pp.toFixed(0)}%) · real ${dk.toFixed(1)}km (${dp.toFixed(0)}%)</span></div>
        <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:3px">
          <div style="height:100%;width:${pp}%;background:${l[3]};border-radius:4px"></div></div>
        <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;opacity:.5">
          <div style="height:100%;width:${dp}%;background:${l[3]};border-radius:4px"></div></div>
      </div>`;
    });
    h+=`<div class="card"><div class="rep-h">
        <div class="lbl-row" style="margin:0"><strong style="flex:none">Distribuição por nível (mês)</strong>
          <button type="button" class="qbtn" onclick="levelInfo()">?</button></div></div>
      ${lh||'<div class="empty" style="padding:16px 10px">Sem corridas classificadas ainda.</div>'}
      <div class="legend" style="margin-top:2px">
        <span class="lg"><i style="background:var(--txt)"></i>barra de cima: planejado</span>
        <span class="lg" style="opacity:.65"><i style="background:var(--dim)"></i>barra de baixo: realizado</span>
      </div></div>`;
  }
  return h;
}

/* --- formulários de plano --- */
let PF=null;
function pfBlank(){
  return{wu:blank(),cd:blank(),reps:6,shots:[],fk:{on:blank(),off:blank()},paceMode:false,level:'moderado',
    h:'',m:'',s:''};
}
function pfSecs(){return (parseInt(PF.h)||0)*3600+(parseInt(PF.m)||0)*60+(parseInt(PF.s)||0);}
function pfSyncShots(){
  if(PF.type!=='inter')return;
  const n=PF.reps||1;
  while(PF.shots.length<n)PF.shots.push({km:'',m:'',s:'',rm:'',rs:''});
  PF.shots.length=n;
}
window.planNew=(ts,kind)=>{
  PF=Object.assign({id:null,kind,date:ts,type:'rodagem',km:'',note:''},pfBlank());
  drawPlanForm();
};
window.pfLevel=k=>{PF.level=k;drawPlanForm();};
window.planEdit=id=>{
  const p=plans().find(x=>x.id===id); if(!p)return;
  if(p.kind==='gym')return; // planejamento de musculação foi descontinuado
  if(p.doneId)return toast('Este treino já foi executado');
  PF=Object.assign(pfBlank(),JSON.parse(JSON.stringify(p)));
  if(p.targetSec){PF.h=Math.floor(p.targetSec/3600);PF.m=Math.floor((p.targetSec%3600)/60);PF.s=p.targetSec%60;}
  pfSyncShots();
  drawPlanForm();
};
window.pfSet=(k,v)=>{PF[k]=v;if(k==='type')pfSyncShots();drawPlanForm()};
window.pfBlk=(b,k,v)=>{PF[b][k]=v;updPlanCalc()};
// alvo de tempo/pace para rodagem, regenerativo e longão — mesma mecânica do registro (RF)
window.pfNum=(k,v)=>{PF[k]=v;updPlanPace();};
window.pfNumPace=(field,val)=>{
  const km=parseFloat(String(PF.km).replace(',','.'))||0;
  const cur=paceMS(km,pfSecs());
  const pm=field==='m'?val:cur.m, ps=field==='s'?val:cur.s;
  const sec=timeFromPaceKm(pm,ps,km);
  PF.h=Math.floor(sec/3600); PF.m=Math.floor((sec%3600)/60); PF.s=sec%60;
  updPlanPace();
};
function updPlanPace(){
  const box=$('pcboxP');
  if(!box)return;
  const km=parseFloat(String(PF.km).replace(',','.'))||0, sec=pfSecs();
  const sp=paceOf(km,sec);
  box.innerHTML=sp?`<b>${fmtPace(sp)}</b><span>pace médio / km</span>

window.pfBlkPace=(key,field,val)=>{
  const b=PF[key];
  const cur=paceMS(blkKm(b),blkSec(b));
  const pm=field==='m'?val:cur.m, ps=field==='s'?val:cur.s;
  const sec=timeFromPaceKm(pm,ps,blkKm(b));
  b.m=Math.floor(sec/60); b.s=sec%60;
  updPlanCalc();
};
window.pfFkPace=(w,field,val)=>{
  const b=PF.fk[w];
  const cur=paceMS(blkKm(b),blkSec(b));
  const pm=field==='m'?val:cur.m, ps=field==='s'?val:cur.s;
  const sec=timeFromPaceKm(pm,ps,blkKm(b));
  b.m=Math.floor(sec/60); b.s=sec%60;
  updPlanCalc();
};
window.pfShotPace=(i,field,val)=>{
  const b=PF.shots[i];
  const cur=paceMS(blkKm(b),blkSec(b));
  const pm=field==='m'?val:cur.m, ps=field==='s'?val:cur.s;
  const sec=timeFromPaceKm(pm,ps,blkKm(b));
  b.m=Math.floor(sec/60); b.s=sec%60;
  updPlanCalc();
};

function updPlanCalc(){
  const st=structTotals(PF);
  const el=$('calcboxP');
  if(!st||!el)return;
  el.innerHTML=`

    <div class="ct2"><span>Parte principal</span><b>${st.mainKm.toFixed(2)} km · ${fmtDur(st.mainSec)}</b></div>
    ${st.restSec?`<div class="ct2"><span>Descanso total</span><b>${fmtDur(st.restSec)}</b></div>`:''}
    ${st.cdKm||st.cdSec?`<div class="ct2"><span>Desaquecimento</span><b>${st.cdKm.toFixed(2)} km · ${fmtDur(st.cdSec)}</b></div>`:''}
    <div class="ct2 tt"><span>Total planejado</span><b>${st.km.toFixed(2)} km · ${fmtDur(st.sec)}</b></div>

window.savePlan=async()=>{
  if(PF.kind==='run'){
    const st=structTotals(PF);
    const km=st?st.km:(parseFloat(String(PF.km).replace(',','.'))||0);
    if(km<=0)return toast(st?'Preencha ao menos um trecho do treino':'Informe a distância planejada');
    const rec={id:PF.id||uid(),kind:'run',date:PF.date,type:PF.type,km,
      note:(PF.note||'').trim()};
    if(PF.level)rec.level=PF.level;
    if(HAS_WU[PF.type]){
      rec.wu=PF.wu; rec.cd=PF.cd;
      if(PF.type==='inter'){rec.reps=PF.reps;rec.shots=PF.shots;}
      else{rec.fk=PF.fk; if(PF.type==='fartlek')rec.reps=PF.reps;}
      rec.mainKm=st.mainKm; rec.mainSec=st.mainSec; rec.restSec=st.restSec;
    }else{
      const targetSec=pfSecs();
      if(targetSec>0)rec.targetSec=targetSec;
    }
    S.plans=plans().filter(x=>x.id!==rec.id);
    S.plans.push(rec);
  }
  await save();PF=null;closeM();render();toast('Planejado');
};

window.applyTpl=async(ws,key)=>{
  const t=WEEK_TPL.find(x=>x[0]===key); if(!t)return;
  // remove planos de corrida não executados desta semana
  S.plans=plans().filter(p=>
    !(p.kind==='run'&&p.date>=ws&&p.date<ws+7*86400000&&!p.doneId));
  t[3].forEach(item=>{
    const dt=new Date(ws+item.d*86400000); dt.setHours(7,0,0,0);
    S.plans.push({id:uid(),kind:'run',date:dt.getTime(),
      type:item.type,km:item.km,note:''});
  });
  await save();closeM();render();toast('Semana preenchida');
};

        planejamentos e metas (${totalReg} registro(s) no total). O app volta a ficar como se
        estivesse sendo usado pela primeira vez. Se ainda não fez backup, gere um antes em
        <b onclick="exportData()" style="text-decoration:underline;cursor:pointer;color:var(--txt)">Backup dos dados</b>.</div>
      <button class="btn-danger" style="width:100%" onclick="resetApp()">🗑 Resetar aplicativo</button>
    </div>`;
  $('app').innerHTML=h;$('fab').innerHTML='';
}
window.resetApp=async()=>{
  const nW=S.workouts.length, nS=S.history.length, nR=runs().length, nP=plans().length, nM=S.mobility.length;
  const total=nW+nS+nR+nP+nM;
  if(!await ask('Resetar o aplicativo?',
    `Isso apaga PERMANENTEMENTE ${nW} treino(s), ${nS} sessão(ões) de musculação, ${nR} corrida(s), `+
    `${nM} sessão(ões) de mobilidade `+
    `e ${nP} planejamento(s) salvos neste aparelho — ${total} registro(s) no total — além das metas `+
    `configuradas. O app volta a ficar como recém-instalado.\n\nSe ainda não fez backup, cancele agora `+
    `e gere um em "Backup dos dados" antes de continuar.`,
    'Resetar tudo',true))return;
  if(!await ask('Tem certeza mesmo?',
    'Não existe como recuperar os dados depois disso.','Sim, apagar tudo',true))return;
  S={workouts:[],history:[],runs:[],plans:[],mobility:[]};
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  try{localStorage.removeItem('lastBackupAt');}catch(e){}
  try{localStorage.removeItem('hideInstallHint');}catch(e){}
  await save();
  closeM();view='home';render();toast('Aplicativo resetado');
};

/* ---------- EDITOR DE TREINO ---------- */
function editW(id){
  const w=id?S.workouts.find(x=>x.id===id):{name:'',exercises:[]};
  let exs=w.exercises.map(e=>typeof e==='string'
    ?{name:e,sets:'',reps:'',note:''}
    :{name:e.name,sets:e.sets||'',reps:e.reps||'',note:e.note||''});
  if(!exs.length)exs=[{name:'',sets:'',reps:'',note:''}];
  window.__adhoc=false;
  window.__exs=exs;
  window.__muscles=(w.muscles||[]).slice();
  // acompanha se o nome atual ainda "pertence" à sugestão automática, pra saber
  // se pode continuar atualizando o campo conforme os grupos mudam ou se o
  // usuário já customizou o nome manualmente (nesse caso, para de mexer nele)
  window.__lastAuto=suggestWorkoutName(window.__muscles);
  if(w.name!==window.__lastAuto)window.__lastAuto=null;
  const draw=()=>{
    const ad=window.__adhoc;
    // aqui a rolagem só pode ser restaurada DEPOIS de drawEx() preencher os
    // exercícios — se restaurar logo após o innerHTML (como o setModalHTML faz),
    // a lista ainda está vazia, a altura rolável é menor e o valor fica truncado
    const modalEl=$('modal');
    const prevBox=modalEl.querySelector('.modal-in');
    const prevScroll=prevBox?prevBox.scrollTop:0;
    modalEl.innerHTML=`<div class="modal">
      <div class="modal-in">
        <h2>${id?'Editar treino':'Novo treino'}</h2>
        <div class="field"><label>Grupos musculares</label>
          <div class="type-grid" style="--rc2:var(--accent)">${MUSCLE_GROUPS.map(([k,l,ic])=>
            `<button class="type-b ${window.__muscles.includes(k)?'on':''}" onclick="tgMuscle('${k}')">
              <span class="te">${ic}</span>${l}</button>`).join('')}</div></div>
        <div class="field"><label>Nome do treino</label>
          <input id="wn" value="${esc(w.name)}" placeholder="${ad?'Ex: Academia do hotel':'Ex: Peito e Tríceps'}"></div>
        <label>Exercícios</label>
        <div id="exl"></div>
        <button class="btn-ghost btn-sm" style="margin:8px 0 16px" onclick="addEx()">+ Adicionar exercício</button>
        ${id?'':`<button class="adhoc-t ${ad?'on':''}" onclick="tgAdhoc()">
          <input type="checkbox" ${ad?'checked':''} onclick="event.stopPropagation();tgAdhoc()">
          ⚡ Treino esporádico</button>
        ${ad?`<div class="adhoc-hint">Treino avulso: aparece em Meus treinos normalmente,
          mas assim que você completar a sessão pela primeira vez ele é arquivado
          automaticamente. Histórico e evolução continuam registrados normalmente.</div>`:''}`}
        <div class="row">
          <button class="btn-ghost" onclick="closeM()">Cancelar</button>
          <button class="btn-a" onclick="saveW('${id||''}')">Salvar</button>
        </div>
      </div></div>`;
    drawEx();
    const newBox=modalEl.querySelector('.modal-in');
    if(newBox)newBox.scrollTop=prevScroll;
  };
  window.tgMuscle=k=>{
    const el=$('wn'); if(el)w.name=el.value;   // preserva o que foi digitado até agora
    const i=window.__muscles.indexOf(k);
    if(i>=0)window.__muscles.splice(i,1); else window.__muscles.push(k);
    if(window.__lastAuto!==null&&w.name===window.__lastAuto){
      w.name=suggestWorkoutName(window.__muscles);
      window.__lastAuto=w.name;
    }
    draw();
  };
  window.tgAdhoc=()=>{
    const el=$('wn'); if(el)w.name=el.value;   // preserva o que foi digitado
    window.__adhoc=!window.__adhoc;
    draw();
  };
  window.addEx=()=>{window.__exs.push({name:'',sets:'',reps:'',note:''});drawEx();
    setTimeout(()=>{const n=document.querySelectorAll('.ex-blk .exn');n[n.length-1].focus()},50)};
  window.rmEx=i=>{window.__exs.splice(i,1);
    if(!window.__exs.length)window.__exs.push({name:'',sets:'',reps:'',note:''});drawEx()};
  window.exSet=(i,k,v)=>{window.__exs[i][k]=v};
  function drawEx(){
    $('exl').innerHTML=window.__exs.map((e,i)=>`
      <div class="blk ex-blk">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
          <input class="exn" style="flex:1;font-weight:600" value="${esc(e.name)}"
            placeholder="Ex: Supino reto" oninput="exSet(${i},'name',this.value)">
          <button class="btn-ghost" style="padding:9px 11px;flex:none" onclick="rmEx(${i})">✕</button>
        </div>
        <div class="mini-row">
          <div class="mini-f"><label>Séries</label>
            <input type="number" inputmode="numeric" value="${esc(e.sets)}"
              placeholder="3" oninput="exSet(${i},'sets',this.value)"></div>
          <div class="mini-f"><label>Reps</label>
            <input type="number" inputmode="numeric" value="${esc(e.reps)}"
              placeholder="10" oninput="exSet(${i},'reps',this.value)"></div>
        </div>
        <div class="field" style="margin:9px 0 0"><label>Observação</label>
          <input value="${esc(e.note)}" placeholder="Ex: cadência lenta na descida"
            oninput="exSet(${i},'note',this.value)"></div>
      </div>`).join('');
  }
  draw();
  // foca o campo de nome só na abertura inicial do formulário (treino novo),
  // nunca nos redesenhos seguintes — senão o foco rolaria a tela de volta
  // toda vez que o usuário marca um grupo muscular ou o esporádico
  setTimeout(()=>{if(!id&&!window.__adhoc){const el=$('wn');if(el)el.focus();}},250);
}
window.saveW=async id=>{
  const name=$('wn').value.trim();
  const exs=window.__exs
    .map(e=>({name:e.name.trim(),sets:e.sets,reps:e.reps,note:(e.note||'').trim()}))
    .filter(e=>e.name);
  const adhoc=!id&&!!window.__adhoc;
  if(!name)return toast('Dê um nome ao treino');
  if(!exs.length)return toast('Adicione ao menos 1 exercício');
  if(id){const w=S.workouts.find(x=>x.id===id);w.name=name;w.exercises=exs;w.muscles=window.__muscles.slice();}
  else{
    const nw={id:uid(),name,exercises:exs,muscles:window.__muscles.slice()};
    if(adhoc)nw.adhoc=true;
    S.workouts.push(nw);
  }
  await save();closeM();render();toast('Treino salvo');
};

  draw();
  setTimeout(()=>{if(!id&&!window.__adhocM){const el=$('wnm');if(el)el.focus();}},250);
}
window.saveMobW=async id=>{
  const name=$('wnm').value.trim();
  const exs=window.__exsM
    .map(e=>({name:e.name.trim(),desc:(e.desc||'').trim()}))
    .filter(e=>e.name);
  const adhoc=!id&&!!window.__adhocM;
  if(!name)return toast('Dê um nome ao treino');
  if(!exs.length)return toast('Adicione ao menos 1 exercício');
  if(id){const w=S.workouts.find(x=>x.id===id);w.name=name;w.exercises=exs;
    w.regions=window.__regions.slice();w.tags=window.__tags.slice();}
  else{
    const nw={id:uid(),kind:'mobility',name,exercises:exs,
      regions:window.__regions.slice(),tags:window.__tags.slice()};
    if(adhoc)nw.adhoc=true;
    S.workouts.push(nw);
  }
  await save();closeM();render();toast('Treino salvo');
};

window.delW=async id=>{
  const w=S.workouts.find(x=>x.id===id); if(!w)return;
  const n=(w.kind==='mobility'?S.mobility:S.history).filter(h=>h.wid===id).length;
  const msg=n?`As ${n} sessão(ões) permanecem no histórico, mas o treino sai dos relatórios por treino.`
    :'Este treino será removido.';
  if(!await ask(`Excluir "${w.name}"?`,msg,'Excluir',true))return;
  S.workouts=S.workouts.filter(x=>x.id!==id);
  await save();closeM();
  if(view==='arc'&&!archivedW().length)view='cfg';
  render();toast('Treino excluído');
};
window.closeM=()=>{$('modal').innerHTML=''};

async function cleanupAdhoc(){
  // remove treinos esporádicos que nunca tiveram sessão E não têm plano pendente
  const before=S.workouts.length;
  S.workouts=S.workouts.filter(w=>
    !w.adhoc
    || S.history.some(h=>h.wid===w.id)
    || S.mobility.some(h=>h.wid===w.id)
    || plans().some(p=>p.wid===w.id));
  if(S.workouts.length!==before)await save();
}

/* ---------- SESSÃO ---------- */
window.openW=(id,plan)=>{
  cur=S.workouts.find(w=>w.id===id);
  // alvos-padrão definidos na criação do treino, usados quando não há um
  // plano específico preparado para hoje (que tem prioridade)
  const defTargets={};
  cur.exercises.forEach(e=>{
    if(e.sets||e.reps||e.note)defTargets[e.name]={sets:e.sets||'',reps:e.reps||'',note:e.note||''};
  });
  const liveTargets=(plan&&plan.targets)?plan.targets:defTargets;
  live={wid:id,name:cur.name,date:Date.now(),planId:plan?plan.id:null,
    targets:liveTargets,
    exercises:cur.exercises.map(e=>{
      const p=prevSets(id,e.name);
      const tg=liveTargets[e.name];
      const n=tg&&parseInt(tg.sets)?parseInt(tg.sets):(p?p.sets.length:3);
      return{name:e.name,bw:p?!!p.bw:false,
        sets:Array.from({length:n},()=>({reps:'',peso:''}))};
    })};
  t0=Date.now(); // usado só para calcular a duração da sessão ao finalizar (sem cronômetro visível)
  clearInterval(tick);
  view='session';render();
};
function session(){
  $('title').textContent=cur.name;
  const l=lastSession(cur.id);
  $('sub').textContent=l?'Anterior: '+fdate(l.date):'Primeira sessão';
  $('back').style.display='block';$('timer').textContent='';
  let h='';
  const wc=wColor(cur);
  if(wc)h+=`<div style="height:3px;background:${wc};border-radius:2px;margin:0 0 12px"></div>`;
  h+=musclesPillHTML(cur.muscles);
  const ld=new Date(live.date);
  const ldv=`${ld.getFullYear()}-${String(ld.getMonth()+1).padStart(2,'0')}-${String(ld.getDate()).padStart(2,'0')}`;
  const backfill=dayKey(live.date)!==dayKey(Date.now());
  h+=`<div class="card" style="display:flex;align-items:center;gap:12px${backfill?';box-shadow:inset 0 0 0 1.5px var(--accent)':''}">
    <div style="flex:1">
      <label style="margin:0 0 3px">Data do treino</label>
      <div style="font-size:11.5px;color:var(--dim)">${backfill?'⚠️ Lançando para outro dia, não hoje':'Esqueceu de registrar no dia? Toque para ajustar a data.'}</div>
    </div>
    <input type="date" style="width:auto;flex:none" value="${ldv}" onchange="setLiveDate(this.value)"></div>`;
  live.exercises.forEach((ex,i)=>{
    const p=prevSets(live.wid,ex.name);
    h+=`<div class="ex-block">
      <div class="ex-head"><strong>${esc(ex.name)}</strong>
        <div style="display:flex;align-items:center;gap:10px">
        <label class="bw-tog ${ex.bw?'on':''}">
          <input type="checkbox" ${ex.bw?'checked':''} onchange="setBW(${i},this.checked)">PC</label>
        <button class="btn-sm btn-ghost" onclick="addSet(${i})">+ série</button></div></div>
      <div class="ex-body">`;
    if(p){
      const sameW=p.wid===live.wid;
      const dias=Math.round((Date.now()-p.date)/86400000);
      const quando=dias===0?'hoje':dias===1?'ontem':`há ${dias} dias`;
      h+='<div class="prev">Última vez'+(p.bw?' <span class="tag-pc">PESO CORPORAL</span>':'')+': '+
        p.sets.map((s,n)=>`<span class="pill">${n+1}ª <b>${esc(s.reps)}×${esc(s.peso)}kg</b></span>`).join('')+
        `<div style="margin-top:5px;font-size:11px;opacity:.8">${quando}${sameW?'':' · em '+esc(p.wname)}</div></div>`;
    }else{
      h+='<div class="prev">Sem registro anterior deste exercício.</div>';
    }
    const tg=live.targets?live.targets[ex.name]:null;
    if(tg&&(tg.sets||tg.reps||tg.note)){
      h+=`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px">
        <div style="flex:1">
          ${(tg.sets||tg.reps)?`<div class="prev" style="color:var(--accent);margin:0">🎯 Alvo:
            <b>${tg.sets||''}× ${tg.reps||'—'} reps</b></div>`:''}
          ${tg.note?`<div class="prev" style="margin:${(tg.sets||tg.reps)?'4px':'0'} 0 0">📝 ${esc(tg.note)}</div>`:''}
        </div>
        <button style="flex:none;background:transparent;color:#ff5a5a;padding:4px 6px;font-size:17px;line-height:1"
          onclick="rmTarget(${i})" title="Remover alvo">✕</button>
      </div>`;
    }
    h+=`<div class="set-hdr"><div>#</div><div>Reps</div>
      <div>${ex.bw?'Peso corporal':'Carga (kg)'}</div><div></div></div>`;
    ex.sets.forEach((s,j)=>{
      const pr=p&&p.sets[j];
      h+=`<div class="set">
        <div class="set-n">${j+1}</div>
        <input type="number" inputmode="numeric" pattern="[0-9]*" value="${esc(s.reps)}"
          placeholder="${pr?esc(pr.reps):'–'}" onchange="setV(${i},${j},'reps',this.value)">
        <input type="number" inputmode="decimal" step="0.5" value="${esc(s.peso)}"
          placeholder="${pr?esc(pr.peso):'–'}" onchange="setV(${i},${j},'peso',this.value)">
        <button class="del" onclick="rmSet(${i},${j})">✕</button></div>`;
    });
    h+='</div></div>';
  });
  $('app').innerHTML=h;
  $('fab').innerHTML='<button class="fab btn-g" style="bottom:calc(env(safe-area-inset-bottom) + 18px)" onclick="finish()">✓ Finalizar treino</button>';
}
window.setLiveDate=v=>{
  const [y,m,d]=v.split('-').map(Number);
  const o=new Date(live.date); o.setFullYear(y,m-1,d); live.date=o.getTime();
  render();
};
window.rmTarget=i=>{
  const ex=live.exercises[i];
  if(live.targets)delete live.targets[ex.name];
  render();
};
window.setV=(i,j,k,v)=>{live.exercises[i].sets[j][k]=v};
window.setBW=(i,v)=>{live.exercises[i].bw=v;render()};
window.addSet=i=>{const st=live.exercises[i].sets;
  const last=st[st.length-1]||{reps:'',peso:''};
  st.push({reps:last.reps,peso:last.peso});render()};
window.rmSet=(i,j)=>{live.exercises[i].sets.splice(j,1);render()};
window.finish=async()=>{
  const ex=live.exercises.map(e=>({name:e.name,bw:!!e.bw,
    sets:e.sets.filter(s=>s.reps!==''||s.peso!=='')})).filter(e=>e.sets.length);
  if(!ex.length){if(!await ask('Sair sem salvar?','Nenhuma série foi preenchida neste treino.','Sair',true))return;
    clearInterval(tick);await cleanupAdhoc();view='home';render();return;}
  const dur=Math.floor((Date.now()-t0)/60000);
  const sid=uid();
  const wDone=S.workouts.find(x=>x.id===live.wid);
  S.history.push({id:sid,wid:live.wid,name:live.name,date:live.date,dur,exercises:ex,
    muscles:(wDone&&wDone.muscles)||[]});
  // treino esporádico: arquiva automaticamente após a primeira vez que é realizado
  if(wDone&&wDone.adhoc&&!wDone.archived)wDone.archived=true;
  // vincula ao plano
  const pl=live.planId?plans().find(p=>p.id===live.planId)
    :matchPlan('gym',live.date,{wid:live.wid});
  if(pl&&!pl.doneId)pl.doneId=sid;
  await save();clearInterval(tick);view='home';render();toast('Treino salvo ✓');
};
