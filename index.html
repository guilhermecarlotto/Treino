/* ---------- SÉRIES CONJUGADAS + REORDENAÇÃO ----------
   A conjugação é guardada como `link:true` no exercício, significando "sem descanso
   depois do exercício logo acima". Um grupo conjugado é, portanto, uma sequência de
   exercícios vizinhos. Cada exercício continua sendo registrado separadamente, então
   a evolução de carga por exercício não muda nada. */

function grpTag(g){
  return g?`<span class="ex-tag">${GRP_LETTER(g.gi)}${g.pos}</span>`:'';
}
// resumo textual dos conjugados de uma sessão (usado no relatório .md)

// lista compacta com setas de ordem (e, opcionalmente, botões de conjugar entre linhas)
let ordMode=false;
window.tgOrdMode=()=>{ordMode=!ordMode;render()};
function ordListHTML(list,moveFn,linkFn,allowLink){
  const gi=exGroups(list);
  let h=`<div style="font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:14px">
    Use <b style="color:var(--txt)">↑ ↓</b> para mudar a ordem de execução.${allowLink?`
    Toque em <b style="color:var(--txt)">conjugar</b> entre dois exercícios para fazer
    série conjugada (bi-set/tri-set: sem descanso entre eles). Cada exercício continua
    sendo registrado separadamente, então a evolução de carga de cada um não se perde.`:''}</div>`;
  list.forEach((ex,i)=>{
    if(allowLink&&i>0){
      const on=!!ex.link;
      h+=`<div class="lnk-row">
        <button class="lnk-btn ${on?'on':''}" onclick="${linkFn}(${i})">${on?'🔗 conjugado':'+ conjugar'}</button>
        <div class="lnk-line"></div></div>`;
    }
    const g=gi[i];
    h+=`<div class="ord-row2 ${g?'ing':''}">
      <span class="on2">${g?GRP_LETTER(g.gi)+g.pos:(i+1)}</span>
      <span class="onm">${esc(ex.name)}${ex.temp?' <span class="tag-pc" style="background:rgba(139,144,163,.18);color:var(--dim)">SÓ HOJE</span>':''}</span>
      <button class="ord-btn2" ${i===0?'disabled':''} onclick="${moveFn}(${i},-1)">↑</button>
      <button class="ord-btn2" ${i===list.length-1?'disabled':''} onclick="${moveFn}(${i},1)">↓</button>
    </div>`;
  });
  return h;
}
// troca dois exercícios de lugar mantendo a conjugação presa à POSIÇÃO, não ao
// exercício: assim, trocar a ordem dentro de um bi-set preserva o bi-set, que é o
// caso comum de "a máquina está ocupada, vou inverter".
function swapKeepingLinks(L,i,dir){
  const j=i+dir;
  if(j<0||j>=L.length)return false;
  const la=L[i].link, lb=L[j].link;
  const t=L[i]; L[i]=L[j]; L[j]=t;
  L[i].link=la; L[j].link=lb;
  if(L.length)L[0].link=false;
  return true;
}
window.moveLiveEx=(i,d)=>{if(swapKeepingLinks(live.exercises,i,d))render()};
window.tgLink=i=>{
  if(i<=0)return;
  live.exercises[i].link=!live.exercises[i].link;
  render();
};
window.moveLiveExM=(i,d)=>{if(swapKeepingLinks(liveM.exercises,i,d))render()};
// grava a ordem (e as conjugações) atuais como padrão do treino salvo
async function saveOrderInto(target,liveList){
  const byName={};
  target.exercises.forEach(e=>{byName[e.name]=e});
  const next=[];
  liveList.forEach(ex=>{
    if(ex.temp)return;                    // exercício avulso não entra no treino salvo
    const base=byName[ex.name]||{name:ex.name};
    delete byName[ex.name];
    next.push(Object.assign({},base,{name:ex.name,link:!!ex.link}));
  });
  // segurança: exercícios do treino que não estavam nesta sessão vão para o fim
  Object.keys(byName).forEach(k=>next.push(byName[k]));
  if(next.length)next[0].link=false;
  pushUndo('salvar nova ordem no treino');
  target.exercises=next;
  await save();
}

  toast('Ordem e conjugações salvas no treino');

window.openW=(id,plan)=>{

  });

  const ldv=`${ld.getFullYear()}-${String(ld.getMonth()+1).padStart(2,'0')}-${String(ld.getDate()).padStart(2,'0')}`;
  const backfill=dayKey(live.date)!==dayKey(Date.now());
  h+=`<div class="card" style="display:flex;align-items:center;gap:12px${backfill?';box-shadow:inset 0 0 0 1.5px var(--accent)':''}">
    <div style="flex:1">
      <label style="margin:0 0 3px">Data do treino</label>
      <div style="font-size:11.5px;color:var(--dim)">${backfill?'⚠️ Lançando para outro dia, não hoje':'Esqueceu de registrar no dia? Toque para ajustar a data.'}</div>
    </div>
    <input type="date" style="width:auto;flex:none" value="${ldv}" onchange="setLiveDate(this.value)"></div>`;
  h+=`<button class="btn-ghost btn-sm" style="width:100%;margin:0 0 14px" onclick="tgOrdMode()">
    🔀 Reordenar / conjugar exercícios</button>`;
  const gi=exGroups(live.exercises);
  live.exercises.forEach((ex,i)=>{
    const p=prevSets(live.wid,ex.name);
    const g=gi[i];
    if(g&&g.first){
      h+=`<div class="grp"><div class="grp-hd">🔗 Conjugado ${GRP_LETTER(g.gi)}

    h+=`<div class="ex-block">

        <div style="display:flex;align-items:center;gap:10px">
        <label class="bw-tog ${ex.bw?'on':''}">
          <input type="checkbox" ${ex.bw?'checked':''} onchange="setBW(${i},this.checked)">PC</label>

        <button class="btn-sm btn-ghost" onclick="addSet(${i})">+ série</button></div></div>
      <div class="ex-body">`;
    if(p){
      const sameW=p.wid===live.wid;
      const dias=Math.round((Date.now()-p.date)/86400000);
      const quando=dias===0?'hoje':dias===1?'ontem':`há ${dias} dias`;
      h+='<div class="prev">Última vez'+(p.bw?' <span class="tag-pc">PESO CORPORAL</span>':'')+': '+
        p.sets.map((s,n)=>`<span class="pill">${n+1}ª <b>${p.bw?esc(s.reps)+' reps':esc(s.reps)+'×'+esc(s.peso)+'kg'}</b></span>`).join('')+
        `<div style="margin-top:5px;font-size:11px;opacity:.8">${quando}${sameW?'':' · em '+esc(p.wname)}</div></div>`;
    }else{
      h+='<div class="prev">Sem registro anterior deste exercício.</div>';
    }
    const tg=live.targets?live.targets[ex.name]:null;
    if(tg&&(tg.sets||tg.reps||tg.note)){
      h+=`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px">
        <div style="flex:1">
          ${(tg.sets||tg.reps)?`<div class="prev" style="color:var(--accent);margin:0">🎯 Alvo:
            <b>${tg.sets||''}× ${tg.reps||'—'} reps</b></div>`:''}
          ${tg.note?`<div class="prev" style="margin:${(tg.sets||tg.reps)?'4px':'0'} 0 0">📝 ${esc(tg.note)}</div>`:''}
        </div>
        <button style="flex:none;background:transparent;color:#ff5a5a;padding:4px 6px;font-size:17px;line-height:1"
          onclick="rmTarget(${i})" title="Remover alvo">✕</button>
      </div>`;
    }
    h+=`<div class="set-hdr"><div>#</div><div>Reps</div>
      <div>${ex.bw?'Peso corporal':'Carga (kg)'}</div><div></div></div>`;
    ex.sets.forEach((s,j)=>{
      const pr=p&&p.sets[j];
      h+=`<div class="set">
        <div class="set-n">${j+1}</div>
        <input type="number" inputmode="numeric" pattern="[0-9]*" value="${esc(s.reps)}"
          placeholder="${pr?esc(pr.reps):'–'}" onchange="setV(${i},${j},'reps',this.value)">
        <input type="number" inputmode="decimal" step="0.5" value="${esc(s.peso)}"
          placeholder="${ex.bw?'—':(pr?esc(pr.peso):'–')}" ${ex.bw?'disabled':''}
          onchange="setV(${i},${j},'peso',this.value)">
        <button class="del" onclick="rmSet(${i},${j})">✕</button></div>`;
    });
    h+='</div></div>';
    if(g&&g.last)h+='</div>';
  });
  h+=`<button class="btn-ghost btn-sm" style="width:100%;margin:2px 0 16px" onclick="openAddEx()">+ Adicionar exercício</button>`;
  h+=`<div class="field"><label>Feedback do treino</label>
    <textarea rows="3" placeholder="Como foi o treino? Sensações, dificuldades, o que ajustar..."
      oninput="live.feedback=this.value">${esc(live.feedback||'')}</textarea>
    <div style="font-size:11px;color:var(--dim);line-height:1.5;margin-top:4px">
      Entra no Relatório para IA, pra ela considerar isso ao analisar seu histórico e planejar os próximos treinos.</div></div>`;
  $('app').innerHTML=h;
  $('fab').innerHTML='<button class="fab btn-g" style="bottom:calc(env(safe-area-inset-bottom) + 18px)" onclick="finish()">✓ Finalizar treino</button>';
}
/* ---------- ADICIONAR EXERCÍCIO DURANTE A SESSÃO (musculação) ---------- */
window.openAddEx=()=>{
  window.__newEx={name:'',sets:'',reps:'',note:''};
  window.__newExOnce=false;
  const draw=()=>{
    const once=window.__newExOnce;
    $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()">
      <div class="modal-in">
        <h2>Adicionar exercício</h2>
        <div class="field"><label>Nome do exercício</label>
          <div class="ex-name-wrap" style="position:relative">
            <input id="nex" value="${esc(window.__newEx.name)}" placeholder="Ex: Crucifixo"
              oninput="exNameInputNex(this.value)" onblur="exNameBlurNex()">
            <div class="ex-sug" id="exsug-nex"></div>
          </div>
        </div>
        <div class="mini-row">
          <div class="mini-f"><label>Séries</label>
            <input type="number" inputmode="numeric" value="${esc(window.__newEx.sets)}"
              placeholder="3" oninput="newExSet('sets',this.value)"></div>
          <div class="mini-f"><label>Reps</label>
            <input type="number" inputmode="numeric" value="${esc(window.__newEx.reps)}"
              placeholder="10" oninput="newExSet('reps',this.value)"></div>
        </div>
        <div class="field" style="margin:9px 0 0"><label>Observação (opcional)</label>
          <input value="${esc(window.__newEx.note)}" placeholder="Ex: cadência lenta na descida"
            oninput="newExSet('note',this.value)"></div>
        <button class="adhoc-t ${once?'on':''}" style="margin-top:14px" onclick="tgNewExOnce()">
          <input type="checkbox" ${once?'checked':''} onclick="event.stopPropagation();tgNewExOnce()">
          ⚡ Só nesta sessão</button>
        <div class="adhoc-hint">${once
          ?'Este exercício entra só no treino de hoje — o treino salvo não muda.'
          :'Este exercício passa a fazer parte do treino a partir de agora, entrando nas próximas execuções também.'}</div>
        <div class="row" style="margin-top:16px">
          <button class="btn-ghost" onclick="closeM()">Cancelar</button>
          <button class="btn-a" onclick="confirmAddEx()">Adicionar</button>
        </div>
      </div></div>`;
    setTimeout(()=>{const el=$('nex');if(el)el.focus()},150);
  };
  window.newExSet=(k,v)=>{window.__newEx[k]=v};
  window.exNameInputNex=v=>{
    window.__newEx.name=v;
    renderExSuggestions('exsug-nex',v,name=>{
      window.__newEx.name=name;
      const el=$('nex');
      if(el)el.value=name;
    });
  };
  window.exNameBlurNex=()=>{hideExSuggestions('exsug-nex');};
  window.tgNewExOnce=()=>{
    const el=$('nex'); if(el)window.__newEx.name=el.value;
    window.__newExOnce=!window.__newExOnce;
    draw();
  };
  draw();
};
window.confirmAddEx=async()=>{
  let name=($('nex').value||'').trim();
  if(!name)return toast('Dê um nome ao exercício');
  const nm=matchExerciseName(name);
  if(nm.status==='suggest'||nm.status==='new'){
    const result=await askExerciseNameCheck(name,nm.status==='suggest'?nm.suggestion:null);
    if(result==null)return; // "Corrigir": deixa o modal de adicionar aberto pro usuário ajustar
    name=result;
  }
  if(live.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase()))
    return toast('Já existe um exercício com esse nome nesta sessão');
  const sets=window.__newEx.sets, reps=window.__newEx.reps, note=(window.__newEx.note||'').trim();
  const once=window.__newExOnce;
  const n=parseInt(sets)||3;
  live.exercises.push({name,bw:false,sets:Array.from({length:n},()=>({reps:'',peso:''})),temp:once});
  if(live.targets&&(sets||reps||note))live.targets[name]={sets:sets||'',reps:reps||'',note};
  if(!once){
    cur.exercises.push({name,sets:sets||'',reps:reps||'',note});
    await save();
  }
  closeM();render();
  toast(once?'Exercício adicionado só nesta sessão':'Exercício adicionado ao treino');
};
window.setLiveDate=v=>{
  const [y,m,d]=v.split('-').map(Number);
  const o=new Date(live.date); o.setFullYear(y,m-1,d); live.date=o.getTime();
  render();
};
window.rmTarget=i=>{
  const ex=live.exercises[i];
  if(live.targets)delete live.targets[ex.name];
  render();
};
window.setV=(i,j,k,v)=>{live.exercises[i].sets[j][k]=v};
window.setBW=(i,v)=>{
  const ex=live.exercises[i];
  ex.bw=v;
  // peso corporal: a carga do dia não importa, só reps — limpa o que já tinha
  if(v)ex.sets.forEach(s=>{s.peso=''});
  render();
};
window.addSet=i=>{const st=live.exercises[i].sets;
  const bw=live.exercises[i].bw;
  const last=st[st.length-1]||{reps:'',peso:''};
  st.push({reps:last.reps,peso:bw?'':last.peso});render()};
window.rmSet=(i,j)=>{live.exercises[i].sets.splice(j,1);render()};

/* ---------- TROCAR EXERCÍCIO (só nesta sessão) ---------- */
window.openSwapEx=i=>{
  window.__swapIdx=i;
  window.__swapQ='';
  const used=new Set(live.exercises.map(e=>e.name.toLowerCase()));
  const pool=new Set();
  S.workouts.forEach(w=>{ if(w.kind!=='mobility')(w.exercises||[]).forEach(e=>pool.add(e.name)); });
  S.history.forEach(h=>{ (h.exercises||[]).forEach(e=>pool.add(e.name)); });
  // além dos exercícios já usados em treinos/histórico, também oferece a lista de nomes
  // conhecidos do app (embutidos + aprendidos) — assim a busca de troca sugere exercícios
  // "clássicos" mesmo que você nunca os tenha registrado antes
  allKnownExerciseNames().forEach(n=>pool.add(n));
  window.__swapPool=[...pool].filter(n=>!used.has(n.toLowerCase())).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  drawSwapEx();
};
function drawSwapEx(){
  // desenha o modal uma única vez (com um container vazio pros resultados);
  // a busca (swapExQ) só atualiza esse container depois, sem recriar o <input>
  // — recriar o campo a cada tecla jogava o cursor pro início e invertia a digitação.
  const i=window.__swapIdx;
  const cur=live.exercises[i];
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()">
    <div class="modal-in">
      <h2>Trocar exercício</h2>
      <div style="font-size:12.5px;color:var(--dim);margin:-6px 0 14px">
        Troca "${esc(cur.name)}" só neste treino de hoje — o treino salvo não muda, e as séries já
        preenchidas nos outros exercícios continuam aí.</div>
      <div class="field"><label>Novo exercício</label>
        <input id="swapq" value="${esc(window.__swapQ)}" placeholder="Buscar ou digitar um nome novo..."
          oninput="swapExQ(this.value)"></div>
      <div id="swapRes" style="max-height:230px;overflow:auto;margin:8px 0 0"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn-ghost" onclick="closeM()">Cancelar</button>
        <button class="btn-a" onclick="confirmSwapExCustom()">Usar nome digitado</button>
      </div>
    </div></div>`;
  renderSwapRes();
  setTimeout(()=>{const el=$('swapq');if(el)el.focus()},150);
}
function renderSwapRes(){
  const q=(window.__swapQ||'').toLowerCase();
  const filtered=q?window.__swapPool.filter(n=>n.toLowerCase().includes(q)):window.__swapPool;
  window.__swapFiltered=filtered;
  const el=$('swapRes');
  if(!el)return;
  el.innerHTML=filtered.length?filtered.map((n,idx)=>`<button class="menu-item" data-act="swapex" data-arg="${idx}">
      <span class="ic">🔁</span>${esc(n)}</button>`).join('')
    :`<div class="empty" style="padding:14px 6px">${window.__swapPool.length?'Nenhum exercício encontrado.':'Nenhum outro exercício cadastrado ainda — digite um nome novo abaixo.'}</div>`;
}
window.swapExQ=v=>{window.__swapQ=v;renderSwapRes();};
window.confirmSwapExCustom=async()=>{
  const el=$('swapq');
  let name=(el?el.value:'').trim();
  if(!name)return toast('Digite um nome ou escolha um da lista');
  const nm=matchExerciseName(name);
  if(nm.status==='suggest'||nm.status==='new'){
    const result=await askExerciseNameCheck(name,nm.status==='suggest'?nm.suggestion:null);
    if(result==null)return; // "Corrigir": deixa o modal de troca aberto pro usuário ajustar
    name=result;
  }
  doSwapEx(name);
};
function doSwapEx(name){
  name=(name||'').trim();
  if(!name)return toast('Escolha ou digite um nome');
  const i=window.__swapIdx;
  if(live.exercises.some((e,idx)=>idx!==i&&e.name.toLowerCase()===name.toLowerCase()))
    return toast('Já existe um exercício com esse nome nesta sessão');
  live.exercises[i].name=name;
  live.exercises[i].swapped=true;
  closeM();render();
  toast('Exercício trocado — vale só para hoje');
}
window.finish=async()=>{
  // guarda o índice original para não deixar um conjugado "órfão" quando o
  // exercício de cima da dupla não foi preenchido e some do registro
  const kept=live.exercises.map((e,idx)=>({e,idx,
    sets:e.sets.filter(s=>s.reps!==''||s.peso!=='')})).filter(x=>x.sets.length);
  const keptIdx=new Set(kept.map(x=>x.idx));
  const ex=kept.map((x,n)=>({name:x.e.name,bw:!!x.e.bw,
    link:n>0&&!!x.e.link&&keptIdx.has(x.idx-1),
    swapped:!!x.e.swapped,
    sets:x.sets}));
  if(!ex.length){if(!await ask('Sair sem salvar?','Nenhuma série foi preenchida neste treino.','Sair',true))return;
    clearInterval(tick);await cleanupAdhoc();view='home';render();return;}
  if(!await ask('Finalizar treino?','Isso salva o treino no histórico como concluído.','Finalizar',false))return;
  pushUndo('concluir treino de musculação');
  const dur=Math.floor((Date.now()-t0)/60000);
  const sid=uid();
  const wDone=S.workouts.find(x=>x.id===live.wid);
  S.history.push({id:sid,wid:live.wid,name:live.name,date:live.date,dur,exercises:ex,
    muscles:(wDone&&wDone.muscles)||[],feedback:(live.feedback||'').trim()});
  // treino esporádico: arquiva automaticamente após a primeira vez que é realizado
  if(wDone&&wDone.adhoc&&!wDone.archived)wDone.archived=true;
  // vincula ao plano
  const pl=live.planId?plans().find(p=>p.id===live.planId)
    :matchPlan('gym',live.date,{wid:live.wid});
  if(pl&&!pl.doneId)pl.doneId=sid;
  await save();clearInterval(tick);view='home';render();toast('Treino salvo ✓');
};

window.setHGymW=v=>{hGymW=v;render()};

function hist(){
  $('title').textContent='Histórico';
  $('back').style.display='block';$('timer').textContent='';
  const gsAll=S.history.map(s=>({k:'gym',date:s.date,d:s}));
  const rrAll=runs().map(r=>({k:'run',date:r.date,d:r}));
  const msAll=S.mobility.map(m=>({k:'mobility',date:m.date,d:m}));
  const osAll=(S.other||[]).map(o=>({k:'other',date:o.date,d:o}));

  // filtro nível 1
  let base = hFlt==='gym'?gsAll : hFlt==='run'?rrAll : hFlt==='mobility'?msAll : hFlt==='other'?osAll
    : [...gsAll,...rrAll,...msAll,...osAll];
  // filtro nível 2
  if(hFlt==='run'&&hRunT!=='all')base=base.filter(x=>x.d.type===hRunT);
  if(hFlt==='gym'&&hGymW!=='all')base=base.filter(x=>x.d.wid===hGymW);
  if(hFlt==='gym'&&hGymM!=='all')base=base.filter(x=>(x.d.muscles||[]).includes(hGymM));
  if(hFlt==='mobility'&&hMobW!=='all')base=base.filter(x=>x.d.wid===hMobW);
  const all=base.sort((a,b)=>b.date-a.date);

  $('sub').textContent=`${gsAll.length} musculação · ${rrAll.length} corrida · ${msAll.length} mobilidade${osAll.length?` · ${osAll.length} diferente`:''}`;

  let h=`<div class="seg" style="margin-bottom:12px">
    <button class="${histView==='list'?'on':''}" onclick="setHistView('list')">🕘 Lista</button>
    <button class="${histView==='cal'?'on':''}" onclick="setHistView('cal')">📅 Calendário</button>
  </div>`;

  h+=`<div class="flt">
    <button class="fb ${hFlt==='all'?'on':''}" onclick="setHFlt('all')">
      Todos <span class="fc">${gsAll.length+rrAll.length+msAll.length+osAll.length}</span></button>
    <button class="fb ${hFlt==='gym'?'on':''}" style="--fbc:var(--accent)" onclick="setHFlt('gym')">
      🏋️ Musculação <span class="fc">${gsAll.length}</span></button>
    <button class="fb ${hFlt==='run'?'on':''}" style="--fbc:#5b8def" onclick="setHFlt('run')">
      🏃 Corrida <span class="fc">${rrAll.length}</span></button>
    <button class="fb ${hFlt==='mobility'?'on':''}" style="--fbc:#5f9e8f" onclick="setHFlt('mobility')">
      🧘 Mobilidade <span class="fc">${msAll.length}</span></button>
    ${osAll.length?`<button class="fb ${hFlt==='other'?'on':''}" style="--fbc:#b98cf0" onclick="setHFlt('other')">
      🧩 Diferente <span class="fc">${osAll.length}</span></button>`:''}
  </div>`;

  // subfiltro de mobilidade
  if(hFlt==='mobility'&&msAll.length){
    const ids=[...new Set(msAll.map(x=>x.d.wid))];
    if(ids.length>1){
      h+=`<div class="flt-sub"><div class="fl">Treino</div><div class="flt">
        <button class="fb ${hMobW==='all'?'on':''}" style="--fbc:#5f9e8f" onclick="setHMobW('all')">
          Todos <span class="fc">${msAll.length}</span></button>
        ${ids.map(id=>{
          const w=S.workouts.find(x=>x.id===id);
          const hs=msAll.filter(x=>x.d.wid===id);
          const nm=w?w.name:(hs[0]?hs[0].d.name:'(removido)');
          return `<button class="fb ${hMobW===id?'on':''}" style="--fbc:#5f9e8f" onclick="setHMobW('${id}')">
            ${esc(nm)}${w&&w.archived?' 📦':''} <span class="fc">${hs.length}</span></button>`;
        }).join('')}</div></div>`;
    }
  }

  // subfiltro de corrida
  if(hFlt==='run'&&rrAll.length){
    const used=RUN_TYPES.filter(t=>rrAll.some(x=>x.d.type===t[0]));
    if(used.length>1){
      h+=`<div class="flt-sub"><div class="fl">Tipo de treino</div><div class="flt">
        <button class="fb ${hRunT==='all'?'on':''}" style="--fbc:#5b8def" onclick="setHRunT('all')">
          Todos <span class="fc">${rrAll.length}</span></button>
        ${used.map(t=>{
          const n=rrAll.filter(x=>x.d.type===t[0]).length;
          return `<button class="fb ${hRunT===t[0]?'on':''}" style="--fbc:${t[3]}" onclick="setHRunT('${t[0]}')">
            <i style="background:${t[3]}"></i>${t[1]} <span class="fc">${n}</span></button>`;
        }).join('')}</div></div>`;
    }
  }
  // subfiltro de musculação
  if(hFlt==='gym'&&gsAll.length){
    const ids=[...new Set(gsAll.map(x=>x.d.wid))];
    if(ids.length>1){
      h+=`<div class="flt-sub"><div class="fl">Treino</div><div class="flt">
        <button class="fb ${hGymW==='all'?'on':''}" style="--fbc:var(--accent)" onclick="setHGymW('all')">
          Todos <span class="fc">${gsAll.length}</span></button>
        ${ids.map(id=>{
          const w=S.workouts.find(x=>x.id===id);
          const hs=gsAll.filter(x=>x.d.wid===id);
          const nm=w?w.name:(hs[0]?hs[0].d.name:'(removido)');
          const c=wColor(w)||'var(--accent)';
          return `<button class="fb ${hGymW===id?'on':''}" style="--fbc:${c}" onclick="setHGymW('${id}')">
            <i style="background:${c}"></i>${esc(nm)}${w&&w.archived?' 📦':''} <span class="fc">${hs.length}</span></button>`;
        }).join('')}</div></div>`;
    }
    const usedM=MUSCLE_GROUPS.filter(g=>gsAll.some(x=>(x.d.muscles||[]).includes(g[0])));
    if(usedM.length){
      h+=`<div class="flt-sub"><div class="fl">Grupo muscular</div><div class="flt">
        <button class="fb ${hGymM==='all'?'on':''}" style="--fbc:var(--accent)" onclick="setHGymM('all')">

        ${usedM.map(g=>{

        }).join('')}</div></div>`;
    }
  }

  if(!all.length){
    const msg=hFlt==='all'?'Nenhum treino registrado ainda.'
      :'Nenhum registro com este filtro.';
    h+=`<div class="empty">${msg}</div>`;
    $('app').innerHTML=h;$('fab').innerHTML='';return;
  }

  // resumo do recorte
  if(hFlt==='run'){

    h+=`<div class="hist-count">${all.length} sessão(ões) · volume acumulado ${Math.round(vol).toLocaleString('pt-BR')} kg</div>`;
  }else if(hFlt==='mobility'){
    const totSec=all.reduce((a,x)=>a+(x.d.sec||0),0);
    h+=`<div class="hist-count">${all.length} sessão(ões) · ${fmtDur(totSec)} no total</div>`;
  }else{
    h+=`<div class="hist-count">${all.length} registro(s)</div>`;
  }

  all.forEach(it=>{
    if(it.k==='run'){
      const r=it.d, t=rType(r.type);
      h+=`<div class="run-card" style="--rc:${t[3]}" onclick="runMenu('${r.id}')">
        <div class="run-top"><span style="font-size:16px">${t[2]}</span>

        <div class="run-metrics">
          <div class="rm"><b>${r.km.toFixed(2)}</b><span>km</span></div>
          <div class="rm"><b>${fmtDur(r.sec)}</b><span>tempo</span></div>
          <div class="rm"><b>${fmtPace(paceOf(r.km,r.sec))}</b><span>pace</span></div>
          ${levelBadge(r)}
        </div>${structSummary(r)}</div>`;
      return;
    }
    if(it.k==='other'){
      const o=it.d;
      h+=`<div class="card w-card" style="--wc:#b98cf0" data-c="1"><div class="hist-row">
        <strong>🧩 ${esc(o.name||OTHER_DEFAULT_NAME)}</strong><span>${fdateW(o.date)}</span></div>
        <div class="hist-row"><span style="color:var(--txt);white-space:pre-wrap">${esc(o.desc)}</span></div>
        <div class="row" style="margin-top:10px">
          <button class="btn-ghost btn-sm" style="color:#ff5a5a" onclick="delOther('${o.id}')">Excluir registro</button>
        </div></div>`;
      return;
    }
    if(it.k==='mobility'){
      const m=it.d;
      const w=S.workouts.find(x=>x.id===m.wid);
      const c=wColor(w);
      h+=`<div class="card w-card" ${c?`data-c="1" style="--wc:${c}"`:''}><div class="hist-row">
        <strong>🧘 ${esc(m.name)}</strong><span>${fdateW(m.date)} · ${fmtDur(m.sec)}</span></div>
        ${mobPillHTML(m)}`;
      m.exercises.forEach(e=>{
        h+=`<div class="hist-row"><span style="color:var(--txt)">${esc(e.name)}</span></div>`;
      });
      h+=fbBox(m.feedback);
      h+=`<div class="row" style="margin-top:10px">
        <button class="btn-ghost btn-sm" style="color:#ff5a5a" onclick="delMobH('${m.id}')">Excluir sessão</button>
      </div></div>`;
      return;
    }
    const s=it.d;
    const w=S.workouts.find(x=>x.id===s.wid);
    const c=wColor(w);
    const exp=histExp.has(s.id);
    const vol=s.exercises.reduce((a,e)=>a+e.sets.reduce((b,x)=>
      b+(parseFloat(x.reps)||0)*(parseFloat(x.peso)||0),0),0);
    h+=`<div class="card w-card" ${c?`data-c="1" style="--wc:${c}"`:''}>
      <div class="hist-row" style="cursor:pointer" onclick="toggleHistExp('${s.id}')">
        <strong>🏋️ ${esc(s.name)}</strong>
        <span style="display:flex;align-items:center;gap:8px">${fdateW(s.date)}${s.dur?' · '+s.dur+'min':''}
          <span style="transition:transform .2s;transform:rotate(${exp?'180':'0'}deg);display:inline-block">▾</span></span>
      </div>`;
    if(exp){
      h+=musclesPillHTML(s.muscles);
      const hg=exGroups(s.exercises);
      s.exercises.forEach((e,ei)=>{
        h+=`<div class="hist-row"><span style="color:var(--txt)">${grpTag(hg[ei])}${esc(e.name)}${e.bw?'<span class="tag-pc">PC</span>':''}</span>
          <span>${e.sets.map(x=>fmtSet(x.reps,x.peso,e.bw)).join(' · ')}</span></div>`;
      });
      h+=`<div class="hist-row"><span>Volume total</span><span><b style="color:var(--accent2)">${Math.round(vol)} kg</b></span></div>`;
      h+=fbBox(s.feedback);
      h+=`<div class="row" style="margin-top:10px">
        <button class="btn-ghost btn-sm" onclick="event.stopPropagation();editHist('${s.id}')">✎ Editar treino</button>
        <button class="btn-ghost btn-sm" style="color:#ff5a5a" onclick="event.stopPropagation();delH('${s.id}')">Excluir sessão</button>
      </div>`;
    }
    h+='</div>';
  });
  $('app').innerHTML=h;$('fab').innerHTML='';
}

        <button class="btn-sm btn-ghost" onclick="ehAddSet(${i})">+ série</button></div></div>
      <div class="ex-body">
        <div class="set-hdr"><div>#</div><div>Reps</div>
          <div>${ex.bw?'Peso corporal':'Carga (kg)'}</div><div></div></div>
        ${ex.sets.map((st,j)=>`<div class="set">
          <div class="set-n">${j+1}</div>
          <input type="number" inputmode="numeric" pattern="[0-9]*" value="${esc(st.reps)}"
            placeholder="–" oninput="ehVal(${i},${j},'reps',this.value)">
          <input type="number" inputmode="decimal" step="0.5" value="${esc(st.peso)}"
            placeholder="${ex.bw?'—':'–'}" ${ex.bw?'disabled':''} oninput="ehVal(${i},${j},'peso',this.value)">
          <button class="del" onclick="ehRmSet(${i},${j})">✕</button></div>`).join('')}

      oninput="window.__ehFeedback=this.value">${esc(window.__ehFeedback||'')}</textarea>
    <div style="font-size:11px;color:var(--dim);line-height:1.5;margin-top:4px">

window.saveEditHist=async()=>{
  const s=S.history.find(x=>x.id===window.__ehId); if(!s)return;
  const keptE=window.__ehExs.map((e,idx)=>({e,idx,
    sets:e.sets.filter(st=>st.reps!==''||st.peso!=='')})).filter(x=>x.sets.length);
  const keptEi=new Set(keptE.map(x=>x.idx));
  const exs=keptE.map((x,n)=>({name:(x.e.name||'').trim()||'Exercício',bw:!!x.e.bw,
    link:n>0&&!!x.e.link&&keptEi.has(x.idx-1),sets:x.sets}));

let repMode='workout', repSel='';
window.openRep=()=>{view='rep';repSel='';render()};
window.setMode=m=>{repMode=m;repSel='';render()};

const num=v=>parseFloat(String(v).replace(',','.'))||0;
const volOf=sets=>sets.reduce((a,s)=>a+num(s.reps)*num(s.peso),0);
const maxOf=sets=>sets.reduce((a,s)=>Math.max(a,num(s.peso)),0);
const repsOf=sets=>sets.reduce((a,s)=>a+num(s.reps),0);
// 1RM estimado (Epley) usando a melhor série
const e1rm=sets=>sets.reduce((a,s)=>{
  const p=num(s.peso),r=num(s.reps);
  return p&&r?Math.max(a,p*(1+r/30)):a;},0);

function pct(first,last){
  if(!first)return null;
  return ((last-first)/first)*100;
}
function deltaHTML(first,last,unit){
  const d=last-first, p=pct(first,last);
  if(p===null||Math.abs(d)<0.01)return '<span class="delta flat">— sem variação</span>';
  const cls=d>0?'up':'down', arw=d>0?'▲':'▼';
  return `<span class="delta ${cls}">${arw} ${d>0?'+':''}${d.toFixed(1)}${unit}`+
    (p!==null?` (${p>0?'+':''}${p.toFixed(0)}%)`:'')+'</span>';
}
function sparkline(vals,labels){
  if(vals.length<2)return '';
  const w=300,h=76,pad=8;
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>{
    const x=pad+(i/(vals.length-1))*(w-pad*2);
    const y=h-pad-((v-mn)/rng)*(h-pad*2);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${h-pad} L${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const rising=vals[vals.length-1]>=vals[0];
  const col=rising?'var(--accent2)':'#ff5a5a';
  const dots=pts.map((p,i)=>
    `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?3.5:2.3}"
      fill="${col}"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${area}" fill="${col}" opacity=".12"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>
    <div class="axis"><span>${labels[0]}</span><span>${labels[labels.length-1]}</span></div>`;
}

function repWorkout(){
  // agrupa por ID (não por nome) — dois treinos podem ter o mesmo nome
  const ids=[...new Set(S.history.map(h=>h.wid))];
  if(!ids.length)return '<div class="empty">Nenhuma sessão registrada ainda.<br>Faça alguns treinos para ver a evolução.</div>';
  const wOpts=ids.map(id=>{
    const w=S.workouts.find(x=>x.id===id);
    const hs=S.history.filter(h=>h.wid===id);
    const nm=w?w.name:(hs[0]?hs[0].name:'(removido)');
    const dup=ids.filter(o=>{
      const ow=S.workouts.find(x=>x.id===o);
      const ohs=S.history.filter(h=>h.wid===o);
      return (ow?ow.name:(ohs[0]?ohs[0].name:''))===nm;
    }).length>1;
    let lbl=nm;
    if(dup)lbl+=' · desde '+fdate(Math.min(...hs.map(h=>h.date)));
    if(w&&w.archived)lbl+=' [arquivado]';
    if(!w)lbl+=' [excluído]';
    return{id,lbl};
  });
  const opts=wOpts;
  const sel=opts.find(o=>o.id===repSel)?repSel:opts[0].id;
  let h=`<div class="field"><label>Selecione o treino</label>
    <select onchange="setSel(this.value)">
      ${wOpts.map(o=>
        `<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.lbl)}</option>`).join('')}
    </select></div>`;
  const ss=S.history.filter(x=>x.wid===sel).sort((a,b)=>a.date-b.date);
  if(ss.length<2){
    return h+`<div class="empty">Apenas ${ss.length} sessão registrada deste treino.<br>São necessárias pelo menos 2 para comparar.</div>`;
  }
  const vols=ss.map(s=>s.exercises.reduce((a,e)=>a+volOf(e.sets),0));
  const labs=ss.map(s=>fdate(s.date).slice(0,5));
  const f=vols[0],l=vols[vols.length-1];
  h+=`<div class="card">
    <div class="rep-h"><strong>Volume total por sessão</strong>${deltaHTML(f,l,' kg')}</div>
    ${sparkline(vols,labs)}
    <div class="stats">
      <div class="stat"><b>${ss.length}</b><span>sessões</span></div>
      <div class="stat"><b>${Math.round(Math.max(...vols))}</b><span>pico kg</span></div>
      <div class="stat"><b>${Math.round(vols.reduce((a,b)=>a+b,0)/vols.length)}</b><span>média kg</span></div>
    </div>
    <div class="rec">Volume = soma de (repetições × peso) de todas as séries.</div></div>`;

  // por exercício dentro do treino
  const exNames=[...new Set(ss.flatMap(s=>s.exercises.map(e=>e.name)))];
  h+='<div style="margin:16px 0 8px;font-size:13px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.5px">Por exercício</div>';
  exNames.forEach(n=>{
    const isBW=ss.some(s=>{const e=s.exercises.find(x=>x.name===n);return e&&e.bw});
    const pcTag=isBW?'<span class="tag-pc">PC</span>':'';
    const pts=ss.map(s=>{const e=s.exercises.find(x=>x.name===n);
      return e?{d:s.date,mx:maxOf(e.sets),vol:volOf(e.sets)}:null}).filter(Boolean);
    if(pts.length<2){
      h+=`<div class="card"><div class="rep-h"><strong>${esc(n)}${pcTag}</strong>
        <span class="delta flat">1 registro</span></div>
        <div class="mini">Carga máx: <b>${pts.length?pts[0].mx:0} kg</b></div></div>`;
      return;
    }
    const mxs=pts.map(p=>p.mx), ls=pts.map(p=>fdate(p.d).slice(0,5));
    h+=`<div class="card">
      <div class="rep-h"><strong>${esc(n)}${pcTag}</strong>${deltaHTML(mxs[0],mxs[mxs.length-1],' kg')}</div>
      ${sparkline(mxs,ls)}
      <div class="mini">${isBW?'Peso corporal':'Carga máxima'}: <b>${mxs[0]} kg</b> → <b>${mxs[mxs.length-1]} kg</b>
        · recorde <b>${Math.max(...mxs)} kg</b></div></div>`;
  });
  return h;
}

function repExercise(){
  const all=[...new Set(S.history.flatMap(s=>s.exercises.map(e=>e.name)))].sort();
  if(!all.length)return '<div class="empty">Nenhum exercício registrado ainda.</div>';
  const sel=repSel||all[0];
  let h=`<div class="field"><label>Selecione o exercício</label>
    <select onchange="setSel(this.value)">${all.map(n=>
      `<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
  const pts=[];
  S.history.slice().sort((a,b)=>a.date-b.date).forEach(s=>{
    const e=s.exercises.find(x=>x.name===sel);
    if(e)pts.push({d:s.date,w:s.name,mx:maxOf(e.sets),vol:volOf(e.sets),
      reps:repsOf(e.sets),sets:e.sets,rm:e1rm(e.sets),bw:!!e.bw});
  });
  if(pts.length<2){
    return h+`<div class="empty">Apenas ${pts.length} registro deste exercício.<br>São necessários pelo menos 2 para comparar.</div>`;
  }
  const ls=pts.map(p=>fdate(p.d).slice(0,5));
  const mxs=pts.map(p=>p.mx), vls=pts.map(p=>p.vol), rms=pts.map(p=>p.rm);
  const first=pts[0], last=pts[pts.length-1];
  const dias=Math.round((last.d-first.d)/86400000);

  const isBW=pts.some(p=>p.bw);
  const mixed=isBW&&pts.some(p=>!p.bw);

  h+=`<div class="card">
    <div class="rep-h"><strong>${isBW?'Peso corporal':'Carga máxima'}${isBW?'<span class="tag-pc">PC</span>':''}</strong>${deltaHTML(mxs[0],mxs[mxs.length-1],' kg')}</div>
    ${sparkline(mxs,ls)}
    <div class="stats">
      <div class="stat"><b>${Math.max(...mxs)}</b><span>${isBW?'máx kg':'recorde kg'}</span></div>
      <div class="stat"><b>${pts.length}</b><span>sessões</span></div>
      <div class="stat"><b>${dias}</b><span>dias</span></div>
    </div>
    ${isBW?`<div class="rec">Exercício com peso corporal. Aqui uma <b>queda</b> no valor pode
      significar perda de peso, não perda de força — olhe as repetições junto.</div>`:''}
    ${mixed?'<div class="rec">⚠️ Este exercício tem sessões marcadas como peso corporal e outras como carga externa. Os números não são diretamente comparáveis entre si.</div>':''}</div>`;

  h+=`<div class="card">
    <div class="rep-h"><strong>Volume por sessão</strong>${deltaHTML(vls[0],vls[vls.length-1],' kg')}</div>
    ${sparkline(vls,ls)}
    <div class="mini">Total acumulado: <b>${Math.round(vls.reduce((a,b)=>a+b,0))} kg</b>
      · média <b>${Math.round(vls.reduce((a,b)=>a+b,0)/vls.length)} kg</b>/sessão</div></div>`;

  const repsArr=pts.map(p=>p.reps);
  h+=`<div class="card">
    <div class="rep-h"><strong>Repetições por sessão</strong>${deltaHTML(repsArr[0],repsArr[repsArr.length-1],' reps')}</div>
    ${sparkline(repsArr,ls)}
    <div class="rec">${isBW?'Para exercícios de peso corporal, a soma de repetições é o melhor indicador de progresso — é ela que aumenta quando você fica mais forte.':'Soma das repetições de todas as séries deste exercício na sessão.'}</div></div>`;
  if(!isBW){
    h+=`<div class="card">
      <div class="rep-h"><strong>1RM estimado</strong>${deltaHTML(rms[0],rms[rms.length-1],' kg')}</div>
      ${sparkline(rms,ls)}
      <div class="rec">Estimativa pela fórmula de Epley (peso × [1 + reps/30]). É uma projeção
        teórica de força máxima, não um valor para testar na prática.</div></div>`;
  }

  h+=`<div class="card"><div class="rep-h"><strong>Sessão a sessão</strong></div>`;
  pts.slice().reverse().forEach((p,i,arr)=>{
    const prev=arr[i+1];
    const d=prev?p.mx-prev.mx:null;
    const tag=d===null?'':d>0?`<span class="up">▲ +${d.toFixed(1)}</span>`
      :d<0?`<span class="down">▼ ${d.toFixed(1)}</span>`:'<span class="flat">=</span>';
    h+=`<div class="hist-row">
      <span style="color:var(--txt)">${fdate(p.d)} <span class="pill">${esc(p.w)}</span>${p.bw?'<span class="tag-pc">PC</span>':''}</span>
      <span>${p.sets.map(s=>fmtSet(s.reps,s.peso,p.bw)).join(' · ')} ${tag}</span></div>`;
  });
  h+='</div>';
  return h;
}

/* ---------- EVOLUÇÃO · MOBILIDADE ---------- */
let mobPer='week';
window.setMobPer=v=>{mobPer=v;render()};
function mobReport(){
  $('title').textContent='Evolução · Mobilidade';
  $('sub').textContent='Sessões e foco';
  $('back').style.display='block';$('timer').textContent='';
  const ms=S.mobility;
  if(!ms.length){
    $('app').innerHTML=modsHTML('mobility')+'<div class="empty">Nenhum treino de mobilidade registrado ainda.</div>';
    $('fab').innerHTML='';return;
  }
  let h=modsHTML('mobility');
  h+=`<div class="seg">
    ${[['day','Dia'],['week','Semana'],['month','Mês'],['year','Ano']].map(([k,l])=>
      `<button class="${mobPer===k?'on':''}" onclick="setMobPer('${k}')">${l}</button>`).join('')}
  </div>`;
  const from=periodFrom(mobPer);
  const rec=ms.filter(m=>m.date>=from);
  const totSec=rec.reduce((a,m)=>a+(m.sec||0),0);
  const perLbl={day:'últimos 14 dias',week:'últimas 12 semanas',month:'últimos 12 meses',year:'últimos 5 anos'}[mobPer];
  h+=`<div class="card">
    <div class="rep-h"><strong>Resumo do período</strong><span class="delta flat">${perLbl}</span></div>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><b>${rec.length}</b><span>sessões</span></div>
      <div class="stat"><b>${fmtDur(totSec)}</b><span>tempo total</span></div>
    </div></div>`;

  // distribuição por região
  const byR=MOBILITY_REGIONS.map(g=>{
    const f=rec.filter(m=>(m.regions||[]).includes(g[0]));
    return{g,n:f.length};
  }).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const tR=byR.reduce((a,x)=>a+x.n,0)||1;
  h+=`<div class="card"><div class="rep-h"><strong>Distribuição por região</strong>
    <span class="delta flat">${perLbl}</span></div>`;
  if(!byR.length)h+='<div class="empty" style="padding:20px 10px">Nenhuma sessão nesse período.</div>';
  byR.forEach(x=>{
    const p=(x.n/tR)*100;
    h+=`<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
        <span style="color:var(--txt);font-weight:600">${x.g[2]} ${x.g[1]}</span>
        <span style="color:var(--dim)">${x.n}× · ${p.toFixed(0)}%</span></div>
      <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${p}%;background:#5f9e8f;border-radius:4px"></div></div></div>`;
  });
  h+='</div>';

  // distribuição por foco (subtópico)
  const byT=MOBILITY_TAGS.map(g=>{
    const f=rec.filter(m=>(m.tags||[]).includes(g[0]));
    return{g,n:f.length};
  }).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const tT=byT.reduce((a,x)=>a+x.n,0)||1;
  h+=`<div class="card"><div class="rep-h"><strong>Distribuição por foco</strong>
    <span class="delta flat">${perLbl}</span></div>`;
  if(!byT.length)h+='<div class="empty" style="padding:20px 10px">Nenhuma sessão classificada nesse período.</div>';
  byT.forEach(x=>{
    const p=(x.n/tT)*100;
    h+=`<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
        <span style="color:var(--txt);font-weight:600">${x.g[2]} ${x.g[1]}</span>
        <span style="color:var(--dim)">${x.n}× · ${p.toFixed(0)}%</span></div>
      <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${p}%;background:var(--accent2);border-radius:4px"></div></div></div>`;
  });
  h+='</div>';

  $('app').innerHTML=h;
  $('fab').innerHTML='';
}

    view='home';

    const has=liveM&&liveM.exercises.some(e=>e.done);

  }else view='home';
  repSel='';render();
};

<!-- ---------- Nuvem (Firebase): login + Firestore como banco de dados na nuvem ----------
     Guarda o app inteiro (a variável S) como um único documento em users/{uid}/data/main.
     Os dados continuam também em localStorage/IndexedDB no aparelho (igual antes),
     agora como cache local — o Firestore que passa a ser a cópia de segurança. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged,
    signInWithEmailAndPassword, sendPasswordResetEmail, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
  import {
    getFirestore, doc, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBe8twGSIdVHMh_4bEyU_zhwR8aZ3g0WsY",
    authDomain: "treinohyb.firebaseapp.com",
    projectId: "treinohyb",
    storageBucket: "treinohyb.firebasestorage.app",
    messagingSenderId: "226771452650",
    appId: "1:226771452650:web:cb3e8e91984a30fa718d93"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  try{ await setPersistence(auth, browserLocalPersistence); }catch(e){}

  // documento único, compartilhado com o planejador do PC: os dois leem e gravam
  // direto aqui (mesmo objeto S inteiro) — não existe mais mailbox/importação.
  const cloudDocRef = (uid) => doc(db, 'users', uid, 'data', 'main');

  // lê + mescla + grava numa transação só (a mesclagem em si é o fn, vindo do comum.js):
  // se o outro aparelho gravar no meio, o Firestore repete com a versão nova
  window.__cloudTx = async function(fn){
    const user = auth.currentUser;
    if(!user) return null;
    try{
      return await runTransaction(db, async (tx) => {
        const ref = cloudDocRef(user.uid);
        const snap = await tx.get(ref);
        let remote = null;
        if(snap.exists()){ try{ remote = JSON.parse(snap.data().payload); }catch(e){} }
        const out = fn(remote);
        if(remote && JSON.stringify(out) === JSON.stringify(remote)) return remote; // nada novo pra gravar
        out._updatedAt = Math.max(Date.now(), ((remote && remote._updatedAt) || 0) + 1);
        tx.set(ref, { payload: JSON.stringify(out), updatedAt: out._updatedAt });
        return out;
      });
    }catch(e){ return null; }
  };
  window.cloudSignOut = async function(){
    try{ localStorage.removeItem('treinos-auth'); }catch(e){}
    try{ await signOut(auth); }catch(e){}
    location.reload();
  };

  const gate = document.getElementById('authgate');
  const gateForm = document.getElementById('authgate-form');
  const gateErr = document.getElementById('authgate-err');

  onAuthStateChanged(auth, async (user) => {
    if(user){
      window.__cloudEmail = user.email;
      try{ localStorage.setItem('treinos-auth','1'); }catch(e){}
      gate.style.display = 'none';
      if(!window.__booted){ window.__booted = true; if(typeof window.load === 'function') await window.load(); }
      else if(typeof window.cloudSync === 'function') window.cloudSync(); // já abriu offline: só sincroniza
    }else{
      try{ localStorage.removeItem('treinos-auth'); }catch(e){}
      gate.style.display = 'flex';
    }
  });

  gateForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    gateErr.textContent = '';
    const email = document.getElementById('authgate-email').value.trim();
    const pass = document.getElementById('authgate-pass').value;
    try{
      await signInWithEmailAndPassword(auth, email, pass);
    }catch(err){
      gateErr.textContent = 'Não foi possível entrar. Confira e-mail e senha.';
    }
  });

  document.getElementById('authgate-reset').addEventListener('click', async () => {
    const email = document.getElementById('authgate-email').value.trim();
    if(!email){ gateErr.textContent = 'Digite seu e-mail no campo acima primeiro.'; return; }
    try{
      await sendPasswordResetEmail(auth, email);
      gateErr.style.color = 'var(--accent2)';
      gateErr.textContent = 'E-mail de redefinição enviado — confira sua caixa de entrada.';
    }catch(err){
      gateErr.style.color = '#ff5a5a';
      gateErr.textContent = 'Não foi possível enviar o e-mail de redefinição.';
    }
  });
</script>
